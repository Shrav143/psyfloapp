<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Psyflo — Dashboard</title>
</head>
<body>
<x-dc>
<helmet>
<style>
/* Dashboard: Patients, Documents and Staff views. Prefixes d- (page, roster) and doc- (Documents and Staff views, review drawer). Tokens and the shared kit come from tokens.css and components.css. */
.d-page{max-width:1320px;margin:0 auto;padding:var(--sp-5) var(--gutter) 64px;display:flex;flex-direction:column;gap:var(--sp-4);min-width:0}
.d-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.d-head h1{margin:0 8px 0 0;font:600 var(--fs-28)/var(--lh-28) var(--font);letter-spacing:-.01em}
/* the view switch: Patients | Documents | Staff, with the on-time figure and the due range on the right of the Documents view */
.d-tools{display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--sp-3) var(--sp-4)}
.d-tools:empty{display:none}
.d-tools__r{margin-left:auto;display:flex;gap:var(--sp-4);align-items:flex-end;flex-wrap:wrap}
.d-view-wrap{display:inline-flex;align-items:center;gap:6px}
.d-view{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line-300,var(--line-200));border-radius:var(--r-pill);background:var(--surface-0)}
.d-view__b{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 16px;border-radius:var(--r-pill);color:var(--muted-700);font:600 var(--fs-14)/1 var(--font);text-decoration:none;white-space:nowrap}
.d-view__b:hover{color:var(--ink-900);background:var(--sand-100)}
.d-view__b[aria-current=page]{background:var(--teal-600);color:#fff}
.d-page .ui-fbar{align-items:flex-end}
.d-qt .ui-qt__scroll{max-height:none}
.d-table{table-layout:auto}
.d-table th,.d-table td{vertical-align:top}
.d-table td{padding:12px}
.d-table .d-all{margin-left:8px;vertical-align:middle}
.d-table thead .ui-qt__sort{display:inline-flex;align-items:center;min-height:24px;min-width:24px;padding:3px 2px}
.d-nm{display:flex;align-items:flex-start;gap:6px}
.d-row.is-urgent .d-c-name{box-shadow:inset 3px 0 0 var(--danger-fg)}
.d-row td{border-top:1px solid var(--line-200)}
.d-table tbody tr:first-child td{border-top:0}
.d-tog{flex:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin:-2px 0 0 -6px;border:0;border-radius:var(--r-2);background:none;color:var(--muted-700);cursor:pointer}
.d-tog:hover{background:var(--sand-100);color:var(--ink-900)}
.d-tog svg{transition:transform .12s}
.d-tog[aria-expanded=false] svg{transform:rotate(-90deg)}
.d-tog--none{cursor:default;pointer-events:none}
.d-name{display:flex;flex-direction:column;min-width:0}
.d-link{display:inline-flex;align-items:center;min-height:24px;color:var(--ink-900);font-weight:600;font-size:var(--fs-14);text-decoration:none}
.d-link:hover{color:var(--teal-700);text-decoration:underline}
.d-sub{display:flex;align-items:center;gap:2px;color:var(--muted-700);font-size:var(--fs-12);line-height:var(--lh-12);margin-top:2px;white-space:nowrap}
.d-sub .ui-hint__b,.d-resp .ui-hint__b{min-height:24px}
.d-resp{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.d-none{color:var(--muted-700)}
.d-badges{display:inline-flex;flex-wrap:wrap;gap:6px}
.d-badge{display:inline-flex;align-items:center;height:24px;padding:0 5px;border-radius:var(--r-pill);font-size:var(--fs-12);border:1px solid transparent}
.d-badge .ui-hint__b,.d-alert .ui-hint__b{min-height:24px;min-width:24px;color:inherit;border-radius:var(--r-pill)}
.d-badge .ui-hint__b:hover,.d-alert .ui-hint__b:hover{background:none}
.d-badge--r{background:var(--danger-bg);color:var(--danger-fg)}
.d-badge--y{background:var(--warning-bg);color:var(--warning-fg)}
.d-badge--b{background:var(--teal-tint);color:var(--teal-700)}
.d-auth{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.d-alerts{display:flex;align-items:center;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.d-alert{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 3px;border-radius:var(--r-pill);text-decoration:none;font-size:var(--fs-12);font-weight:600}
.d-alert--r{background:var(--danger-bg);color:var(--danger-fg)}
.d-alert--y{background:var(--warning-bg);color:var(--warning-fg)}
.d-alert--more{background:var(--sand-100);color:var(--ink-900)}
.d-open{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:var(--r-2);color:var(--muted-700);text-decoration:none}
.d-open:hover{background:var(--sand-100);color:var(--ink-900)}
.d-c-alerts{text-align:right}
/* two-person confirmations */
.d-confirms{list-style:none;margin:0;padding:0;border:1px solid var(--line-200);border-radius:var(--r-2);background:var(--surface-0)}
.d-confirm{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:4px 12px;padding:8px 12px;border-top:1px solid var(--line-200)}
.d-confirm:first-child{border-top:0}
.d-confirm__i{display:inline-flex;color:var(--teal-700)}
.d-confirm__t{font-weight:600;min-width:0}
/* items under a patient */
.d-items-row td{padding:0 12px 12px 46px;border-top:0;background:var(--surface-0)}
.d-items-row[hidden]{display:none}
.d-items{list-style:none;margin:0;padding:0;border:1px solid var(--line-200);border-radius:var(--r-2);background:var(--sand-50)}
.d-item{display:grid;grid-template-columns:28px minmax(0,1fr) 120px auto;align-items:center;gap:4px 12px;padding:6px 12px;border-top:1px solid var(--line-200)}
.d-item:first-child{border-top:0}
.d-item__i{display:inline-flex}
.d-item__t{min-width:0;display:flex;flex-wrap:wrap;gap:0 8px;align-items:center}
.d-item__t b{font-weight:600}
.d-item__p{color:var(--muted-700);font-size:var(--fs-13)}
.d-item__d{font-size:var(--fs-13);color:var(--ink-900);white-space:nowrap}
.d-item--r .d-item__d{color:var(--danger-fg);font-weight:600}
.d-item__a{display:inline-flex;gap:6px;justify-content:flex-end}
/* Documents and Staff views (the former Documentation screen) */
.doc-ontime{font-size:var(--fs-14)}
.doc-ontime .ui-hint__b{min-height:28px;font-size:var(--fs-14);gap:6px}
.doc-ontime .ui-hint__n{font-size:var(--fs-18);line-height:var(--lh-18);color:var(--ink-900)}
.doc-range{border:0;margin:0;padding:0;display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.doc-range__l{float:left;width:100%;font-size:var(--fs-12);line-height:var(--lh-12);font-weight:600;color:var(--muted-700);padding:0;margin-bottom:2px}
.doc-range__f input{width:150px}
.doc-sub{display:block;color:var(--muted-700);font-size:var(--fs-12);line-height:var(--lh-12);margin-top:2px;white-space:nowrap}
.doc-nw{white-space:nowrap}
.doc-muted{color:var(--muted-700)}
[data-ui-id^="doc"] .ui-qt__table td{padding:7px 7px;vertical-align:middle}
[data-ui-id^="doc"] .ui-qt__table th{padding-left:7px;padding-right:7px}
[data-ui-id="doc"] .ui-qt__table td:last-child{white-space:nowrap}
[data-ui-id^="doc"] .ui-qt__link{color:inherit}
[data-ui-id^="doc"] .ui-qt__table .ui-chip{padding:0 8px}
.doc-acts{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.doc-sample{display:flex;align-items:center}
.doc-acc{background:var(--surface-0);border:1px solid var(--line-200);border-radius:var(--r-3);padding:10px 16px}
.doc-acc summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center;gap:8px}
.doc-acc ul{margin:8px 0 0;padding-left:18px}
.doc-acc li{margin:4px 0}
.doc-hidden{display:flex;align-items:center;gap:8px;color:var(--muted-700);font-size:var(--fs-13)}
/* review drawer */
.doc-rv{display:flex;flex-direction:column;gap:var(--sp-3)}
.doc-rv__who{font-weight:600;color:var(--muted-700);font-size:var(--fs-13)}
.doc-rv__chips,.doc-rv__checks{display:flex;flex-wrap:wrap;gap:6px}
.doc-rv__cmp{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.doc-rv__cmp section{border:1px solid var(--line-200);border-radius:var(--r-2);padding:10px 12px;min-width:0}
.doc-rv__cmp h3{margin:0 0 6px;font:600 var(--fs-13)/var(--lh-13) var(--font);display:flex;align-items:center;gap:6px}
.doc-rv__txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:var(--fs-14);line-height:1.45}
.doc-rv mark.mw-add{background:var(--success-bg);color:inherit;border-radius:3px;padding:0 2px}
.doc-rv__pat{display:flex;align-items:center;gap:6px;font-size:var(--fs-13);color:var(--warning-fg)}
.doc-rv__trail{font-size:var(--fs-12);color:var(--muted-700);line-height:1.4}
.doc-rv__lau{margin:0}
.doc-err{color:var(--danger-fg);font-size:var(--fs-13);min-height:18px}
@media (max-width:1099px){.d-hide-lt-1100{display:none}}
/* phone and narrow: each patient becomes a card; the column names come back as small labels */
@media (max-width:820px){
  .d-page{padding:16px 16px 40px}
  .d-tools__r{margin-left:0;width:100%}
  .doc-range__f input{width:132px}
  .doc-rv__cmp{grid-template-columns:1fr}
  .d-view__b{padding:0 12px;min-height:40px}
  .d-item__a{grid-column:2;justify-content:flex-start}
  .d-item__a .ui-hint__b,.d-item__i .ui-hint__b{min-width:44px;min-height:44px}
  .d-qt{background:none;border:0;border-radius:0}
  .d-table,.d-table tbody,.d-table tr,.d-table td{display:block;width:100%}
  .d-table thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .d-table thead .d-all{position:static}
  .d-row{margin-top:12px;background:var(--surface-0);border:1px solid var(--line-200);border-radius:var(--r-3) var(--r-3) 0 0;padding:4px 0}
  .d-row.is-urgent{border-left:3px solid var(--danger-fg)}
  .d-row td,.d-table tbody tr:first-child td{border-top:0;padding:6px 14px}
  .d-row.is-urgent .d-c-name{box-shadow:none}
  .d-row td[data-label]::before{content:attr(data-label);display:block;font-size:var(--fs-12);font-weight:600;color:var(--muted-700);margin-bottom:2px}
  .d-row td.d-empty{display:none}
  .d-c-alerts{text-align:left}
  .d-alerts{justify-content:flex-start}
  .d-items-row td{padding:0 0 4px 0;background:none}
  .d-items{border-radius:0 0 var(--r-3) var(--r-3);border-top:0}
  .d-item{grid-template-columns:44px minmax(0,1fr);padding:6px 10px}
  .d-item__d{grid-column:2}
  /* the Documents table becomes one card per document: patient and status, document and due date, then the icons */
  [data-ui-id="doc"] .ui-qt__scroll{overflow:visible}
  [data-ui-id="doc"] .ui-qt__table,[data-ui-id="doc"] .ui-qt__table tbody{display:block;width:100%}
  [data-ui-id="doc"] .ui-qt__table thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  [data-ui-id="doc"] .ui-qt__table tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;margin-top:10px;padding:6px 0;background:var(--surface-0);border:1px solid var(--line-200);border-radius:var(--r-3)}
  [data-ui-id="doc"] .ui-qt__table td{display:block;border:0;padding:3px 14px;white-space:normal}
  [data-ui-id="doc"] .ui-qt__table td.ui-hide-lt-1024,[data-ui-id="doc"] .ui-qt__table td.ui-hide-lt-1280{display:none}
  [data-ui-id="doc"] .ui-qt__table td:nth-child(1){grid-column:1;grid-row:1}
  [data-ui-id="doc"] .ui-qt__table td:nth-child(5){grid-column:2;grid-row:1;justify-self:end}
  [data-ui-id="doc"] .ui-qt__table td:nth-child(2){grid-column:1;grid-row:2}
  [data-ui-id="doc"] .ui-qt__table td:nth-child(4){grid-column:2;grid-row:2;justify-self:end}
  [data-ui-id="doc"] .ui-qt__table td:nth-child(7){grid-column:1 / -1;grid-row:3}
  [data-ui-id="doc"] .doc-acts{justify-content:flex-start}
  [data-ui-id="doc"] .doc-acts .ui-hint__b{min-width:44px;min-height:44px}
  .d-confirm{grid-template-columns:24px minmax(0,1fr)}
  .d-confirm .ui-btn{grid-column:2;justify-self:start;min-height:44px}
  .d-sub{white-space:normal}
}
</style>
</helmet>
<main class="d-page">
  <header class="d-head"><h1>Dashboard</h1>{{roleChip}}{{maturity}}{{sample}}</header>
  {{confirms}}
  <div class="d-tools">{{switcher}}<div class="d-tools__r">{{ontime}}{{range}}</div></div>
  {{bar}}
  {{table}}
</main>
</x-dc>
</body>
</html>
