<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Psyflo — Authorizations</title>
</head>
<body>
<x-dc>
<helmet>
<style>
/* All Authorizations (R3, after the artifact): period card top right, ten filters in a 5 x 2 grid, one table, the pager at the bottom. Classes use the a- prefix; tokens and the UI kit do the rest. */
.a-page{max-width:1320px;margin:0 auto;padding:var(--sp-5) var(--gutter) 64px;display:flex;flex-direction:column;gap:var(--sp-4)}
.a-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--sp-3) var(--sp-4)}
.a-head h1{margin:0;font-size:var(--fs-28);line-height:var(--lh-28);font-weight:600;letter-spacing:-.01em}
.a-head__t{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.a-head__r{margin-left:auto;display:flex;gap:var(--sp-4);align-items:flex-end;flex-wrap:wrap}
.a-range{border:1px solid var(--line-200);background:var(--surface-0);border-radius:var(--r-3);margin:0;padding:10px 14px 12px;display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.a-range__l{float:left;width:100%;font-size:var(--fs-12);line-height:var(--lh-12);font-weight:600;color:var(--muted-700);padding:0;margin-bottom:4px}
.a-range__f input{width:150px}
.a-range__p{display:inline-flex;gap:6px;flex-wrap:wrap;margin-left:6px}
.a-id{font-weight:500;color:var(--muted-700);font-size:var(--fs-13);white-space:nowrap}
.a-sub{display:block;color:var(--muted-700);font-size:var(--fs-12);line-height:var(--lh-12);margin-top:2px}
.a-muted{color:var(--muted-700);font-size:var(--fs-13)}
.a-case-l{display:block}
.a-nw{white-space:nowrap}
.a-page .ui-qt__sort{min-height:24px}
.a-page a:not(.ui-btn):not(.ui-qt__link){color:var(--teal-700)}
.a-page a:not(.ui-btn):not(.ui-qt__link):hover{text-decoration:underline}
.a-page .ui-qt__table{table-layout:fixed}
.a-page .ui-qt__table td{padding:10px 8px;vertical-align:middle;overflow-wrap:anywhere}
.a-page .ui-qt__table .ui-chip{white-space:normal}
.a-page .ui-qt__table th{white-space:normal;line-height:1.25;vertical-align:bottom}
.a-page .ui-qt__sort{text-align:left;white-space:normal;align-items:flex-end}
.a-page .ui-qt__table th{padding-left:8px;padding-right:8px}
.a-page .ui-qt__link{color:inherit}
.a-page .ui-fbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 14px;align-items:end}
.a-page .ui-fsearch{order:-1;min-width:0}
.a-page .ui-fsel{min-width:0}
.a-page .ui-fsel .ui-select{width:100%;text-overflow:ellipsis}
.a-page .ui-fsel__l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-page .ui-fcount{display:none}
.a-clear{display:flex;justify-content:flex-end;margin-top:-4px}
.a-active{display:flex;gap:12px;align-items:center;font-size:var(--fs-13);color:var(--muted-700)}
.a-active b{color:var(--ink-900)}
@media (max-width:1100px){.a-page .ui-fbar{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.a-page .ui-fbar{grid-template-columns:repeat(2,minmax(0,1fr))}.a-page .ui-fsearch{grid-column:1/-1}}
.a-c-case{min-width:120px}
.a-c-next{min-width:150px}
.a-nx{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.a-nx__d{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.a-nx__f{font-size:var(--fs-12);line-height:var(--lh-12);color:var(--warning-fg);font-weight:600}
.a-range__h{flex-basis:100%;font-size:var(--fs-12);color:var(--muted-700)}
.a-c-units{min-width:150px}
@media (max-width:760px){.a-range__f input{width:132px}.a-head__r{margin-left:0;width:100%}}
/* phone: the table keeps its own width and scrolls inside its card (never the page); the status chip stays on one line */
@media (max-width:767px){.a-page .ui-qt__table{table-layout:auto;min-width:520px}.a-page .ui-qt__table .ui-chip{white-space:nowrap}.a-page .ui-qt__table td{overflow-wrap:normal}.a-c-next{min-width:170px}.a-c-units{min-width:130px}}
</style>
</helmet>
<main class="a-page">
  <header class="a-head">
    <div class="a-head__t"><h1>Authorizations</h1>{{maturity}}{{help}}</div>
    <div class="a-head__r">{{range}}{{action}}</div>
  </header>
  {{bar}}
  {{stage}}
  {{clear}}
  {{queue}}
  {{pager}}
</main>
</x-dc>
</body>
</html>
