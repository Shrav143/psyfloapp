<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Psyflo — Authorizations</title>
</head>
<body>
<x-dc>
<helmet>
<style>
/* Authorizations queue (E2). Classes use the a- prefix; tokens and the UI kit do the rest. */
.a-page{max-width:1320px;margin:0 auto;padding:var(--sp-5) var(--gutter) 64px;display:flex;flex-direction:column;gap:var(--sp-4)}
.a-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--sp-3) var(--sp-4)}
.a-head h1{margin:0;font-size:var(--fs-28);line-height:var(--lh-28);font-weight:600;letter-spacing:-.01em}
.a-head__t{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.a-head__r{margin-left:auto;display:flex;gap:var(--sp-4);align-items:flex-end;flex-wrap:wrap}
.a-range{border:0;margin:0;padding:0;display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.a-range__l{float:left;width:100%;font-size:var(--fs-12);line-height:var(--lh-12);font-weight:600;color:var(--muted-700);padding:0;margin-bottom:2px}
.a-range__f input{width:150px}
.a-why{font-size:var(--fs-13);color:var(--muted-700);border:1px dashed var(--control-500);border-radius:var(--r-2);padding:10px 14px}
.a-id{font-weight:500;color:var(--muted-700);font-size:var(--fs-13)}
.a-sub{color:var(--muted-700);font-size:var(--fs-12);line-height:var(--lh-12);margin-top:3px}
.a-case-l{display:block}
.a-di{margin-top:6px;font-size:var(--fs-12)}
.a-di a{font-weight:600}
.a-bar{height:6px;border-radius:3px;background:var(--sand-100);overflow:hidden;margin-top:6px;max-width:170px}
.a-bar i{display:block;height:100%;background:var(--teal-600)}
.a-bar.is-warn i{background:var(--warning-fg)}
.a-dl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.a-dl__t{font-weight:600}
.a-dl--overdue .a-dl__t{color:var(--danger-fg)}
.a-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.a-page a:not(.ui-btn):not(.ui-qt__link){color:var(--teal-700)}
.a-page a:not(.ui-btn):not(.ui-qt__link):hover{text-decoration:underline}
.a-di a{text-decoration:none}
.a-id{white-space:nowrap}
.a-units .ui-num{font-weight:600}
.a-page .ui-verify{font-size:var(--fs-12)}
.a-page .ui-qt__table td{padding-top:14px;padding-bottom:14px}
.a-page .ui-qt__table td:last-child{white-space:nowrap}
.a-page .ui-qt__link{color:inherit}
</style>
</helmet>
<main class="a-page">
  <header class="a-head">
    <div class="a-head__t"><h1>Authorizations</h1>{{maturity}}{{help}}</div>
    <div class="a-head__r">{{range}}{{action}}</div>
  </header>
  {{bar}}
  {{queue}}
</main>
</x-dc>
</body>
</html>
