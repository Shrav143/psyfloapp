<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parent portal — appeal letter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0;background:#F8F6F2;color:#151B24;font-family:'DM Sans',system-ui,sans-serif;font-size:17px;line-height:1.45}
a{color:#217A78}a:hover{color:#15605E}
*{box-sizing:border-box}
label{display:block;font-size:15px;font-weight:600;margin-bottom:6px}
.in{width:100%;border:1.5px solid #C9CDD3;border-radius:10px;padding:12px 14px;font:inherit;font-size:17px;background:#fff;min-height:50px;color:#151B24}
.rad{display:flex;gap:10px}
.rad label{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;margin:0;border:1.5px solid #C9CDD3;border-radius:10px;min-height:50px;background:#fff;font-size:16px}
.rad label.on{border-color:#217A78;background:#DDF1EF;color:#15605E;font-weight:600}
.rad input{width:18px;height:18px;margin:0;accent-color:#217A78}
.btn{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:12px;font:inherit;font-weight:600;font-size:17px;border:0;width:100%;text-decoration:none}
.btn.p{background:#217A78;color:#fff}
.chipr{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #C9CDD3;border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;background:#fff}
.chipr.on{border-color:#217A78;background:#DDF1EF;color:#15605E}
.tile{border:1px solid #E6E1D9;border-radius:14px;padding:14px 16px;background:#fff}
.tile b{font-size:16px}
.tile .s{font-size:14px;color:#525B66;margin-top:2px}
.bar{height:8px;border-radius:4px;background:#EFEBE4;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#217A78}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.r{background:#FBE9E4;color:#8A2E1C}.chip.y{background:#FCEFD0;color:#6F4A05}.chip.g{background:#DDF1EF;color:#15605E}.chip.n{background:#EEEBE5;color:#3E4652}
.btn.o{background:#fff;color:#151B24;border:1.5px solid #D9D4CC}
.btn.r{background:#B9541F;color:#fff}
</style>
</helmet>

<div style="width:100%;height:844px;background:#F8F6F2;display:flex;flex-direction:column;overflow:hidden">
  <div style="background:#151B24;color:#fff;padding:18px 20px 14px">
    <div style="font-weight:700;font-size:17px">Harvest Outreach Center</div>
    <div style="font-size:14px;color:#C9D1D6;margin-top:2px">{{t.sub}}</div>
  </div>
  <div style="flex:1;padding:14px 20px 0;display:flex;flex-direction:column;gap:10px;overflow-y:auto">
    <sc-if value="{{!r}}"><div class="tile"><b>{{t.none}}</b></div></sc-if>
    <sc-if value="{{r}}">
    <div class="tile" style="border-color:#8A2E1C;background:#FBE9E4"><b>{{t.said}}</b><div class="s">{{t.reason}}</div></div>
    <div class="tile">
      <b>{{t.letter}}</b>
      <sc-if value="{{!editing}}"><div class="s" style="margin-top:6px;color:#151B24;line-height:1.5;white-space:pre-line">{{text}}</div></sc-if>
      <sc-if value="{{editing}}"><textarea class="in" id="letter" style="margin-top:6px;min-height:220px;font-size:15px;line-height:1.5;resize:vertical" onInput="{{edit}}">{{text}}</textarea></sc-if>
      <sc-if value="{{!sent}}"><div class="s" style="margin-top:6px"><a href="#edit">{{t.change}}</a> · <a href="#es">{{t.other}}</a></div></sc-if>
      <sc-if value="{{sent}}"><div class="s" style="margin-top:6px"><a href="#es">{{t.other}}</a></div></sc-if>
    </div>
    <div class="tile"><b>{{t.attachedBy}}</b><div class="s">{{attached}}</div></div>
    <sc-if value="{{sent}}">
      <div class="tile" style="border-color:#217A78;background:#F2F9F8"><b>{{t.sentTitle}}</b><div class="s">{{sent.sub}}<sc-if value="{{sent.file}}"> · <a href="{{sent.file}}" target="_blank" rel="noopener">{{t.pdf}}</a></sc-if></div></div>
    </sc-if>
    <sc-if value="{{signing}}">
      <div><label for="signer">{{t.yourName}}</label><input class="in" id="signer" type="text" value="{{signer}}" onInput="{{setSigner}}"></div>
      <div><label for="sig">{{t.signHere}}</label><div style="border:1.5px dashed #C9CDD3;border-radius:12px;height:110px;background:#fff;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#8E99A6;font-size:14px"><canvas id="sig" aria-label="{{t.signHere}}" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair"></canvas><span id="sigph" style="pointer-events:none;position:relative">{{signer}}</span></div>
        <div style="text-align:right;font-size:13px;margin-top:4px"><a href="#clear">{{t.clear}}</a></div></div>
    </sc-if>
    <sc-if value="{{!sent}}"><a class="btn p" href="#sign" style="min-height:54px;flex-shrink:0">{{signBtn}}</a>
    <div style="font-size:13px;color:#525B66;text-align:center">{{t.faxes}}</div></sc-if>
    </sc-if>
  </div>
  <div style="padding:12px 20px 22px;border-top:1px solid #E6E1D9;background:#F8F6F2;font-size:12px;color:#525B66;text-align:center"><a href="#call">{{t.call}}</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
