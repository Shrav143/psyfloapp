<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Psyflo — Denial case</title>
</head>
<body>
<x-dc>
<helmet>
<style>
/* Denial case workspace (E3). Classes use the d- prefix; tokens from web/css/tokens.css. */
.d-page{padding:var(--sp-4) var(--gutter) var(--sp-6);max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:var(--sp-3)}
.d-crumb{display:flex;gap:8px;align-items:center;font-size:var(--fs-13);color:var(--muted-700)}
.d-crumb a{color:var(--teal-700);text-decoration:none;font-weight:600}.d-crumb a:hover{text-decoration:underline}
.d-head{display:flex;flex-wrap:wrap;gap:var(--sp-3) var(--sp-4);align-items:flex-start;justify-content:space-between}
.d-head h1{margin:0;font-size:var(--fs-28);line-height:var(--lh-28);font-weight:600;letter-spacing:-.01em}
.d-head__c{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.d-head__r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.d-dlchip{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.d-next{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--teal-tint);border:1px solid var(--teal-300);border-radius:var(--r-3);padding:10px 14px}
.d-next--done{background:var(--success-bg);border-color:var(--success-fg)}
.d-next__l{font-size:var(--fs-12);text-transform:uppercase;letter-spacing:.06em;color:var(--teal-700);font-weight:700}
.d-next--done .d-next__l{color:var(--success-fg)}
.d-next b{font-weight:600;margin-right:auto}
.d-strip{display:flex;flex-wrap:wrap;gap:8px 28px;margin:0;padding:2px 2px;font-size:var(--fs-13)}
.d-strip div{display:flex;gap:6px;align-items:baseline}.d-strip dt{color:var(--muted-700)}.d-strip dd{margin:0;font-weight:600}
.d-tabs ul{display:flex;gap:4px;list-style:none;margin:0;padding:0;border-bottom:1px solid var(--line-200);overflow-x:auto}
.d-tabs a{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;text-decoration:none;color:var(--ink-900);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;min-height:44px;box-sizing:border-box}
.d-tabs a:hover{background:var(--sand-50)}
.d-tabs a[aria-current=page]{border-bottom-color:var(--teal-600);color:var(--teal-700)}
.d-tab__n{background:var(--sand-100);border-radius:999px;font-size:var(--fs-12);padding:0 7px;line-height:18px;color:var(--ink-900)}
.d-body{display:flex;flex-direction:column;gap:var(--sp-3)}
.d-sect{background:var(--surface-0);border:1px solid var(--line-200);border-radius:var(--r-3);padding:var(--sp-4) var(--sp-5)}
.d-sect h2{margin:0 0 var(--sp-2);font-size:var(--fs-22);line-height:var(--lh-22);font-weight:600}
.d-sect h3{margin:var(--sp-4) 0 6px;font-size:var(--fs-14);line-height:var(--lh-14);font-weight:700}
.d-sect__h{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:var(--sp-2)}.d-sect__h h2{margin:0}
.d-sm{font-size:var(--fs-13);line-height:var(--lh-13)}
.d-n{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--sand-100);font-size:var(--fs-12);text-align:center;margin-right:2px;font-weight:600}
.d-need{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;background:var(--neutral-bg);color:var(--neutral-fg);font-size:var(--fs-12);font-weight:600}
.d-dl .ui-dl__r{padding:8px 0}
.d-docref{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;min-width:0}
.d-reasons,.d-dls,.d-asked,.d-evl,.d-miss-l,.d-vers,.d-hist4{list-style:none;margin:0;padding:0}
.d-reasons li{margin:6px 0}.d-reasons blockquote{margin:0 0 2px}
.d-dls li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line-200)}.d-dls li:first-child{border-top:0}
.d-asked li{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line-200)}.d-asked li:first-child{border-top:0}
.d-det{margin-top:var(--sp-3);border-top:1px solid var(--line-200);padding-top:var(--sp-2)}
.d-det>summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center;gap:8px}
.d-table{width:100%;border-collapse:collapse;font-size:var(--fs-13);margin-top:8px}.d-table th{text-align:left;color:var(--muted-700);font-weight:600;padding:4px 8px 4px 0}.d-table td{padding:6px 8px 6px 0;border-top:1px solid var(--line-200)}.d-sup td{color:var(--muted-700);text-decoration:line-through}
.d-ev{display:grid;grid-template-columns:78px minmax(0,1fr) auto auto;gap:4px 12px;align-items:start;padding:10px 0;border-top:1px solid var(--line-200)}.d-ev:first-child{border-top:0}
.d-ev__d{font-weight:600;font-size:var(--fs-13)}.d-ev__b{display:flex;flex-direction:column;gap:2px;min-width:0}.d-ev__b .d-sm{display:block}
.d-ev--held{background:var(--sand-50)}
.d-miss-l{display:flex;flex-wrap:wrap;gap:8px}
mark.d-miss{background:var(--warning-bg);color:var(--warning-fg);border-radius:4px;padding:0 4px;font-weight:600}
.d-opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.d-opt{display:flex;gap:16px;align-items:center;justify-content:space-between;border:1px solid var(--line-200);border-radius:var(--r-3);padding:12px 16px;background:var(--surface-0)}
.d-opt--off{background:var(--sand-50)}
.d-opt h3{margin:0 0 2px;font-size:var(--fs-16);line-height:var(--lh-16)}.d-opt p{margin:0 0 6px;color:var(--muted-700);font-size:var(--fs-13)}
.d-opt__m{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}.d-opt__a{flex:0 0 auto}
.d-subnav{display:flex;flex-wrap:wrap;gap:6px}
.d-subnav a{padding:6px 12px;border-radius:999px;border:1px solid var(--control-500);background:var(--surface-0);color:var(--ink-900);text-decoration:none;font-weight:600;font-size:var(--fs-13);min-height:32px;display:inline-flex;align-items:center;box-sizing:border-box}
.d-subnav a[aria-current=true]{background:var(--forest-800);border-color:var(--forest-800);color:#fff}
.d-clock{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px}
.d-doc{border:1px solid var(--line-200);border-radius:var(--r-3);padding:12px 16px;margin:var(--sp-3) 0;background:var(--surface-0)}
.d-doc--empty{background:var(--sand-50)}
.d-doc__h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}.d-doc__h h3{margin:0}
.d-doc__c{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.d-doc__a{margin-left:auto;display:flex;gap:8px}
.d-secdoc{padding:10px 0;border-top:1px solid var(--line-200)}.d-secdoc>header{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}.d-secdoc h4{margin:0;font-size:var(--fs-14)}
.d-sec__t{margin:6px 0;line-height:1.55;max-width:75ch}
.d-sec__ev{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.d-more{display:inline-block}.d-more>summary{cursor:pointer;font-size:var(--fs-13);font-weight:600;color:var(--teal-700);min-height:28px;display:inline-flex;align-items:center}.d-more[open]{display:block;width:100%}.d-more[open] .d-sec__ev{margin-top:6px}
.d-miss-l{margin-bottom:8px}
.d-edit .ui-textarea{width:100%;min-height:96px;padding:8px 12px;line-height:1.5}
.d-sentline{margin:6px 0}
.d-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-3)}
@media (max-width:1100px){.d-grid2{grid-template-columns:1fr}}
.d-card{border:1px solid var(--line-200);border-radius:var(--r-3);padding:12px 16px;background:var(--surface-0)}.d-card h3{margin-top:0}
.d-q{margin:0;padding-left:20px;line-height:1.5}
.d-doors{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.d-door{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--control-500);border-radius:var(--r-3);padding:12px 16px;cursor:pointer;background:var(--surface-0)}
.d-door.is-on{border-color:var(--teal-600);background:var(--teal-tint)}.d-door input{margin-top:3px;width:18px;height:18px}.d-door span{display:flex;flex-direction:column;gap:2px}
.d-check{display:flex;gap:8px;align-items:center;margin:8px 0}
.d-send{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.d-hist4 li{padding:4px 0;font-size:var(--fs-13)}
.d-f{display:flex;flex-direction:column;gap:4px;margin:10px 0}.d-f label,.d-f legend{font-weight:600;font-size:var(--fs-13)}
.d-radios{display:flex;flex-direction:column;gap:6px;border:0;padding:0;margin:8px 0}.d-radios label{display:flex;gap:8px;align-items:center;font-weight:400;min-height:32px}
.d-modal-note{color:var(--muted-700);font-size:var(--fs-13);margin:6px 0 0}
/* long chips wrap instead of forcing a horizontal scroll (390 px) */
.d-page{min-width:0}.d-sect,.d-card,.d-opt{min-width:0;overflow-wrap:anywhere}
.d-sect .ui-evidence,.d-card .ui-evidence,.d-doc .ui-evidence{white-space:normal;text-align:left;max-width:100%;height:auto;min-height:28px}
.d-sect .ui-chip,.d-card .ui-chip{max-width:100%}
.d-sect .ui-evidence__t,.d-card .ui-evidence__t,.d-doc .ui-evidence__t{white-space:normal;overflow:visible;text-overflow:clip}
@media (max-width:760px){.d-sect{padding:12px}.d-ev{grid-template-columns:70px minmax(0,1fr)}.d-ev__c,.d-ev__a{grid-column:2}.d-opt{flex-direction:column;align-items:flex-start}}
</style>
</helmet>
<main class="d-page d-case">
  {{head}}
  {{strip}}
  {{tabs}}
  <div class="d-body">{{body}}</div>
</main>
</x-dc>
</body>
</html>
