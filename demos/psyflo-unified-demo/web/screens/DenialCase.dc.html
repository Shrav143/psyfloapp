<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Psyflo — Denial case</title>
</head>
<body>
<x-dc>
<helmet>
<style>
/* Denial case workspace (E3). Classes use the d- prefix; tokens from web/css/tokens.css. */
.d-page{padding:var(--sp-4) var(--gutter) var(--sp-6);max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:var(--sp-3)}
.d-crumb{display:flex;gap:8px;align-items:center;font-size:var(--fs-13);color:var(--muted-700)}
.d-crumb a{color:var(--teal-700);text-decoration:none;font-weight:600}.d-crumb a:hover{text-decoration:underline}
.d-dlchip{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.d-next{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--teal-tint);border:1px solid var(--teal-300);border-radius:var(--r-3);padding:10px 14px}
.d-next--done{background:var(--success-bg);border-color:var(--success-fg)}
.d-next__l{font-size:var(--fs-12);text-transform:uppercase;letter-spacing:.06em;color:var(--teal-700);font-weight:700}
.d-next--done .d-next__l{color:var(--success-fg)}
.d-next b{font-weight:600;margin-right:auto}
.d-col{display:flex;flex-direction:column;gap:var(--sp-3)}
.d-sect{background:var(--surface-0);border:1px solid var(--line-200);border-radius:var(--r-3);padding:var(--sp-4) var(--sp-5)}
.d-sect h2{margin:0 0 var(--sp-2);font-size:var(--fs-22);line-height:var(--lh-22);font-weight:600}
.d-sect h3{margin:var(--sp-4) 0 6px;font-size:var(--fs-14);line-height:var(--lh-14);font-weight:700}
.d-sect__h{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:var(--sp-2)}.d-sect__h h2{margin:0}
.d-sm{font-size:var(--fs-13);line-height:var(--lh-13)}
.d-n{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--sand-100);font-size:var(--fs-12);text-align:center;margin-right:2px;font-weight:600}
.d-need{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;background:var(--neutral-bg);color:var(--neutral-fg);font-size:var(--fs-12);font-weight:600}
.d-dl .ui-dl__r{padding:8px 0}
.d-docref{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;min-width:0}
.d-reasons,.d-dls,.d-asked,.d-evl,.d-miss-l,.d-vers,.d-hist4{list-style:none;margin:0;padding:0}
.d-reasons li{margin:6px 0}.d-reasons blockquote{margin:0 0 2px}
.d-dls li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line-200)}.d-dls li:first-child{border-top:0}
.d-asked li{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line-200)}.d-asked li:first-child{border-top:0}
.d-det{margin-top:var(--sp-3);border-top:1px solid var(--line-200);padding-top:var(--sp-2)}
.d-det>summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center;gap:8px}
.d-table{width:100%;border-collapse:collapse;font-size:var(--fs-13);margin-top:8px}.d-table th{text-align:left;color:var(--muted-700);font-weight:600;padding:4px 8px 4px 0}.d-table td{padding:6px 8px 6px 0;border-top:1px solid var(--line-200)}.d-sup td{color:var(--muted-700);text-decoration:line-through}
.d-ev{display:grid;grid-template-columns:78px minmax(0,1fr) auto auto;gap:4px 12px;align-items:start;padding:10px 0;border-top:1px solid var(--line-200)}.d-ev:first-child{border-top:0}
.d-ev__d{font-weight:600;font-size:var(--fs-13)}.d-ev__b{display:flex;flex-direction:column;gap:2px;min-width:0}.d-ev__b .d-sm{display:block}
.d-ev--held{background:var(--sand-50)}
.d-miss-l{display:flex;flex-wrap:wrap;gap:8px}
mark.d-miss{background:var(--warning-bg);color:var(--warning-fg);border-radius:4px;padding:0 4px;font-weight:600}
.d-opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.d-opt{display:flex;gap:16px;align-items:center;justify-content:space-between;border:1px solid var(--line-200);border-radius:var(--r-3);padding:12px 16px;background:var(--surface-0)}
.d-opt--off{background:var(--sand-50)}
.d-opt h3{margin:0 0 2px;font-size:var(--fs-16);line-height:var(--lh-16)}.d-opt p{margin:0 0 6px;color:var(--muted-700);font-size:var(--fs-13)}
.d-opt__m{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}.d-opt__a{flex:0 0 auto}
.d-clock{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px}
.d-doc{border:1px solid var(--line-200);border-radius:var(--r-3);padding:12px 16px;margin:var(--sp-3) 0;background:var(--surface-0)}
.d-doc--empty{background:var(--sand-50)}
.d-doc__h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}.d-doc__h h3{margin:0}
.d-doc__c{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.d-doc__a{margin-left:auto;display:flex;gap:8px}
.d-secdoc{padding:10px 0;border-top:1px solid var(--line-200)}.d-secdoc>header{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}.d-secdoc h4{margin:0;font-size:var(--fs-14)}
.d-sec__t{margin:6px 0;line-height:1.55;max-width:75ch}
.d-sec__ev{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.d-more{display:inline-block}.d-more>summary{cursor:pointer;font-size:var(--fs-13);font-weight:600;color:var(--teal-700);min-height:28px;display:inline-flex;align-items:center}.d-more[open]{display:block;width:100%}.d-more[open] .d-sec__ev{margin-top:6px}
.d-miss-l{margin-bottom:8px}
.d-edit .ui-textarea{width:100%;min-height:96px;padding:8px 12px;line-height:1.5}
.d-sentline{margin:6px 0}
.d-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-3)}
@media (max-width:1100px){.d-grid2{grid-template-columns:1fr}}
.d-card{border:1px solid var(--line-200);border-radius:var(--r-3);padding:12px 16px;background:var(--surface-0)}.d-card h3{margin-top:0}
.d-q{margin:0;padding-left:20px;line-height:1.5}
.d-doors{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.d-door{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--control-500);border-radius:var(--r-3);padding:12px 16px;cursor:pointer;background:var(--surface-0)}
.d-door.is-on{border-color:var(--teal-600);background:var(--teal-tint)}.d-door input{margin-top:3px;width:18px;height:18px}.d-door span{display:flex;flex-direction:column;gap:2px}
.d-check{display:flex;gap:8px;align-items:center;margin:8px 0}
.d-send{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.d-hist4 li{padding:4px 0;font-size:var(--fs-13)}
.d-f{display:flex;flex-direction:column;gap:4px;margin:10px 0}.d-f label,.d-f legend{font-weight:600;font-size:var(--fs-13)}
.d-radios{display:flex;flex-direction:column;gap:6px;border:0;padding:0;margin:8px 0}.d-radios label{display:flex;gap:8px;align-items:center;font-weight:400;min-height:32px}
.d-modal-note{color:var(--muted-700);font-size:var(--fs-13);margin:6px 0 0}
/* header card, process line, left menu, overview (artifact layout; tokens only) */
.d-hd{background:var(--surface-0);border:1px solid var(--line-200);border-radius:var(--r-3);padding:var(--sp-4) var(--sp-5);display:flex;flex-direction:column;gap:10px}
.d-hd__t{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.d-hd__l{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-width:0}
.d-hd h1{margin:0;font-size:var(--fs-28);line-height:var(--lh-28);font-weight:600;letter-spacing:-.01em}
.d-hd__a{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.d-hd__c{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.d-hd__s{margin:0;color:var(--muted-700);font-size:var(--fs-13);line-height:var(--lh-13)}
.d-auth{display:inline-flex;gap:6px;align-items:center;font-size:var(--fs-13)}
.d-dlchip{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.d-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));list-style:none;margin:6px 0 0;padding:12px 0 0;border-top:1px solid var(--line-200);counter-reset:none}
.d-steps li{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;position:relative;color:var(--muted-700);font-size:var(--fs-13);line-height:var(--lh-13);padding:0 4px}
.d-steps li::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line-200);z-index:0}
.d-steps li:first-child::before{display:none}
.d-steps li.is-done::before,.d-steps li.is-now::before{background:var(--forest-800)}
.d-steps__dot{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--control-500);background:var(--surface-0);font-size:var(--fs-12);font-weight:600}
.d-steps li.is-done .d-steps__dot{background:var(--forest-800);border-color:var(--forest-800);color:var(--surface-0)}
.d-steps li.is-now .d-steps__dot{background:var(--forest-900);border-color:var(--forest-900);color:var(--surface-0)}
.d-steps li.is-now,.d-steps li.is-done{color:var(--ink-900)}.d-steps b{font-weight:600}
.d-steps__d{font-size:var(--fs-12);color:var(--muted-700);min-height:16px}
.d-upd{position:relative}
.d-upd__b::after{content:"";display:inline-block;margin-left:8px;width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px)}
.d-upd__p[hidden]{display:none}
.d-upd__p{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:260px;list-style:none;margin:0;padding:6px;background:var(--surface-0);border:1px solid var(--line-200);border-radius:var(--r-3);box-shadow:var(--shadow-pop)}
.d-upd__p button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:var(--r-2);padding:8px 12px;min-height:36px;font:inherit;color:var(--ink-900);cursor:pointer}
.d-upd__p button:hover,.d-upd__p button:focus-visible{background:var(--sand-50)}
.d-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:var(--sp-4);align-items:start}
.d-menu{background:var(--surface-0);border:1px solid var(--line-200);border-radius:var(--r-3);padding:10px;position:sticky;top:var(--sp-3)}
.d-menu ul{list-style:none;margin:0 0 6px;padding:0}
.d-menu__g{margin:8px 8px 4px;font-size:var(--fs-12);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-700)}
.d-menu a{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:var(--r-2);text-decoration:none;color:var(--ink-900);border-left:3px solid transparent;min-height:36px;box-sizing:border-box;justify-content:center}
.d-menu a b{font-weight:500;font-size:var(--fs-14)}.d-menu a span{font-size:var(--fs-12);color:var(--muted-700)}
.d-menu a:hover{background:var(--sand-50)}
.d-menu a[aria-current=page]{background:var(--teal-tint);border-left-color:var(--teal-600)}.d-menu a[aria-current=page] b{font-weight:600;color:var(--teal-700)}
.d-body{min-width:0}
.d-sect__r{margin-left:auto;display:inline-flex;gap:6px;align-items:center}
.d-acts{list-style:none;margin:var(--sp-2) 0 0;padding:0}
.d-act{border-top:1px solid var(--line-200)}.d-act:first-child{border-top:0}
.d-act__b{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;padding:10px 4px;font:inherit;color:var(--ink-900);text-align:left;cursor:pointer;min-height:44px;border-radius:var(--r-2)}
.d-act__b:hover:not(:disabled){background:var(--sand-50)}.d-act__b:disabled{cursor:not-allowed;color:var(--muted-700)}
.d-act__n{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--sand-100);font-size:var(--fs-13);font-weight:600}
.d-act.is-done .d-act__n{background:var(--success-bg);color:var(--success-fg)}
.d-act__t{flex:1 1 auto;display:flex;flex-direction:column;gap:2px;min-width:0}.d-act__t b{font-weight:600}
.d-act__r{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:var(--fs-13)}
.d-act__ok{color:var(--success-fg);font-weight:600}
.d-act__go{flex:0 0 auto;color:var(--teal-700);font-weight:600;font-size:var(--fs-13);padding:2px 12px;border:1px solid var(--line-200);border-radius:999px}
.d-act.is-cur{background:var(--teal-tint);border-radius:var(--r-2)}
.d-vs{padding:10px 0;border-top:1px solid var(--line-200)}.d-vs:first-of-type{border-top:0}
.d-said{margin:0 0 8px;padding:10px 14px;background:var(--danger-bg);color:var(--danger-fg);border-radius:var(--r-2);font-style:normal}
.d-cap{display:block;font-size:var(--fs-12);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-700);margin-bottom:2px}
.d-shows p{margin:4px 0;line-height:1.5}.d-needrow{margin:4px 0}
.d-corr{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:var(--sp-3);padding-top:var(--sp-2);border-top:1px solid var(--line-200)}.d-corr .d-cap{margin:0}
.d-wk{display:flex;flex-direction:column}
.d-wp{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line-200)}.d-wp:first-child{border-top:0}
.d-wp>.ui-chip{flex:0 0 auto;margin-top:2px}
.d-wp__b{min-width:0;display:flex;flex-direction:column;gap:4px}.d-wp__b p{margin:0;line-height:1.5}
.d-wp__f{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}.d-wp__fix{font-size:var(--fs-13);color:var(--muted-700)}
.d-empty{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:6px 0}
.d-hist{background:var(--surface-0);border:1px solid var(--line-200);border-radius:var(--r-3);padding:0 var(--sp-5)}
.d-hist>summary,.d-paths>summary{display:flex;gap:10px;align-items:center;cursor:pointer;min-height:48px;list-style:none}
.d-hist>summary::-webkit-details-marker,.d-paths>summary::-webkit-details-marker{display:none}
.d-hist>summary::after,.d-paths>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted-700);border-bottom:2px solid var(--muted-700);transform:rotate(45deg);transition:transform var(--dur)}
.d-hist[open]>summary::after,.d-paths[open]>summary::after{transform:rotate(-135deg)}
.d-hist h2,.d-paths h2{margin:0;font-size:var(--fs-18)}.d-hist[open]{padding-bottom:var(--sp-4)}
.d-paths>summary{min-height:36px;flex-wrap:wrap}.d-paths h2{font-size:var(--fs-16);white-space:nowrap}
.d-dr{list-style:none;margin:0 0 var(--sp-2);padding:0}.d-dr li{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line-200)}.d-dr li:first-child{border-top:0}
.d-calls{list-style:none;margin:0;padding:0}.d-calls li{padding:6px 0;border-top:1px solid var(--line-200);font-size:var(--fs-13)}.d-calls li:first-child{border-top:0}
.d-miss-l--col{flex-direction:column}.d-miss-l--col li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.d-hours{display:grid;gap:6px;margin:var(--sp-3) 0;padding:12px 16px;background:var(--sand-50);border-radius:var(--r-3)}
.d-hours div{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}.d-hours dt{min-width:84px;color:var(--muted-700);font-size:var(--fs-13)}.d-hours dd{margin:0}
.d-script{list-style:none;margin:var(--sp-3) 0;padding:0;display:flex;flex-direction:column;gap:8px}
.d-script__l{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:var(--r-3);border:1px solid var(--line-200);max-width:92%}
.d-script__l--agent{background:var(--teal-tint);border-color:var(--teal-300);align-self:flex-start}
.d-script__l--payer{background:var(--sand-50);align-self:flex-end;border-style:dashed}
.d-script__w{font-size:var(--fs-12);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-700)}
@media (max-width:1000px){.d-layout{grid-template-columns:1fr}.d-menu{position:static}.d-menu ul{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px}.d-menu__g{margin-left:2px}.d-menu a{border-left:0;border-bottom:3px solid transparent;padding:6px 10px}.d-menu a[aria-current=page]{border-bottom-color:var(--teal-600)}}
@media (max-width:760px){.d-hd{padding:12px}.d-steps{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:12px}.d-steps li:nth-child(4)::before{display:none}.d-upd__p{left:0;right:auto;min-width:min(260px,80vw)}.d-hd h1{font-size:var(--fs-22);line-height:var(--lh-22)}.d-script__l{max-width:100%}}
/* long chips wrap instead of forcing a horizontal scroll (390 px) */
.d-page{min-width:0}.d-sect,.d-card,.d-opt{min-width:0;overflow-wrap:anywhere}
.d-sect .ui-evidence,.d-card .ui-evidence,.d-doc .ui-evidence{white-space:normal;text-align:left;max-width:100%;height:auto;min-height:28px}
.d-sect .ui-chip,.d-card .ui-chip{max-width:100%}
.d-sect .ui-evidence__t,.d-card .ui-evidence__t,.d-doc .ui-evidence__t{white-space:normal;overflow:visible;text-overflow:clip}
@media (max-width:760px){.d-sect{padding:12px}.d-ev{grid-template-columns:70px minmax(0,1fr)}.d-ev__c,.d-ev__a{grid-column:2}.d-opt{flex-direction:column;align-items:flex-start}}
</style>
</helmet>
<main class="d-page d-case">
  {{head}}
  <div class="d-layout">
    {{menu}}
    <div class="d-body d-col">{{body}}</div>
  </div>
  {{hist}}
</main>
</x-dc>
</body>
</html>
