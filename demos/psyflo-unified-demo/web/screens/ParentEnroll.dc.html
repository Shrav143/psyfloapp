<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enrollment packet — Harvest Outreach Center</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0;background:#F8F6F2;color:#151B24;font-family:'DM Sans',system-ui,sans-serif;font-size:17px;line-height:1.45}
a{color:#217A78}a:hover{color:#15605E}
*{box-sizing:border-box}
label{display:block;font-size:15px;font-weight:600;margin-bottom:6px}
.in{width:100%;border:1.5px solid #C9CDD3;border-radius:10px;padding:12px 14px;font:inherit;font-size:17px;background:#fff;min-height:50px;color:#151B24}
.rad{display:flex;gap:10px}
.rad label{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;margin:0;border:1.5px solid #C9CDD3;border-radius:10px;min-height:50px;background:#fff;font-size:16px}
.rad label.on{border-color:#217A78;background:#DDF1EF;color:#15605E;font-weight:600}
.rad input{width:18px;height:18px;margin:0;accent-color:#217A78}
.btn{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:12px;font:inherit;font-weight:600;font-size:17px;border:0;width:100%;text-decoration:none}
.btn.p{background:#217A78;color:#fff}
.chipr{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #C9CDD3;border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;background:#fff}
.chipr.on{border-color:#217A78;background:#DDF1EF;color:#15605E}
.tile{border:1px solid #E6E1D9;border-radius:14px;padding:14px 16px;background:#fff}
.tile b{font-size:16px}
.tile .s{font-size:14px;color:#525B66;margin-top:2px}
.bar{height:8px;border-radius:4px;background:#EFEBE4;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#217A78}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.r{background:#FBE9E4;color:#8A2E1C}.chip.y{background:#FCEFD0;color:#6F4A05}.chip.g{background:#DDF1EF;color:#15605E}.chip.n{background:#EEEBE5;color:#3E4652}
.btn.o{background:#fff;color:#151B24;border:1.5px solid #D9D4CC}
.btn.r{background:#B9541F;color:#fff}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:0;font:inherit;color:#151B24;text-align:left;cursor:pointer}
.num{flex:0 0 30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:#EEEBE5;color:#3E4652}
.num.g{background:#217A78;color:#fff}
.num.y{background:#FCEFD0;color:#6F4A05}
.btn.o{background:#fff;color:#151B24;border:1.5px solid #D9D4CC}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:6px 0;border-top:1px solid #EFEBE4}
.kv:first-of-type{border-top:0}
.kv span:last-child{font-weight:600;text-align:right}
.mon{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;font-size:14px;margin-top:6px}
.mon .bar{margin-top:0}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.foot{padding:12px 20px 22px;border-top:1px solid #E6E1D9;background:#F8F6F2;font-size:12px;color:#525B66;text-align:center}
.hd{background:#151B24;color:#fff;padding:18px 20px 14px}
.hd .t{font-weight:700;font-size:17px}
.hd .u{font-size:14px;color:#C9D1D6;margin-top:2px}
.body{flex:1;padding:14px 20px 16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.body>*{flex-shrink:0}
.frame{width:100%;height:844px;background:#F8F6F2;display:flex;flex-direction:column;overflow:hidden}
</style>
</helmet>
<div class="frame">
  <div class="hd">
    <div class="t">{{t.title}}</div>
    <div class="u">{{t.sub}}</div>
    <div style="display:flex;gap:8px;margin-top:10px;font-size:13px"><a href="#en" style="{{enStyle}}" lang="en">English</a><a href="#es" style="{{esStyle}}" lang="es">Español</a></div>
  </div>
  <div style="background:#151B24;padding:0 20px 14px"><div class="bar" style="background:#2A3340;margin-top:0"><i style="width:{{pct}}%;background:#5FC0BE"></i></div></div>
  <div class="body">
    <sc-if value="{{allDone}}"><div class="tile" style="border-color:#217A78;background:#F2F9F8"><b>{{t.allDone}}</b><div class="s">{{t.allDoneSub}}</div></div></sc-if>
    <sc-if value="{{!allDone}}"><div class="s" style="font-size:14px;color:#525B66">{{t.why}}</div></sc-if>
    <sc-for list="{{items}}" as="it">
      <div class="tile" style="{{it.style}}">
        <button class="rowbtn" onClick="{{it.toggle}}" aria-expanded="{{it.expanded}}">
          <span class="num {{it.numCls}}">{{it.mark}}</span>
          <span style="flex:1;min-width:0"><b>{{it.title}}</b><span class="s" style="display:block">{{it.sub}}</span></span>
          <span class="chip {{it.chipCls}}">{{it.chip}}</span>
        </button>
        <sc-if value="{{it.open}}">
          <div style="border-top:1px solid #EFEBE4;margin-top:12px;padding-top:12px;display:flex;flex-direction:column;gap:10px">
            <sc-for list="{{it.points}}" as="p"><div style="display:flex;gap:8px;font-size:15px;line-height:1.45"><span style="color:#217A78;font-weight:700">·</span><span>{{p}}</span></div></sc-for>
            <sc-for list="{{it.fields}}" as="f"><div><label for="{{f.id}}">{{f.label}}</label><input class="in" id="{{f.id}}" data-k="{{f.k}}" value="{{f.v}}" placeholder="{{f.ph}}" onInput="{{setField}}" autocomplete="off" style="{{f.bad}}"></div></sc-for>
            <sc-if value="{{it.note}}"><div class="s">{{it.note}}</div></sc-if>
            <sc-if value="{{it.err}}"><div role="alert" style="font-size:14px;color:#8A2E1C;background:#FBE9E4;border-radius:10px;padding:10px 12px">{{it.err}}</div></sc-if>
            <sc-if value="{{it.doneText}}"><div class="s" style="color:#15605E;font-weight:600">{{it.doneText}}<sc-if value="{{it.file}}"> · <a href="{{it.file}}" target="_blank" rel="noopener">{{t.copy}}</a></sc-if></div></sc-if>
            <sc-if value="{{it.btn}}"><button class="btn p" onClick="{{it.act}}" style="min-height:50px">{{it.btn}}</button></sc-if>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <div class="foot"><a href="#back">{{t.back}}</a> · <a href="#call">{{t.call}}</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
