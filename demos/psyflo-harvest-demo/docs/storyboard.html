" width=\"10\" height=\"20\" rx=\"2\"></rect><path d=\"M11 18h2\"></path></svg>Mobile app</a>\n      <a class=\"nav\" href=\"ParentPortal.dc.html\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M3 11l9-7 9 7v9H3z\"></path><path d=\"M10 20v-6h4v6\"></path></svg>Parent portal</a>\n      <a class=\"nav\" href=\"SchoolPortal.dc.html\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M2 10l10-5 10 5-10 5z\"></path><path d=\"M6 12v5c3 2 9 2 12 0v-5\"></path></svg>School portal</a>\n    </nav>\n    <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:center;gap:8px;border:1px solid #2A3340;border-radius:8px;padding:8px 10px;font-size:12px;color:#C9D1D6\"><span style=\"width:8px;height:8px;border-radius:50%;background:#F0B44C;display:inline-block\"></span>Demo data · nothing is real</div>\n      <div style=\"display:flex;align-items:center;gap:10px;border-top:1px solid #2A3340;padding-top:14px\">\n        <div style=\"width:36px;height:36px;border-radius:50%;background:#217A78;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px\">JP</div>\n        <div><div style=\"font-weight:600;font-size:13px\">Jordan Perez</div><div style=\"font-size:12px;color:#8E99A6\">LPC · Asst. Clinical Support Supervisor</div></div>\n      </div>\n    </div>\n  </aside>\n\n  <main style=\"flex:999 1 560px;min-width:0;display:flex;flex-direction:column\">\n    <header style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid #E6E1D9;background:#fff\">\n      <div style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#525B66;font-weight:600\">As of <span style=\"color:#151B24\">Thu, Oct 29</span></div>\n      <span class=\"chip n\">Both localities</span>\n      <div style=\"margin-left:auto;display:flex;gap:8px\"><span class=\"chip y\">2 partials to decide</span><span class=\"chip n\">1 peer-to-peer booked</span><span class=\"chip r\">1 denial</span></div>\n    </header>\n\n    <div style=\"padding:26px 28px 32px;display:flex;flex-direction:column;gap:20px\">\n      <div>\n        <h1 style=\"margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em\">Partials &amp; denials</h1>\n      </div>\n\n      <!-- Sentara partial -->\n      <section class=\"card\" style=\"padding:18px 20px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:baseline\">\n          <h2 style=\"margin:0;font-size:16px;font-weight:600\">R-0402 · D.W., 15 · Sentara Health Plans · continued stay</h2>\n          <span class=\"chip y\">Partial — decide by Oct 30</span>\n          <span style=\"font-size:12px;color:#525B66\">Campbell County · HS-1 · TDT school day · 3 units/day typical</span>\n        </div>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:24px\">\n          <div style=\"flex:1 1 320px;min-width:0\">\n            <div class=\"th\" style=\"margin-bottom:4px\">This request</div>\n            <div class=\"step\" style=\"border-top:0\"><div class=\"dt\">Oct 13</div><div>Sent via Sfax · 150 units · Nov 3 – Jan 30 · receipt confirmed by phone Oct 22 (day 9)</div></div>\n            <div class=\"step\"><div class=\"dt\">Oct 27</div><div>Sentara called: \"we'd really like to give you 110.\" Call logged; no reply sent yet.</div></div>\n            <div class=\"step\"><div class=\"dt\">Today</div><div><b>Decide.</b> 110 units at 3/day is 7 weeks of a 13-week request.</div></div>\n          </div>\n          <div style=\"flex:1 1 320px;min-width:0;background:#F8F6F2;border-radius:10px;padding:12px 14px\">\n            <div class=\"th\" style=\"margin-bottom:4px\">Last time, same payer, same school (Sep)</div>\n            <div class=\"step\" style=\"border-top:0\"><div class=\"dt\">Req.</div><div>150 units</div></div>\n            <div class=\"step\"><div class=\"dt\">Offer</div><div>120</div></div>\n            <div class=\"step\"><div class=\"dt\">Sent</div><div>More evidence (suspended, eloped, aggressive) + counter at 140</div></div>\n            <div class=\"step\"><div class=\"dt\">Award</div><div><b style=\"color:#8A2E1C\">110</b> — below the opening offer. More information produced a smaller award.</div></div>\n          </div>\n        </div>\n\n        <div class=\"th\">Your options</div>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px\" role=\"group\" aria-label=\"Response options\">\n          <button class=\"{{d1}}\" onClick=\"{{p1}}\"><h3>1 · Accept 110</h3><p>Units last until about Dec 9. Psyflo starts the next request on Nov 24 so it goes in 14 business days early.</p><span class=\"chip n\">no deadline</span></button>\n          <div class=\"door\" style=\"opacity:.55;cursor:default\"><h3>2 · Send more information</h3><p>Only possible if Sentara asks for it. They have not. If they do, you get 24 hours and a clinician must send it.</p><span class=\"chip n\">not available</span></div>\n          <button class=\"{{d3}}\" onClick=\"{{p3}}\"><h3>3 · Ask for a peer-to-peer call</h3><p>One chance. Sentara's earliest slot is 4–8 weeks away; about 60% of the 110 units will be used by then. Psyflo writes the call notes for you.</p><span class=\"chip r\">units mostly gone before the call</span></button>\n          <button class=\"{{d4}}\" onClick=\"{{p4}}\"><h3>4 · Use the units, discharge, start over</h3><p>Use the 110, discharge, then send a brand-new initial request. Needs a monitoring plan and 30 days without service to count as new.</p><span class=\"chip y\">expect \"why were units used early?\"</span></button>\n        </div>\n        <div style=\"border:1px solid #217A78;border-radius:10px;padding:12px 14px;background:#F2F9F8;font-size:13px;display:flex;flex-wrap:wrap;gap:12px;align-items:center\">\n          <div style=\"flex:1;min-width:260px\"><b>{{planTitle}}</b> {{planText}}</div>\n          <a class=\"btn p\" href=\"Authorizations.dc.html\">{{planBtn}}</a>\n        </div>\n      </section>\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n        <!-- Denial reasons -->\n        <section class=\"card\" style=\"flex:3 1 520px;min-width:0;padding:16px 20px\">\n          <h2 style=\"margin:0 0 2px;font-size:16px;font-weight:600\">Why insurers say no · what Psyflo checks before sending</h2>\n          \n          <div class=\"tr th\" style=\"border-top:0\"><div>Insurer's reason</div><div>This yr</div><div>Checked before sending</div></div>\n          <div class=\"tr\"><div>\"Already connected to other services\"</div><div>6</div><div>Current-services table states each service's frequency and why it is insufficient alone — the too-many / too-few catch-22, answered in one field.</div></div>\n          <div class=\"tr\"><div>\"Can be addressed through the IEP\"</div><div>5</div><div>IEP status and school-coordination narrative required; what the IEP does and does not provide is named.</div></div>\n          <div class=\"tr\"><div>\"Can be addressed in outpatient\"</div><div>4</div><div>Prior-services table: provider, dates, outcome — pro-bono and phantom services flagged as \"will not count as evidence of prior care.\"</div></div>\n          <div class=\"tr\"><div>\"Internalizing symptoms not observable\"</div><div>3</div><div>PHQ-9 trend, safety-plan reviews and guardian-reported sleep/withdrawal are pulled in as observed data, dated within 30 days.</div></div>\n          <div class=\"tr\"><div>\"School counseling is not a covered service\"</div><div>2</div><div>Listed under care coordination rather than as the failed prior service, so it cannot be dismissed.</div></div>\n          <div class=\"tr\"><div>\"No documented failed prior service\"</div><div>2</div><div>Draft blocks on an empty outcomes column; asks the guardian question before submission, not after a denial.</div></div>\n          <div class=\"tr\"><div>\"There's no way you're spending 5+ hours with these kids\"</div><div>3</div><div>Staff tap start/stop on their phone during the day, so there is a time-stamped record of 3 units a day, including lunch and transitions.</div></div>\n        </section>\n\n        <div style=\"flex:2 1 340px;min-width:0;display:flex;flex-direction:column;gap:20px\">\n          <section class=\"card\" style=\"padding:16px 20px\">\n            <h2 style=\"margin:0 0 6px;font-size:15px;font-weight:600\">Peer-to-peer · T.N., 8 · Sentara · Dec 9</h2>\n            <div style=\"font-size:13px;color:#525B66\">Call notes ready · 65 units run out Nov 24</div>\n            <div style=\"margin-top:10px;display:flex;gap:8px\"><a class=\"btn o\" href=\"PeerBrief.dc.html\">Open call notes</a><a class=\"btn o\" href=\"Partials.dc.html\">Choose option 4 instead</a></div>\n          </section>\n          <section class=\"card\" style=\"padding:16px 20px\">\n            <h2 style=\"margin:0 0 6px;font-size:15px;font-weight:600\">Denial · E.C., 5 · Anthem · only the guardian can appeal</h2>\n            <div style=\"font-size:13px;color:#525B66\">Only the guardian can appeal. Drafted for her: a one-page plain-language letter, the reason restated, and what the payer's own letter means — so \"approved for less\" is not read as \"out of danger.\" Harvest keeps serving in the meantime; that choice is logged with the date.</div>\n            <div style=\"margin-top:10px\"><a class=\"btn o\" href=\"Authorizations.dc.html\">Open guardian letter</a></div>\n          </section>\n          \n        </div>\n      </div>\n    </div>\n  </main>\n</div>\n",note:"HOW THE DATA GETS IN · denials\n\nCaptured: the decision letter (Sfax or portal read-back) and the insurer's phone call, logged by staff.\n\nFlows: Psyflo shows the options with their clocks and this insurer's history. Choosing one creates the next task: monitoring plan, peer-to-peer request log, guardian letter.\n\nPopulates: the request's stage; the call notes (17); the guardian letter.\n\nEngineering: the denial-reason table is coded from insurer feedback text; history is kept per insurer per school.",make:(function(){ 
return class Component extends DCLogic {
  constructor(p){ super(p); this.state = { door: 1 }; }
  renderVals() {
    const d = this.state.door;
    const plans = {
      1:{t:'Plan if you accept:', x:'120 units logged as awarded; tracker row updated; site supervisor at HS-1 notified; continued-stay draft auto-starts Dec 1 from the notes.', b:'Accept and log'},
            3:{t:'Plan if you request a peer-to-peer:', x:'Request logged with date and time of the call to Sentara; brief drafted; unit countdown shows what is left on the day of the call. One shot only.', b:'Log the request'},
      4:{t:'Plan if you discharge early and resubmit:', x:'Monitoring plan drafted now; the "why were units used early" justification is written from the direct-hours log, not from memory; the 30-day gap is tracked so the new SRA is a true initial.', b:'Start the monitoring plan'}
    }[d];
    const c = k => 'door' + (d===k ? ' on' : '');
    return { d1:c(1), d3:c(3), d4:c(4),
      p1:()=>this.setState({door:1}), p3:()=>this.setState({door:3}), p4:()=>this.setState({door:4}),
      planTitle: plans.t, planText: plans.x, planBtn: plans.b };
  }
}
 })()},

ss=\"chip n\">set</span></div></div>\n      </section>\n      <section class=\"card\" style=\"padding:16px 20px\">\n        <h2 style=\"margin:0 0 6px;font-size:16px;font-weight:600\">What the new request will say about the early discharge</h2>\n        <div style=\"font-size:14px;line-height:1.5;border:1px solid #F0B44C;background:#FFFDF7;border-radius:8px;padding:10px 12px\">Units were exhausted ahead of the authorization end date because the client required 3 units per school day throughout (timer log attached: 5 h 10 m average). Need is unchanged: 2 physical incidents and 1 elopement in the last 30 days.</div>\n      </section>\n    </div>\n  </main>\n</div>\n",note:"HOW THE DATA GETS IN · Early discharge\n\nCaptured: the decision to discharge and the planned dates.\n\nFlows: Psyflo lays out the 30-day gap and the day the new initial can be sent; reminders go to the clinician.\n\nPopulates: Authorizations; the new initial request.",make:(function(){

column;gap:12px\">\n      <div style=\"display:flex;align-items:center;gap:8px;border:1px solid #2A3340;border-radius:8px;padding:8px 10px;font-size:12px;color:#C9D1D6\"><span style=\"width:8px;height:8px;border-radius:50%;background:#F0B44C;display:inline-block\"></span>Demo data · nothing is real</div>\n      <div style=\"display:flex;align-items:center;gap:10px;border-top:1px solid #2A3340;padding-top:14px\">\n        <div style=\"width:36px;height:36px;border-radius:50%;background:#217A78;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px\">JP</div>\n        <div><div style=\"font-weight:600;font-size:13px\">Jordan Perez</div><div style=\"font-size:12px;color:#8E99A6\">LPC · Asst. Clinical Support Supervisor</div></div>\n      </div>\n    </div>\n  </aside>\n\n  <main style=\"flex:999 1 560px;min-width:0;display:flex;flex-direction:column\">\n    <header style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid #E6E1D9;background:#fff\">\n      <a href=\"Authorizations.dc.html\" style=\"font-weight:500;text-decoration:none\">← Authorizations</a>\n      <span style=\"color:#525B66\">/</span><span style=\"font-weight:600\">R-0388 · T.N., 8</span>\n      <span class=\"chip n\">Peer-to-peer · Sentara · Tue Dec 9, 2:00 pm</span>\n      <div style=\"margin-left:auto;display:flex;gap:8px\"><span class=\"chip r\">units run out Nov 24 — 15 days before the call</span></div>\n    </header>\n    <div style=\"padding:22px 28px 32px;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end\">\n        <div>\n          <h1 style=\"margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em\">Call notes · T.N., 8 · Sentara peer-to-peer · Dec 9, 2:00 pm</h1>\n        </div>\n        <div style=\"margin-left:auto;display:flex;gap:8px\"><a class=\"btn o\" href=\"Partials.dc.html\">Print</a><a class=\"btn p\" href=\"Partials.dc.html\">Log the outcome</a></div>\n      </div>\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n        <section class=\"card\" style=\"flex:3 1 560px;min-width:0;padding:18px 22px\">\n          <div class=\"sec\">Open with</div>\n          <div class=\"fld\" style=\"margin-bottom:6px\">\"This is Jordan Perez, LPC, license and NPI on the request. I'm calling about an eight-year-old girl at an elementary school in Campbell County who was approved for 65 of the 150 units we requested.\"</div>\n          \n\n          <div class=\"sec\">The two criteria she meets, with dates</div>\n          <div style=\"display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px;margin-bottom:10px\">\n            <div class=\"fld\"><b>Relationships.</b> Hitting or pushing peers 3× a week in the last 30 days (Oct 1, 3, 8, 10, 15, 17, 22, 24, 28), 5–10 minutes each, needing staff to separate her. 3 office referrals. Classes: 6, passing 3.</div>\n            <div class=\"fld\"><b>Interventions that have not worked.</b> School counseling weekly since Sep 2025 — ongoing, no change. Outpatient Jan–May 2026, 11 sessions — ended by the provider as \"not making progress.\"</div>\n          </div>\n\n          <div class=\"sec\">Level of care</div>\n          <div class=\"fld\" style=\"margin-bottom:10px\">Risk of a more restrictive setting: the school raised an alternative placement at the Oct 14 IEP meeting. Without daily intervention she is likely to be moved.</div>\n\n          <div class=\"sec\">What 65 units means</div>\n          <div class=\"fld\" style=\"margin-bottom:10px\">At 3 units a day, 65 units is 22 school days. They ran out Nov 24. Since then Harvest has kept seeing her unpaid. We are asking for the remaining 85 units through Feb 6.</div>\n\n          <div class=\"sec\">Questions they usually ask · short answers</div>\n          <div style=\"display:grid;grid-template-columns:220px minmax(0,1fr);gap:6px 12px;font-size:13px\">\n            <div style=\"font-weight:600\">\"Why can't the IEP handle this?\"</div><div>The IEP gives her a behaviour plan and seating. It gives her no clinical staff at lunch and transitions, where 6 of the 9 incidents happened.</div>\n            <div style=\"font-weight:600\">\"Is she actively suicidal?\"</div><div>That is not a criterion for TDT. She meets two of the three listed criteria and one level-of-care criterion.</div>\n            <div style=\"font-weight:600\">\"You can't be spending 5 hours a day.\"</div><div>Staff log start and stop times on their phones. October average: 5 h 12 min a day, including lunch and transitions. I can send the log.</div>\n            <div style=\"font-weight:600\">\"She's been in services a long time.\"</div><div>Since Feb 2026. Incidents fell from daily to 3× a week; the goal is 1× a week before step-down. Progress is the reason to continue, not to stop.</div>\n          </div>\n        </section>\n\n        <div style=\"flex:2 1 340px;min-width:0;display:flex;flex-direction:column;gap:20px\">\n          <section class=\"card\" style=\"padding:16px 20px\">\n            <h2 style=\"margin:0 0 6px;font-size:15px;font-weight:600\">Before the call</h2>\n            <div class=\"step\" style=\"border-top:0\"><div class=\"dt\">Oct 27</div><div>Partial award: 65 of 150. Peer-to-peer requested by phone; 48 min on hold.</div></div>\n            <div class=\"step\"><div class=\"dt\">Oct 27</div><div>Sentara offered Dec 9, 2:00 pm. First available.</div></div>\n            <div class=\"step\"><div class=\"dt\">Nov 24</div><div>Units ran out. Service continued, unpaid.</div></div>\n            <div class=\"step\"><div class=\"dt\">Dec 8</div><div>Reminder: this is the one chance. A reschedule is another month.</div></div>\n          </section>\n          <section class=\"card\" style=\"padding:16px 20px\">\n            <h2 style=\"margin:0 0 6px;font-size:15px;font-weight:600\">After the call</h2>\n            \n            <div style=\"margin-top:10px\"><a class=\"btn o\" href=\"Partials.dc.html\">Log the outcome</a></div>\n          </section>\n          \n        </div>\n      </div>\n    </div>\n  </main>\n</div>\n",note:"HOW THE DATA GETS IN · notes\n\nCaptured: nothing new.\n\nFlows: criteria text from the submitted request; dates from the notes; units left on the call date from the countdown; contact-time log from the Start/Stop taps; likely questions from the denial-reason table.\n\nPopulates: a printable page the clinician holds during the call; the outcome is logged back on the request.\n\nEngineering: assembled in advance; nothing generated during the call.",make:(function(){ 
return class Component extends DCLogic {
  renderVals() { return {}; }
}
 })()},

4;border:1.5px solid #D9D4CC}\n.btn.r{background:#B9541F;color:#fff}\n",tpl:"\n\n\n<div style=\"width:390px;height:844px;background:#F8F6F2;display:flex;flex-direction:column;overflow:hidden\">\n  <div style=\"background:#151B24;color:#fff;padding:18px 20px 14px\">\n    <div style=\"font-weight:700;font-size:17px\">Harvest Outreach Center</div>\n    <div style=\"font-size:14px;color:#C9D1D6;margin-top:2px\">Ethan's insurance decision</div>\n  </div>\n  <div style=\"flex:1;padding:14px 20px 0;display:flex;flex-direction:column;gap:10px;overflow:hidden\">\n    <div class=\"tile\" style=\"border-color:#8A2E1C;background:#FBE9E4\"><b>Anthem said no on Oct 22</b><div class=\"s\">Their reason: \"already connected to other services.\" Harvest disagrees.</div></div>\n    <div class=\"tile\">\n      <b>Your appeal letter</b>\n      <div class=\"s\" style=\"margin-top:6px;color:#151B24;line-height:1.5\">I am Ethan's guardian. I am appealing Anthem's decision of October 22. Ethan's school counseling has not stopped his behavior at school: 4 office referrals this month. Harvest's program is the only daily support available to him. Please review the attached records and approve the 90 units requested.</div>\n      <div class=\"s\" style=\"margin-top:6px\"><a href=\"#edit\">Change the wording</a> · <a href=\"#es\">Leer en español</a></div>\n    </div>\n    <div class=\"tile\"><b>Attached by Harvest</b><div class=\"s\">Denial letter · the request · 6 daily notes · school counselor's letter</div></div>\n    <a class=\"btn p\" href=\"#sign\" style=\"min-height:54px\">Sign and send</a>\n    <div style=\"font-size:13px;color:#525B66;text-align:center\">Harvest faxes it to Anthem for you · 51 days left to appeal</div>\n  </div>\n  <div style=\"padding:12px 20px 22px;border-top:1px solid #E6E1D9;background:#F8F6F2;font-size:12px;color:#525B66;text-align:center\"><a href=\"#call\">Questions? Call Jordan</a></div>\n</div>\n",note:"HOW THE DATA GETS IN · Appeal letter\n\nCaptured: the guardian's choice to appeal and their signature, on the phone.\n\nFlows: Psyflo drafts the letter from the denial and the record; the guardian reads, signs and sends it — the appeal is theirs.\n\nPopulates: the request's appeal stage and clocks.",make:(function(){

\n  <main style=\"flex:999 1 560px;min-width:0;display:flex;flex-direction:column\">\n    <header style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid #E6E1D9;background:#fff\">\n      <div style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#525B66;font-weight:600\">Baseline · master tracker + Harvest's Lauris export · <span style=\"color:#151B24\">12 months to Oct 2026</span></div>\n      <div class=\"seg\" role=\"group\" aria-label=\"Locality\"><button class=\"{{bBoth}}\" onClick=\"{{pBoth}}\">Both localities</button><button class=\"{{bCC}}\" onClick=\"{{pCC}}\">Campbell County</button><button class=\"{{bLC}}\" onClick=\"{{pLC}}\">Lynchburg City</button></div>\n      <div style=\"margin-left:auto\"></div>\n    </header>\n\n    <div style=\"padding:26px 28px 32px;display:flex;flex-direction:column;gap:20px\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end\">\n        <div>\n          <h1 style=\"margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em\">Analytics · authorizations, clients, program</h1>\n        </div>\n        <div style=\"margin-left:auto;display:flex;gap:8px;align-items:center\"><a class=\"btn p\" href=\"Authorizations.dc.html\">Export (PDF / CSV)</a></div>\n      </div>\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n        <div class=\"kpi\"><div class=\"l\">SRAs returned partial</div><b>{{k1}}</b><span>of {{n}} decided · \"majority\" becomes a number</span></div>\n        <div class=\"kpi\"><div class=\"l\">Units awarded vs requested</div><b>{{k2}}</b><span>median award on a 150-unit ask: {{k2b}} units</span></div>\n        <div class=\"kpi\"><div class=\"l\">Full denials</div><b>{{k3}}</b><span>of {{n}} · appeals attempted: 1 · overturned: 0</span></div>\n        <div class=\"kpi\"><div class=\"l\">Median decision time</div><b>{{k4}}</b><span>calendar days · standard is 7 since Jan 2026</span></div>\n        <div class=\"kpi\"><div class=\"l\">Early discharge + resubmit</div><b>{{k5}}</b><span>authorizations restarted early · each one is a 2–3 h re-intake</span></div>\n        <div class=\"kpi\"><div class=\"l\">Unpaid clinical hours</div><b>{{k6}}</b><span>screenings × 30–45 min + info requests + peer-to-peers</span></div>\n      </div>\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n        <section class=\"card\" style=\"flex:1 1 100%;min-width:0;padding:16px 20px\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:baseline\"><h2 style=\"margin:0;font-size:16px;font-weight:600\">Units requested vs awarded · by month</h2><span style=\"font-size:12px;color:#525B66\">TDT H2016 · {{scope}}</span></div>\n          <div style=\"display:flex;gap:14px;font-size:12px;color:#525B66;margin:8px 0 14px\"><span><i style=\"display:inline-block;width:10px;height:10px;background:#C9D1D6;border-radius:2px;margin-right:5px\"></i>Requested</span><span><i style=\"display:inline-block;width:10px;height:10px;background:#217A78;border-radius:2px;margin-right:5px\"></i>Awarded</span><span><i style=\"display:inline-block;width:10px;height:10px;background:#F0B44C;border-radius:2px;margin-right:5px\"></i>Summer transition (May–Jun)</span></div>\n          <div style=\"display:flex;gap:6px;align-items:flex-end;overflow-x:auto\">\n            <sc-for list=\"{{months}}\" as=\"m\" hint-placeholder-count=\"12\">\n              <div class=\"mo\"><div class=\"bars\"><i style=\"{{m.req}}\"></i><i style=\"{{m.aw}}\"></i></div><small>{{m.l}}</small></div>\n            </sc-for>\n          </div>\n          \n        </section>\n\n        <section class=\"card\" style=\"flex:1 1 100%;min-width:0;padding:16px 20px\">\n          <h2 style=\"margin:0 0 2px;font-size:16px;font-weight:600\">By payer</h2>\n          \n          <div class=\"tr th\" style=\"border-top:0;padding-top:0\"><div>Payer</div><div>Requests</div><div>Partial</div><div>Awarded vs asked</div><div>Decision days</div><div>Channel</div></div>\n          <div class=\"tr\"><div>Sentara Health Plans</div><div>31</div><div><span class=\"chip r\">74%</span></div><div>61%</div><div>7 d</div><div>Fax</div></div>\n          <div class=\"tr\"><div>Anthem HealthKeepers Plus</div><div>44</div><div><span class=\"chip y\">58%</span></div><div>72%</div><div>5 d</div><div>Availity</div></div>\n          <div class=\"tr\"><div>Aetna Better Health</div><div>26</div><div><span class=\"chip y\">54%</span></div><div>70%</div><div>7 d</div><div>Fax</div></div>\n          <div class=\"tr\"><div>Humana Healthy Horizons</div><div>22</div><div><span class=\"chip y\">50%</span></div><div>75%</div><div>6 d</div><div>Fax</div></div>\n          <div class=\"tr\"><div>UnitedHealthcare Community Plan</div><div>19</div><div><span class=\"chip g\">37%</span></div><div>83%</div><div>4 d</div><div>Portal</div></div>\n          <div class=\"tr\"><div>Medicaid FFS · Acentra</div><div>4</div><div><span class=\"chip g\">25%</span></div><div>90%</div><div>6 d</div><div>Fax</div></div>\n          \n        </section>\n      </div>\n\n      <div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n        <section class=\"card\" style=\"flex:1 1 440px;min-width:0;padding:16px 20px\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:baseline\"><h2 style=\"margin:0;font-size:16px;font-weight:600\">Client progress · one child, over time</h2><span class=\"chip n\">M.R., 7</span></div>\n          \n          <div class=\"tr\" style=\"grid-template-columns:minmax(0,1fr) 80px 80px 80px 110px;border-top:0;padding-top:0\"><div class=\"th\">Measure</div><div class=\"th\">Intake</div><div class=\"th\">Q1</div><div class=\"th\">Now</div><div class=\"th\">Trend</div></div>\n          <div class=\"tr\" style=\"grid-template-columns:minmax(0,1fr) 80px 80px 80px 110px\"><div>PHQ-A (child)</div><div>14</div><div>11</div><div>8</div><div><span class=\"chip g\">improving</span></div></div>\n          <div class=\"tr\" style=\"grid-template-columns:minmax(0,1fr) 80px 80px 80px 110px\"><div>DSM cross-cutting · parent</div><div>21</div><div>19</div><div>18</div><div><span class=\"chip y\">slower</span></div></div>\n          <div class=\"tr\" style=\"grid-template-columns:minmax(0,1fr) 80px 80px 80px 110px\"><div>DSM cross-cutting · child</div><div>17</div><div>12</div><div>9</div><div><span class=\"chip g\">improving</span></div></div>\n          <div class=\"tr\" style=\"grid-template-columns:minmax(0,1fr) 80px 80px 80px 110px\"><div>Daily progress rating (avg)</div><div>1.9</div><div>2.6</div><div>3.4</div><div><span class=\"chip g\">improving</span></div></div>\n          <div class=\"tr\" style=\"grid-template-columns:minmax(0,1fr) 80px 80px 80px 110px\"><div>Office referrals (counselor, school portal)</div><div>6/mo</div><div>4</div><div>2</div><div><span class=\"chip g\">improving</span></div></div>\n          \n        </section>\n        <section class=\"card\" style=\"flex:1 1 360px;min-width:0;padding:16px 20px\">\n          <h2 style=\"margin:0 0 2px;font-size:16px;font-weight:600\">Reports, assembled instead of built</h2>\n          \n          <div class=\"tr\" style=\"grid-template-columns:minmax(0,1fr) 120px;border-top:0;padding-top:0\"><div><b>School-division report</b><div style=\"font-size:12px;color:#525B66\">by school, vs Virginia</div></div><div><a class=\"btn o\" href=\"#div\" style=\"min-height:34px;padding:0 12px;font-size:13px\">Preview</a></div></div>\n          <div class=\"tr\" style=\"grid-template-columns:minmax(0,1fr) 120px\"><div><b>Grant pull</b><div style=\"font-size:12px;color:#525B66\">cited sentences · incident counts</div></div><div><a class=\"btn o\" href=\"#grant\" style=\"min-height:34px;padding:0 12px;font-size:13px\">Run</a></div></div>\n          <div class=\"tr\" style=\"grid-template-columns:minmax(0,1fr) 120px\"><div><b>Quarterly review · M.R.</b><div style=\"font-size:12px;color:#525B66\">per objective, with assessments</div></div><div><a class=\"btn o\" href=\"#q\" style=\"min-height:34px;padding:0 12px;font-size:13px\">Draft</a></div></div>\n          <div class=\"tr\" style=\"grid-template-columns:minmax(0,1fr) 120px\"><div><b>Licensure binder</b><div style=\"font-size:12px;color:#525B66\">QI plan → monthly checks → evidence, print-ready</div></div><div><a class=\"btn o\" href=\"Compliance.dc.html\" style=\"min-height:34px;padding:0 12px;font-size:13px\">Open</a></div></div>\n        </section>\n      </div>\n\n      \n    </div>\n  </main>\n</div>\n",note:"HOW THE DATA GETS IN · Analytics\n\nCaptured: nothing new. Authorization outcomes from the tracker (10) and a one-time import of the master-tracker history; assessments (PHQ, GAD, DSM cross-cutting, SUDS) migrated from Lauris surveys; daily ratings from notes; attendance and referrals from the school portal (18); incidents from Compliance (20).\n\nFlows: the authorization baseline by payer stays the pilot's scorecard. Client progress shows one child over time with parent and child measures side by side and flags where they diverge. Reports (division, grant, quarterly, binder) are assembled from the same rows.\n\nPopulates: the pilot measures; the year-end division report that used to take April to August; grant pulls on demand.\n\nEngineering: Psyflo's own data plus cadence exports from Lauris; \"ask a question\" is a later phase once phases 3–4 hold real data.",make:(function(){ 
return class Component extends DCLogic {
  constructor(p){ super(p); this.state = { s: 'both' }; }
  renderVals() {
    const s = this.state.s;
    const k = { both:{n:146,k1:'58%',k2:'71%',k2b:'105',k3:'7%',k4:'6',k5:'23',k6:'≈310 h',scope:'both localities'},
                cc:{n:84,k1:'55%',k2:'73%',k2b:'110',k3:'6%',k4:'6',k5:'12',k6:'≈170 h',scope:'Campbell County'},
                lc:{n:62,k1:'63%',k2:'68%',k2b:'100',k3:'8%',k4:'7',k5:'11',k6:'≈140 h',scope:'Lynchburg City'} }[s];
    const req = [1800,1650,1950,2100,1500,900,600,1200,2400,2250,2100,1950];
    const aw  = [1300,1150,1400,1450,850,450,400,900,1700,1650,1500,1400];
    const lbl = ['Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct'];
    const f = s==='both' ? 1 : (s==='cc' ? 0.58 : 0.42);
    const months = lbl.map((l,i) => ({ l, req:'height:'+Math.round(req[i]*f/2400*140)+'px;background:#C9D1D6', aw:'height:'+Math.round(aw[i]*f/2400*140)+'px;background:'+((i===6||i===7)?'#F0B44C':'#217A78') }));
    const c = x => s===x ? 'on' : '';
    return Object.assign({}, k, { months, bBoth:c('both'), bCC:c('cc'), bLC:c('lc'),
      pBoth:()=>this.setState({s:'both'}), pCC:()=>this.setState({s:'cc'}), pLC:()=>this.setState({s:'lc'}) });
  }
}

100</div><div><span class=\"chip n\">scheduled Nov 15</span></div></div>\n        </div>\n      </section>\n      <section class=\"card\" style=\"padding:16px 20px\">\n        <h2 style=\"margin:0 0 8px;font-size:16px;font-weight:600\">Missing signatures · 17</h2>\n        <div class=\"row\" style=\"grid-template-columns:110px minmax(0,1fr) 160px 150px;border-top:0;padding-top:0\"><div>M.R.</div><div>Quarterly report · Aug 14 · scanned copy found in Documents</div><div><span class=\"chip g\">resolved</span></div><div></div></div>\n        <div class=\"row\" style=\"grid-template-columns:110px minmax(0,1fr) 160px 150px\"><div>J.T.</div><div>Treatment plan · Sep 2 · no signed copy anywhere</div><div><span class=\"chip r\">guardian to sign</span></div><div><a class=\"btn o\" href=\"ParentPortal.dc.html\" style=\"min-height:32px;padding:0 10px;font-size:12px\">Send to portal</a></div></div>\n        <div class=\"row\" style=\"grid-template-columns:110px minmax(0,1fr) 160px 150px\"><div>D.P.</div><div>Quarterly report · Oct 10 · printed, not back</div><div><span class=\"chip r\">guardian to sign</span></div><div><a class=\"btn o\" href=\"ParentPortal.dc.html\" style=\"min-height:32px;padding:0 10px;font-size:12px\">Send to portal</a></div></div>\n        <div style=\"font-size:12px;color:#525B66;margin-top:10px\">14 more</div>\n      </section>\n    </div>\n  </main>\n</div>\n",note:"HOW THE DATA GETS IN · Migration\n\nCaptured: the master tracker and the active client list, imported once in the first week.\n\nFlows: each active client gets a request with its real dates; gaps (missing signatures, unknown payer) are listed for staff to fix.\n\nPopulates: Authorizations, Analytics baseline.",make:(function(){

12px\">\n      <div style=\"display:flex;align-items:center;gap:8px;border:1px solid #2A3340;border-radius:8px;padding:8px 10px;font-size:12px;color:#C9D1D6\"><span style=\"width:8px;height:8px;border-radius:50%;background:#F0B44C;display:inline-block\"></span>Demo data · nothing is real</div>\n      <div style=\"display:flex;align-items:center;gap:10px;border-top:1px solid #2A3340;padding-top:14px\">\n        <div style=\"width:36px;height:36px;border-radius:50%;background:#217A78;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px\">DO</div>\n        <div><div style=\"font-weight:600;font-size:13px\">Dana Owens</div><div style=\"font-size:12px;color:#8E99A6\">Admin · program office</div></div>\n      </div>\n    </div>\n  </aside>\n\n  <main style=\"flex:999 1 560px;min-width:0;display:flex;flex-direction:column\">\n    <header style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid #E6E1D9;background:#fff\">\n<span style=\"font-weight:600\">Settings</span><span style=\"color:#525B66\">/</span><span>Consents · knowledge library</span>\n    </header>\n    <div style=\"padding:26px 28px 32px;display:flex;flex-direction:column;gap:20px\">\n      <h1 style=\"margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em\">What the drafts are allowed to use</h1>\n      <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n        <section class=\"card\" style=\"flex:1 1 440px;min-width:0;padding:16px 20px\">\n          <h2 style=\"margin:0 0 8px;font-size:16px;font-weight:600\">Consents</h2>\n          <div class=\"row\" style=\"grid-template-columns:minmax(0,1fr) 150px;border-top:0;padding-top:0\"><div><b>AI recording of screening and intake</b><div style=\"font-size:12px;color:#525B66\">in the informed-consent packet · attorney-reviewed Oct 2026</div></div><div><span class=\"chip g\">in packet</span></div></div>\n          <div class=\"row\" style=\"grid-template-columns:minmax(0,1fr) 150px\"><div><b>Note enhancement</b><div style=\"font-size:12px;color:#525B66\">staff notice · in onboarding</div></div><div><span class=\"chip g\">in packet</span></div></div>\n          <div class=\"row\" style=\"grid-template-columns:minmax(0,1fr) 150px\"><div><b>Parent portal and check-ins</b></div><div><span class=\"chip g\">in packet</span></div></div>\n          <div class=\"row\" style=\"grid-template-columns:minmax(0,1fr) 150px\"><div><b>Scope</b><div style=\"font-size:12px;color:#525B66\">TDT clients only · outpatient and SEBs records never read</div></div><div><span class=\"chip n\">enforced</span></div></div>\n          <div class=\"row\" style=\"grid-template-columns:minmax(0,1fr) 150px\"><div><b>Business associate agreement</b></div><div><span class=\"chip g\">signed Oct 3</span></div></div>\n        </section>\n        <section class=\"card\" style=\"flex:1 1 440px;min-width:0;padding:16px 20px\">\n          <h2 style=\"margin:0 0 8px;font-size:16px;font-weight:600\">Knowledge library</h2>\n          <div class=\"row\" style=\"grid-template-columns:minmax(0,1fr) 140px;border-top:0;padding-top:0\"><div><b>Harvest's intervention list and rationale</b><div style=\"font-size:12px;color:#525B66\">QMHP 1.1–1.10 · clinical 2.1 · written with the documentation trainer</div></div><div><span class=\"chip g\">current</span></div></div>\n          <div class=\"row\" style=\"grid-template-columns:minmax(0,1fr) 140px\"><div><b>Harvest's eight approaches and note-writing training</b></div><div><span class=\"chip g\">current</span></div></div>\n          <div class=\"row\" style=\"grid-template-columns:minmax(0,1fr) 140px\"><div><b>DMAS forms and the CMHRS manual</b><div style=\"font-size:12px;color:#525B66\">checked weekly for changes</div></div><div><span class=\"chip g\">Oct 2026</span></div></div>\n          <div class=\"row\" style=\"grid-template-columns:minmax(0,1fr) 140px\"><div><b>Each MCO's provider manual</b><div style=\"font-size:12px;color:#525B66\">5 plans · checked monthly</div></div><div><span class=\"chip y\" style=\"white-space:normal\">Sentara updated Oct 20</span></div></div>\n          <div class=\"row\" style=\"grid-template-columns:minmax(0,1fr) 140px\"><div><b>DSM-5-TR · published evidence</b><div style=\"font-size:12px;color:#525B66\">citation library · reviewed quarterly</div></div><div><span class=\"chip g\">current</span></div></div>\n          <div class=\"row\" style=\"grid-template-columns:minmax(0,1fr) 140px\"><div><b>Redesign draft (CPST, 15-minute units, CANS)</b></div><div><span class=\"chip n\">tracking</span></div></div>\n          <div style=\"margin-top:10px\"><a class=\"btn o\" href=\"#add\">Add a document</a></div>\n        </section>\n      </div>\n    </div>\n  </main>\n</div>\n",note:"HOW THE DATA GETS IN · Settings · library\n\nCaptured: the ISP objective names, note templates and payer numbers Harvest uses, typed in once.\n\nFlows: used by Scribe, Scan & enhance and Review a request so drafts use Harvest's words.",make:(function(){

  renderVals() { return {}; }

const App={i:0,inst:null,handlers:[],
  go(i,push){ i=(i+SCREENS.length)%SCREENS.length; this.i=i; const s=SCREENS[i]; this.inst=new s.make({}); this.handlers=[];
    document.getElementById('scrcss').textContent=s.css.replace(/body\s*\{[^}]*\}/g,m=>m.replace('margin:0;','margin:0;').replace(/background:[^;}]+;?/,''));
    document.getElementById('stage').className=s.fixed?(s.w<500?'fixed phone':'fixed'):'';
    document.body.style.background=s.fixed?'#DEDAD3':'#F8F6F2';
    document.getElementById('pick').value=String(i);
    if(push!==false){ try{ history.replaceState(null,'','#'+s.id);}catch(e){} }
    this.paint(); window.scrollTo(0,0);
  },
  lookup(ctx,p){ if(p==='true')return true; if(p==='false')return false; return p.split('.').reduce((o,k)=>o==null?undefined:o[k],ctx); },
  render(tpl,ctx){ const L=this.lookup.bind(this);
    tpl=tpl.replace(/<sc-for list="\{\{\s*([\w.$]+)\s*\}\}" as="(\w+)"[^>]*>([\s\S]*?)<\/sc-for>/g,(m,list,as,body)=>{const arr=L(ctx,list)||[];return arr.map((it,k)=>this.render(body,Object.assign({},ctx,{[as]:it,$index:k}))).join('');});
    tpl=tpl.replace(/<sc-if value="\{\{\s*([\w.$]+)\s*\}\}"[^>]*>([\s\S]*?)<\/sc-if>/g,(m,c,body)=>L(ctx,c)?this.render(body,ctx):'');
    tpl=tpl.replace(/onClick="\{\{\s*([\w.$]+)\s*\}\}"/g,(m,p)=>{const fn=L(ctx,p); if(typeof fn!=='function')return ''; this.handlers.push(fn); return 'data-on="'+(this.handlers.length-1)+'"';});
    tpl=tpl.replace(/\{\{\s*([\w.$]+)\s*\}\}/g,(m,p)=>{const v=L(ctx,p);return (v===undefined||typeof v==='function')?'':String(v);});
    return tpl; },
  paint(){ const s=SCREENS[this.i]; this.handlers=[]; const vals=this.inst.renderVals()||{}; const root=document.getElementById('root'); const y=window.scrollY;
    root.innerHTML=this.render(s.tpl,vals);
    root.querySelectorAll('[data-on]').forEach(el=>{const h=this.handlers[+el.getAttribute('data-on')]; el.addEventListener('click',e=>{e.preventDefault();h(e);});});
    root.querySelectorAll('form').forEach(f=>f.addEventListener('submit',e=>e.preventDefault()));
    window.scrollTo(0,y);
  },
  byFile(f){ return SCREENS.findIndex(s=>s.file===f.replace(/^\.\//,'')); }
};
const pick=document.getElementById('pick');
SCREENS.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.title;pick.appendChild(o);});
pick.addEventListener('change',()=>App.go(+pick.value));
document.getElementById('prev').addEventListener('click',()=>App.go(App.i-1));
document.getElementById('next').addEventListener('click',()=>App.go(App.i+1));
document.getElementById('info').addEventListener('click',()=>{const d=document.getElementById('drawer');document.getElementById('dtitle').textContent=SCREENS[App.i].title;document.getElementById('dtext').textContent=SCREENS[App.i].note||'No note for this screen.';d.hidden=!d.hidden;});
document.getElementById('close').addEventListener('click',()=>{document.getElementById('drawer').hidden=true;});
document.getElementById('root').addEventListener('click',e=>{const a=e.target.closest('a[href]'); if(!a)return; const h=a.getAttribute('href');
  if(/\.dc\.html$/.test(h)){e.preventDefault();const i=App.byFile(h); if(i>=0)App.go(i);}
  else if(h.startsWith('#')){e.preventDefault();const t=document.getElementById(h.slice(1)); if(t)t.scrollIntoView({behavior:'smooth',block:'center'});}
});
document.addEventListener('keydown',e=>{ if(e.target.matches('input,select,textarea'))return; if(e.key==='ArrowRight')App.go(App.i+1); if(e.key==='ArrowLeft')App.go(App.i-1); if(e.key==='Escape')document.getElementById('drawer').hidden=true;});
window.addEventListener('hashchange',()=>{const i=SCREENS.findIndex(s=>'#'+s.id===location.hash); if(i>=0&&i!==App.i)App.go(i,false);});
(function(){const i=SCREENS.findIndex(s=>'#'+s.id===location.hash); App.go(i>=0?i:0,false);})();
</script>
