<style>
/* Demo shell: a thin navy bar over product screens that keep their own look. */
:root{--bar:#151B24;--bar-fg:#F8F6F2;--bar-mute:#8E99A6;--teal:#5FC0BE;--mari:#F0B44C;--ground:#E9E6E0}
html,body{height:100%}
body{background:var(--ground);color:#151B24;margin:0;font-family:'DM Sans',system-ui,sans-serif}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bar);color:var(--bar-fg);display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bar)}
#bar b{font-weight:600}
#bar .num{color:var(--teal);font-weight:600;font-variant-numeric:tabular-nums}
#bar button,#bar select{font:inherit;font-size:13px;min-height:36px;border-radius:8px;border:1px solid #3C4756;background:#222A35;color:var(--bar-fg);padding:0 12px;cursor:pointer}
#bar button:hover{background:#2C3644}
#bar button:focus-visible,#bar select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#bar select{max-width:46vw}
#bar .sp{flex:1}
#bar .hint{color:var(--bar-mute);font-size:12px}
#stage{min-height:calc(100% - 52px)}
#stage.fixed{overflow-x:auto;padding:24px 0 40px}
#stage.fixed #root{width:1440px;margin:0 auto;box-shadow:0 10px 40px rgba(0,0,0,.18);border-radius:12px;overflow:hidden}
#stage.phone #root{width:390px;border-radius:36px;border:10px solid #151B24}
#drawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,100vw);background:#fff;color:#151B24;z-index:70;box-shadow:-8px 0 30px rgba(0,0,0,.2);padding:52px 24px 24px;overflow:auto;white-space:pre-line;font-size:14px;line-height:1.55}
#drawer h2{margin:0 0 12px;font-size:16px}
#drawer .x{position:absolute;top:12px;right:16px;font:inherit;border:1px solid #D9D4CC;background:#fff;border-radius:8px;min-height:36px;padding:0 12px;cursor:pointer}
#drawer[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){#root{animation:fade .18s ease}}
@keyframes fade{from{opacity:.4}to{opacity:1}}
@media (max-width:600px){#bar .hint{display:none}}
</style>

\"box x\">\n        <div class=\"k\">In Lauris · the extension</div>\n        <h2>Every Lauris form</h2>\n        <ul><li>Admission screening <span class=\"pill\">Scribe</span></li><li>Intake / CNA <span class=\"pill\">Scribe</span></li><li>Treatment plan (ISP) <span class=\"pill\">Scan &amp; enhance</span></li><li>Daily, weekly, monthly notes <span class=\"pill\">Scan &amp; enhance</span></li><li>Initial SRA <span class=\"pill\">Review a request</span></li><li>Continued-stay SRA <span class=\"pill\">Review a request</span></li><li>Incident report <span class=\"pill\">copied at Process Form</span></li></ul>\n        \n      </div>\n      <div class=\"box x\">\n        <div class=\"k\">On the work iPhone · the app</div>\n        <h2>The same three buttons, away from a desk</h2>\n        <ul><li>Pick a student, or say the name</li><li>Start / stop, screen locked</li><li>Say what happened; it is ready when you open the student in Lauris</li><li>Assessment reminders</li></ul>\n        \n      </div>\n      <div class=\"box a\">\n        <div class=\"k\">The Psyflo app · platform</div>\n        <h2>What Lauris has no place for</h2>\n        <ul><li>Referral review, before a Lauris record exists</li><li>Send, and the tracker with the clocks</li><li>Reply to an information request</li><li>Partial approval: the three doors</li><li>Peer-to-peer brief · guardian appeal letter</li><li>Staff dashboard · Compliance · Analytics</li></ul>\n        \n      </div>\n      <div class=\"box\">\n        <div class=\"k\">Outside doors · portals</div>\n        <h2>For people without a Lauris login</h2>\n        <ul><li><b>Parent portal:</b> sign enrollment before intake, see progress in plain words, two-minute check-ins, sign the quarterly</li><li><b>School portal:</b> refer (with guardian consent), share what happened today, teacher check-in, see functioning</li></ul>\n        \n      </div>\n    </div>\n\n    <section style=\"background:#fff;border:1px solid #E6E1D9;border-radius:14px;padding:18px 22px;margin-top:22px\">\n      <h2 style=\"margin:0 0 4px;font-size:18px;font-weight:600\">By person</h2>\n      <div class=\"tr th\" style=\"border-top:0;padding-top:0\"><div>Who</div><div>Where they work</div><div>What they never see</div></div>\n      <div class=\"tr\"><div><b>Direct support staff</b><div style=\"font-size:12px;color:#525B66\">QMHP, QMHP-T</div></div><div>Extension in Lauris and the phone app. Scribe, Scan &amp; enhance, Track time. Their own students and notes.</div><div>The Psyflo app. Screening, intake and request content for any student.</div></div>\n      <div class=\"tr\"><div><b>Clinician</b><div style=\"font-size:12px;color:#525B66\">LPC, resident</div></div><div>Extension for every form, including both SRAs. The app for sending, tracking, replying to payers, deciding on partials, the peer-to-peer brief.</div><div>Nothing is hidden; nothing is submitted without their click.</div></div>\n      <div class=\"tr\"><div><b>Site supervisor</b></div><div>Staff dashboard: who is behind, trainee notes to approve, patterns this month. Compliance for their schools.</div><div>Writing in the extension on someone else's behalf.</div></div>\n      <div class=\"tr\"><div><b>Admin / leadership</b></div><div>The app only: Authorizations, Staff, Compliance, Analytics, settings and roles.</div><div>The extension.</div></div>\n      <div class=\"tr\"><div><b>Parent or guardian</b></div><div>Parent portal on their phone, two languages.</div><div>Notes, diagnoses, anything another family said.</div></div>\n      <div class=\"tr\"><div><b>School staff</b></div><div>School portal: counselor, teacher and administrator views.</div><div>Clinical notes, diagnoses, anything from home.</div></div>\n    </section>\n\n    <section style=\"display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:14px;margin-top:22px\">\n      <div class=\"box\"><div class=\"k\">Always true</div><h2 style=\"font-size:16px\">Lauris stays the record</h2></div>\n      <div class=\"box\"><div class=\"k\">Always true</div><h2 style=\"font-size:16px\">A person signs everything</h2></div>\n      <div class=\"box\"><div class=\"k\">Always true</div><h2 style=\"font-size:16px\">No EHR integration</h2></div>\n    </section>\n  </div>\n</div>\n",note:"HOW TO READ THE DEMO · Where things live\n\nThe rule on this screen is the one the demo follows: a Lauris form is written by the extension beside it (screening, intake, plan, notes, both SRAs); everything that is not a Lauris form lives in the Psyflo app (referral review, send and track, payer replies, partial decisions, the peer-to-peer brief, staff, compliance, analytics); parents and schools use portals. The screens that follow are in workflow order, and each carries a blue note like this one saying how its data is captured, where it flows, and what it populates.",make:(function(){

0px\"><div><b>Fri</b></div><div>Weekly guardian call · M.R. · grandmother</div><div style=\"text-align:right\"><a class=\"btn o\" href=\"ExtWeekly.dc.html\" style=\"min-height:34px;padding:0 12px;font-size:13px\">Open in Lauris</a></div></div>\n        <div class=\"row\" style=\"grid-template-columns:90px minmax(0,1fr) 130px\"><div><b>Fri</b></div><div>Monthly collateral · D.P. · school counselor</div><div style=\"text-align:right\"><a class=\"btn o\" href=\"ExtMonthly.dc.html\" style=\"min-height:34px;padding:0 12px;font-size:13px\">Open in Lauris</a></div></div>\n        <div class=\"row\" style=\"grid-template-columns:90px minmax(0,1fr) 130px\"><div><b>Mon</b></div><div>Eligibility re-check · T.W. · DMAS portal</div><div style=\"text-align:right\"><a class=\"btn o\" href=\"Eligibility.dc.html\" style=\"min-height:34px;padding:0 12px;font-size:13px\">Run the check</a></div></div>\n        <div class=\"row\" style=\"grid-template-columns:90px minmax(0,1fr) 130px\"><div><b>Nov 3</b></div><div>Critical meeting · D.W., A.M., J.O., L.V.</div><div style=\"text-align:right\"><a class=\"btn o\" href=\"Compliance.dc.html\" style=\"min-height:34px;padding:0 12px;font-size:13px\">Agenda</a></div></div>\n        </section>\n        <section class=\"card\" style=\"flex:1 1 320px;padding:16px 20px\">\n          <h2 style=\"margin:0 0 4px;font-size:17px;font-weight:600\">Waiting on others</h2>\n        <div class=\"row\" style=\"grid-template-columns:90px minmax(0,1fr) 130px\"><div><b>Humana</b></div><div>T.W. · decision</div><div style=\"text-align:right\"><a class=\"btn o\" href=\"Submission.dc.html\" style=\"min-height:34px;padding:0 12px;font-size:13px\">View</a></div></div>\n        <div class=\"row\" style=\"grid-template-columns:90px minmax(0,1fr) 130px\"><div><b>School</b></div><div>REF-118 · schedule and grades</div><div style=\"text-align:right\"><a class=\"btn o\" href=\"Referral.dc.html\" style=\"min-height:34px;padding:0 12px;font-size:13px\">Referral</a></div></div>\n        <div class=\"row\" style=\"grid-template-columns:90px minmax(0,1fr) 130px\"><div><b>Guardian</b></div><div>T.W. · school release · parent portal</div><div style=\"text-align:right\"><a class=\"btn o\" href=\"ParentPortal.dc.html\" style=\"min-height:34px;padding:0 12px;font-size:13px\">View</a></div></div>\n        <div class=\"row\" style=\"grid-template-columns:90px minmax(0,1fr) 130px\"><div><b>Sentara</b></div><div>T.N. · peer-to-peer Dec 9</div><div style=\"text-align:right\"><a class=\"btn o\" href=\"PeerBrief.dc.html\" style=\"min-height:34px;padding:0 12px;font-size:13px\">Call notes</a></div></div>\n        </section>\n      </div>\n    </div>\n  </main>\n</div>\n",note:"HOW THE DATA GETS IN · Do next\n\nCaptured: nothing new. One list of what is due, built from the referrals, requests, clocks and reminders already in Psyflo.\n\nFlows: each line opens the screen where the work happens; anything that is a Lauris form opens in Lauris.",make:(function(){

{id:"school-portal",file:"SchoolPortal.dc.html",title:"3 · School portal · Oct 13",w:1440,fixed:false,css:"\nbody{margin:0;background:#F8F6F2;color:#151B24;font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.45}\na{color:#217A78}a:hover{color:#15605E}\n*{box-sizing:border-box}\nlabel{display:block;font-size:13px;font-weight:600;margin-bottom:5px}\n.in{width:100%;border:1px solid #C9CDD3;border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;background:#fff;min-height:44px;color:#151B24}\ntextarea.in{min-height:96px;resize:vertical}\n.g2{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:14px}\n.g3{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:14px}\n.g4{display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:14px}\n.sec{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#525B66;font-weight:700;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid #151B24}\n.ck{display:flex;align-items:center;gap:10px;min-height:36px;font-size:15px}\n.ck input{width:20px;height:20px;margin:0;accent-color:#217A78}\n.rad{display:flex;gap:12px;align-items:center;min-height:44px;flex-wrap:wrap}\n.rad label{display:flex;align-items:center;gap:8px;font-weight:500;margin:0}\n.rad input{width:20px;height:20px;margin:0;accent-color:#217A78}\n.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:8px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;border:1px solid transparent;text-decoration:none}\n.btn.p{background:#217A78;color:#fff}.btn.p:hover{background:#15605E;color:#fff}\n.btn.o{background:#fff;color:#151B24;border-color:#D9D4CC}\n.note{font-size:13px;color:#525B66}\n.card{background:#fff;border:1px solid #E6E1D9;border-radius:12px}\n.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}\n.chip.r{background:#FBE9E4;color:#8A2E1C}.chip.y{background:#FCEFD0;color:#6F4A05}.chip.g{background:#DDF1EF;color:#15605E}.chip.n{background:#EEEBE5;color:#3E4652}\n.bar{height:6px;border-radius:3px;background:#EFEBE4;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#217A78}\n.door{display:flex;flex-direction:column;gap:6px;padding:18px 20px;border:1.5px solid #E6E1D9;border-radius:14px;background:#fff;text-decoration:none;color:#151B24;min-height:120px}\n.door:hover{border-color:#217A78;color:#151B24}\n.door b{font-size:17px}\n.door span{font-size:14px;color:#525B66}\n.row{display:grid;gap:12px;padding:10px 0;border-top:1px solid #EFEBE4;font-size:14px;align-items:center}\n.row>div{min-width:0}\n.th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600}\n",tpl:"\n\n\n<div style=\"min-height:1140px;width:100%;display:flex;flex-direction:column;background:#F8F6F2\">\n  <header style=\"background:#151B24;color:#fff;padding:14px 40px;display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n    <div style=\"font-weight:700;font-size:18px\">Harvest Outreach Center</div>\n    <div style=\"font-size:13px;color:#C9D1D6\">School portal · Lynchburg City · Middle School 2</div>\n    <div style=\"margin-left:auto;font-size:13px;color:#C9D1D6\">Signed in: R. Bell, school counselor · <a href=\"#out\" style=\"color:#5FC0BE\">Sign out</a></div>\n  </header>\n\n  <div style=\"max-width:1120px;width:100%;margin:0 auto;padding:30px 40px 40px\">\n    <h1 style=\"margin:0;font-size:28px;font-weight:600;letter-spacing:-.01em\">Good morning, Ms. Bell</h1>\n\n    <div style=\"display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:14px;margin-top:22px\">\n      <a class=\"door\" href=\"ReferralForm.dc.html\"><b>Refer a student</b><span>Guardian consent first. About 15 minutes.</span><span class=\"chip g\" style=\"align-self:flex-start;margin-top:auto\">3 referred this year</span></a>\n      <a class=\"door\" href=\"#today\" style=\"border-color:#217A78;background:#F2F9F8\"><b>Share what happened today</b><span>A sentence or two about a student's day.</span><span class=\"chip y\" style=\"align-self:flex-start;margin-top:auto\">2 students had a hard day</span></a>\n      <a class=\"door\" href=\"#checkin\"><b>Teacher check-in</b><span>Four questions, every two weeks.</span><span class=\"chip n\" style=\"align-self:flex-start;margin-top:auto\">4 due this week</span></a>\n      <a class=\"door\" href=\"#progress\"><b>How students are doing</b><span>Referrals, check-ins, goals.</span><span class=\"chip n\" style=\"align-self:flex-start;margin-top:auto\">6 students in TDT here</span></a>\n    </div>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;margin-top:24px\">\n      <section class=\"card\" style=\"flex:3 1 560px;min-width:0;padding:18px 22px\" id=\"today\">\n        <h2 style=\"margin:0 0 2px;font-size:17px;font-weight:600\">Share what happened today</h2>\n        <div style=\"font-size:13px;color:#525B66;margin-bottom:12px\">What you saw, where, when.</div>\n        <div class=\"g2\">\n          <div><label for=\"st\">Student</label><select class=\"in\" id=\"st\"><option>T.W. · 7th grade</option><option>K.T. · 6th</option><option>J.O. · 8th</option></select></div>\n          <div><label for=\"wh\">Where and when</label><input class=\"in\" id=\"wh\" value=\"Cafeteria, 11:50 am\"></div>\n        </div>\n        <div style=\"margin-top:12px\"><label for=\"what\">What happened</label><textarea class=\"in\" id=\"what\">Argument with a peer over a seat; shouted, did not hit. Walked to the TDT room with Ms. Hale on his own when asked. Back in class for 5th period.</textarea></div>\n        <div style=\"display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap\">\n          <label class=\"ck\" style=\"margin:0\"><input type=\"checkbox\" checked=\"\"> Office referral written</label>\n          <label class=\"ck\" style=\"margin:0\"><input type=\"checkbox\"> Parent was called</label>\n          <a class=\"btn p\" href=\"#sent\" style=\"margin-left:auto\">Send to Harvest</a>\n        </div>\n        \n      </section>\n\n      <section class=\"card\" style=\"flex:2 1 360px;min-width:0;padding:18px 22px\" id=\"progress\">\n        <h2 style=\"margin:0 0 2px;font-size:17px;font-weight:600\">Students in TDT at MS-2</h2>\n        \n        <div class=\"row\" style=\"grid-template-columns:70px minmax(0,1fr)\"><div><b>T.W.</b></div><div>Office referrals 6 → 2 (counselor) · stayed in class: often, 3 of 4 check-ins<div class=\"bar\"><i style=\"width:70%\"></i></div><span style=\"font-size:12px;color:#525B66\">Goal: staying in class when frustrated</span></div></div>\n        <div class=\"row\" style=\"grid-template-columns:70px minmax(0,1fr)\"><div><b>K.T.</b></div><div>Office referrals 1 → 1 (counselor) · stayed in class: always, 4 of 4 check-ins<div class=\"bar\"><i style=\"width:90%\"></i></div><span style=\"font-size:12px;color:#525B66\">Goal: asking for help before shutting down</span></div></div>\n        <div class=\"row\" style=\"grid-template-columns:70px minmax(0,1fr)\"><div><b>J.O.</b></div><div>Office referrals 4 → 3 (counselor) · stayed in class: rarely, 2 of 4 check-ins<div class=\"bar\"><i style=\"width:45%\"></i></div><span style=\"font-size:12px;color:#525B66\">Goal: morning arrival routine · <span class=\"chip y\">attendance flag</span></span></div></div>\n        \n      </section>\n    </div>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;margin-top:20px\">\n      <section class=\"card\" style=\"flex:1 1 420px;min-width:0;padding:18px 22px\" id=\"checkin\">\n        <h2 style=\"margin:0 0 2px;font-size:17px;font-weight:600\">Teacher check-in · T.W. · week of Oct 27</h2>\n        \n        <div class=\"row\" style=\"grid-template-columns:minmax(0,1fr) 250px;border-top:0;padding-top:0\"><div>Stayed in class when frustrated</div><div class=\"rad\"><label><input type=\"radio\" name=\"a\">Rarely</label><label><input type=\"radio\" name=\"a\" checked=\"\">Often</label><label><input type=\"radio\" name=\"a\">Always</label></div></div>\n        <div class=\"row\" style=\"grid-template-columns:minmax(0,1fr) 250px\"><div>Got along with classmates</div><div class=\"rad\"><label><input type=\"radio\" name=\"b\">Rarely</label><label><input type=\"radio\" name=\"b\">Often</label><label><input type=\"radio\" name=\"b\" checked=\"\">Always</label></div></div>\n        <div class=\"row\" style=\"grid-template-columns:minmax(0,1fr) 250px\"><div>Finished work with the class</div><div class=\"rad\"><label><input type=\"radio\" name=\"c\" checked=\"\">Rarely</label><label><input type=\"radio\" name=\"c\">Often</label><label><input type=\"radio\" name=\"c\">Always</label></div></div>\n        <div class=\"row\" style=\"grid-template-columns:minmax(0,1fr) 250px\"><div>Used a coping skill you noticed</div><div class=\"rad\"><label><input type=\"radio\" name=\"d\">Rarely</label><label><input type=\"radio\" name=\"d\" checked=\"\">Often</label><label><input type=\"radio\" name=\"d\">Always</label></div></div>\n        <div style=\"margin-top:12px\"><a class=\"btn o\" href=\"#saved\">Save check-in</a></div>\n      </section>\n      \n    </div>\n  </div>\n</div>\n",note:"HOW THE DATA GETS IN · portal\n\nCaptured: the referral (guardian consent attested first), a sentence or two from a teacher or admin about a student's day, a four-question teacher check-in every two weeks, attendance and office-referral counts.\n\nFlows: everything goes to Psyflo tagged with the school and the staffer; the counselor sees \"what happened today\" before writing the daily note; check-ins sit beside the parent's and child's answers.\n\nPopulates: the daily note's context (11), the continued-stay packet's school section (12), the student progress view the school sees (goals and functioning only), the school-division report (21). Schools never see clinical notes, diagnoses or anything from home.\n\nEngineering: one login per school role (counselor, teacher, administrator) with the same role model as the app; attachments stored in Psyflo and copied to Lauris Documents at intake; year-end division report assembled from this data.",make:(function(){ 
return class Component extends DCLogic {
  renderVals() { return {}; }
}
 })()},

251 605 237.5 592.5Q224 580 224 549V0ZM20 391V504H333V391Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2080.0,780.0) scale(1,-1)\"><path d=\"M66 0V720H201V0Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2322.0,780.0) scale(1,-1)\"><path d=\"M304 -12Q232 -12 174.5 21.5Q117 55 83.5 114.5Q50 174 50 251Q50 330 83.5 389.5Q117 449 175.0 482.5Q233 516 305 516Q378 516 435.5 482.5Q493 449 526.5 389.5Q560 330 560 252Q560 174 526.5 114.5Q493 55 435.0 21.5Q377 -12 304 -12ZM304 105Q338 105 364.5 121.0Q391 137 406.5 170.0Q422 203 422 252Q422 301 406.5 333.5Q391 366 364.5 382.5Q338 399 305 399Q273 399 246.0 382.5Q219 366 203.5 333.5Q188 301 188 252Q188 203 203.5 170.0Q219 137 245.5 121.0Q272 105 304 105Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2922.0,780.0) scale(1,-1)\"><path d=\"M127 -5Q89 -5 66.0 17.5Q43 40 43 73Q43 106 66.0 128.5Q89 151 127 151Q163 151 186.0 128.5Q209 106 209 73Q209 40 186.0 17.5Q163 -5 127 -5Z\" fill=\"#F0B44C\"></path></g></svg></div>\n  </header>\n\n  <form style=\"width:100%;max-width:860px;background:#fff;border:1px solid #E6E1D9;border-radius:14px;padding:32px 36px 36px\" action=\"Referral.dc.html\">\n    <h1 style=\"margin:0;font-size:24px;font-weight:600\">Referral form</h1>\n    <div class=\"note\" style=\"margin-top:4px\">About 10 minutes. Attach the behaviour report, attendance log, and schedule and grades.</div>\n\n    <div style=\"margin-top:16px;border:1.5px solid #217A78;border-radius:10px;padding:12px 14px;background:#F2F9F8\">\n      <label class=\"ck\" style=\"margin:0;align-items:flex-start\"><input type=\"checkbox\" checked=\"\"> <span><b>I have spoken with the parent or guardian and they agree to this referral.</b></span></label>\n    </div>\n\n    <div class=\"sec\">Student</div>\n    <div class=\"g3\">\n      <div><label for=\"fn\">First name</label><input class=\"in\" id=\"fn\" type=\"text\"></div>\n      <div><label for=\"mn\">Middle name</label><input class=\"in\" id=\"mn\" type=\"text\"></div>\n      <div><label for=\"ln\">Last name</label><input class=\"in\" id=\"ln\" type=\"text\"></div>\n    </div>\n    <div class=\"g4\" style=\"margin-top:14px\">\n      <div><label for=\"dob\">Date of birth</label><input class=\"in\" id=\"dob\" type=\"date\"></div>\n      <div><label for=\"age\">Age</label><input class=\"in\" id=\"age\" type=\"number\"></div>\n      <div><label for=\"gr\">Grade</label><input class=\"in\" id=\"gr\" type=\"text\"></div>\n      <div><label for=\"sch\">School</label><select class=\"in\" id=\"sch\"><option>Lynchburg City · MS-2</option><option>Lynchburg City · ES-3</option><option>Campbell County · ES-1</option><option>Campbell County · MS-1</option><option>Campbell County · HS-1</option></select></div>\n    </div>\n\n    <div class=\"sec\">Guardian</div>\n    <div class=\"g2\">\n      <div><label for=\"gn\">Name of guardian</label><input class=\"in\" id=\"gn\" type=\"text\"></div>\n      <div><label for=\"gp\">Phone</label><input class=\"in\" id=\"gp\" type=\"tel\"></div>\n    </div>\n    <div style=\"margin-top:14px\"><label for=\"ad\">Address</label><input class=\"in\" id=\"ad\" type=\"text\"></div>\n    <div class=\"g3\" style=\"margin-top:14px\">\n      <div><label>Does this student have Medicaid?</label><div class=\"rad\"><label><input type=\"radio\" name=\"med\" checked=\"\"> Yes</label><label><input type=\"radio\" name=\"med\"> No</label><label><input type=\"radio\" name=\"med\"> Not sure</label></div></div>\n      <div><label>IEP or 504 plan?</label><div class=\"rad\"><label><input type=\"radio\" name=\"iep\" checked=\"\"> Yes</label><label><input type=\"radio\" name=\"iep\"> No</label></div><div class=\"note\">If yes, attach a copy below.</div></div>\n      <div><label>Has the guardian been told a referral is being made?</label><div class=\"rad\"><label><input type=\"radio\" name=\"inf\" checked=\"\"> Yes</label><label><input type=\"radio\" name=\"inf\"> No</label></div></div>\n    </div>\n\n    <div class=\"sec\">Attachments</div>\n    <div class=\"g3\">\n      <div class=\"ck\"><input type=\"checkbox\" id=\"a1\" checked=\"\"><label for=\"a1\" style=\"margin:0;font-weight:500\">Behaviour report</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"a2\" checked=\"\"><label for=\"a2\" style=\"margin:0;font-weight:500\">Attendance log</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"a3\"><label for=\"a3\" style=\"margin:0;font-weight:500\">Schedule and grades</label></div>\n    </div>\n    <div style=\"margin-top:10px;border:1.5px dashed #C9CDD3;border-radius:10px;padding:16px;text-align:center;color:#525B66;font-size:14px\">Drop files here or <a href=\"#up\">choose files</a> · PDF, image or document · 2 attached</div>\n\n    <div class=\"sec\">Concerns in the last 30 days</div>\n    \n    <div class=\"g3\">\n      <div class=\"ck\"><input type=\"checkbox\" id=\"c1\" checked=\"\"><label for=\"c1\" style=\"margin:0;font-weight:500\">Physical aggression</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"c2\"><label for=\"c2\" style=\"margin:0;font-weight:500\">Skips class / truancy</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"c3\"><label for=\"c3\" style=\"margin:0;font-weight:500\">Depression</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"c4\" checked=\"\"><label for=\"c4\" style=\"margin:0;font-weight:500\">Verbal aggression</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"c5\"><label for=\"c5\" style=\"margin:0;font-weight:500\">Outbursts / tantrums</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"c6\"><label for=\"c6\" style=\"margin:0;font-weight:500\">Substance use</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"c7\"><label for=\"c7\" style=\"margin:0;font-weight:500\">Suicidal / homicidal ideation</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"c8\" checked=\"\"><label for=\"c8\" style=\"margin:0;font-weight:500\">Defiant / argumentative</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"c9\"><label for=\"c9\" style=\"margin:0;font-weight:500\">Past or recent trauma</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"c10\"><label for=\"c10\" style=\"margin:0;font-weight:500\">Threatening / bullying</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"c11\" checked=\"\"><label for=\"c11\" style=\"margin:0;font-weight:500\">Eloping</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"c12\"><label for=\"c12\" style=\"margin:0;font-weight:500\">Grief and loss</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"c13\" checked=\"\"><label for=\"c13\" style=\"margin:0;font-weight:500\">Inattention</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"c14\"><label for=\"c14\" style=\"margin:0;font-weight:500\">Withdrawal / avoidance</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"c15\"><label for=\"c15\" style=\"margin:0;font-weight:500\">Anxiety and/or panic attacks</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"c16\"><label for=\"c16\" style=\"margin:0;font-weight:500\">Hyperactivity and impulsivity</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"c17\"><label for=\"c17\" style=\"margin:0;font-weight:500\">Intrusive thoughts</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"c18\"><label for=\"c18\" style=\"margin:0;font-weight:500\">Self-harm</label></div>\n    </div>\n    <div style=\"margin-top:14px\"><label for=\"oth\">Other behavioural or mental-health concerns not listed above</label><textarea class=\"in\" id=\"oth\"></textarea></div>\n\n    <div class=\"sec\">Interventions already tried</div>\n    <div><label for=\"int\">Documented or undocumented interventions so far — school interventions, guidance support, community supports, mental-health supports, risk assessments, referral for a higher level of care</label><textarea class=\"in\" id=\"int\">Behaviour interventionist twice a week since September, check-in/check-out, IEP accommodations. Two office referrals this month. Family was given information about outpatient counseling last year.</textarea></div>\n    \n\n    <div class=\"sec\">Referral for</div>\n    <div class=\"g3\">\n      <div class=\"ck\"><input type=\"checkbox\" id=\"r1\" checked=\"\"><label for=\"r1\" style=\"margin:0;font-weight:500\">TDT services</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"r2\"><label for=\"r2\" style=\"margin:0;font-weight:500\">Outpatient counseling</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"r3\"><label for=\"r3\" style=\"margin:0;font-weight:500\">SEBS program</label></div>\n      <div class=\"ck\"><input type=\"checkbox\" id=\"r4\"><label for=\"r4\" style=\"margin:0;font-weight:500\">Grant-funded support (no Medicaid needed)</label></div>\n    </div>\n\n    <div class=\"sec\">Referred by</div>\n    <div class=\"g2\">\n      <div><label for=\"rn\">Your name</label><input class=\"in\" id=\"rn\" type=\"text\"></div>\n      <div><label for=\"ra\">Role / agency</label><input class=\"in\" id=\"ra\" type=\"text\" value=\"School counselor\"></div>\n      <div><label for=\"rc\">Contact (email or phone)</label><input class=\"in\" id=\"rc\" type=\"text\"></div>\n      <div><label for=\"rd\">Date of referral</label><input class=\"in\" id=\"rd\" type=\"date\" value=\"2026-10-13\"></div>\n    </div>\n\n    <div style=\"display:flex;gap:10px;align-items:center;margin-top:28px;flex-wrap:wrap\">\n      <a class=\"btn p\" href=\"ReferralSent.dc.html\">Submit referral</a>\n      <button class=\"btn o\" type=\"button\">Save and finish later</button>\n      \n    </div>\n  </form>\n</div>\n",note:"HOW THE DATA GETS IN · form\n\nCaptured: the school counselor fills this web form (same fields as Harvest's paper form) and attaches the behaviour report, attendance log, schedule and grades.\n\nFlows: straight to Psyflo, stored under Harvest's account. Nothing goes to Lauris yet.\n\nPopulates: the referral review (2), and later the screening form (5), the intake (6) and the initial request (8) — every field here is reused downstream.\n\nEngineering: Psyflo-hosted form with file upload; covered by the BAA; no EHR involvement.",make:(function(){ 
return class Component extends DCLogic {
  renderVals() { return {}; }
}
 })()},

r:#6F4A05}.chip.g{background:#DDF1EF;color:#15605E}.chip.n{background:#EEEBE5;color:#3E4652}\n.bar{height:6px;border-radius:3px;background:#EFEBE4;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#217A78}\n.door{display:flex;flex-direction:column;gap:6px;padding:18px 20px;border:1.5px solid #E6E1D9;border-radius:14px;background:#fff;text-decoration:none;color:#151B24;min-height:120px}\n.door:hover{border-color:#217A78;color:#151B24}\n.door b{font-size:17px}\n.door span{font-size:14px;color:#525B66}\n.row{display:grid;gap:12px;padding:10px 0;border-top:1px solid #EFEBE4;font-size:14px;align-items:center}\n.row>div{min-width:0}\n.th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600}\n",tpl:"\n\n\n<div style=\"min-height:700px;width:100%;display:flex;flex-direction:column;background:#F8F6F2\">\n  <header style=\"background:#151B24;color:#fff;padding:14px 40px;display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n    <div style=\"font-weight:700;font-size:18px\">Harvest Outreach Center</div>\n    <div style=\"font-size:13px;color:#C9D1D6\">School portal · Middle School 2</div>\n    <div style=\"margin-left:auto;font-size:13px;color:#C9D1D6\">R. Bell, school counselor · <a href=\"#out\" style=\"color:#5FC0BE\">Sign out</a></div>\n  </header>\n  <div style=\"max-width:760px;width:100%;margin:0 auto;padding:60px 40px 40px;text-align:center\">\n    <div style=\"width:64px;height:64px;border-radius:50%;background:#DDF1EF;display:inline-flex;align-items:center;justify-content:center\"><svg aria-hidden=\"true\" width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#15605E\" stroke-width=\"2.5\"><path d=\"M5 12l5 5L20 7\"></path></svg></div>\n    <h1 style=\"margin:16px 0 0;font-size:28px;font-weight:600;letter-spacing:-.01em\">Referral sent · T.W.</h1>\n    <div style=\"color:#525B66;margin-top:6px;font-size:16px\">REF-118 · Oct 13, 2:18 pm</div>\n    <div class=\"card\" style=\"text-align:left;padding:18px 22px;margin-top:26px\">\n      <div class=\"row\" style=\"grid-template-columns:140px minmax(0,1fr);border-top:0;padding-top:0\"><div><b>Next</b></div><div>Harvest will contact the guardian and tell you when the screening is booked.</div></div>\n      <div class=\"row\" style=\"grid-template-columns:140px minmax(0,1fr)\"><div><b>Still needed</b></div><div>Schedule and grades · <a href=\"#up\">attach now</a></div></div>\n      <div class=\"row\" style=\"grid-template-columns:140px minmax(0,1fr)\"><div><b>You'll hear</b></div><div>When the screening is scheduled, and when T.W. starts.</div></div>\n    </div>\n    <div style=\"display:flex;gap:10px;justify-content:center;margin-top:22px\"><a class=\"btn p\" href=\"SchoolPortal.dc.html\">Back to the portal</a><a class=\"btn o\" href=\"ReferralForm.dc.html\">Refer another student</a></div>\n  </div>\n</div>\n",note:"HOW THE DATA GETS IN · Referral sent\n\nCaptured: nothing new. The confirmation shows what the school sent and what happens next.\n\nFlows: the referral appears in Referral review; the school sees its status in the School portal without a Harvest login.",make:(function(){ 
return class Component extends DCLogic {

te(1105.0,780.0) scale(1,-1)\"><path d=\"M130 -220 252 56H222L20 504H167L311 179L441 504H584L273 -220Z\" fill=\"#FFFFFF\"></path></g><g transform=\"translate(1734.0,780.0) scale(1,-1)\"><path d=\"M89 0V549Q89 612 110.0 649.0Q131 686 170.5 703.0Q210 720 263 720H325V605H283Q251 605 237.5 592.5Q224 580 224 549V0ZM20 391V504H333V391Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2080.0,780.0) scale(1,-1)\"><path d=\"M66 0V720H201V0Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2322.0,780.0) scale(1,-1)\"><path d=\"M304 -12Q232 -12 174.5 21.5Q117 55 83.5 114.5Q50 174 50 251Q50 330 83.5 389.5Q117 449 175.0 482.5Q233 516 305 516Q378 516 435.5 482.5Q493 449 526.5 389.5Q560 330 560 252Q560 174 526.5 114.5Q493 55 435.0 21.5Q377 -12 304 -12ZM304 105Q338 105 364.5 121.0Q391 137 406.5 170.0Q422 203 422 252Q422 301 406.5 333.5Q391 366 364.5 382.5Q338 399 305 399Q273 399 246.0 382.5Q219 366 203.5 333.5Q188 301 188 252Q188 203 203.5 170.0Q219 137 245.5 121.0Q272 105 304 105Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2922.0,780.0) scale(1,-1)\"><path d=\"M127 -5Q89 -5 66.0 17.5Q43 40 43 73Q43 106 66.0 128.5Q89 151 127 151Q163 151 186.0 128.5Q209 106 209 73Q209 40 186.0 17.5Q163 -5 127 -5Z\" fill=\"#F0B44C\"></path></g></svg>\n      <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8E99A6;margin-top:4px\">Harvest Outreach Center · TDT</div>\n    </div>\n    <nav style=\"display:flex;flex-direction:column;gap:2px;margin-top:22px\" aria-label=\"Main\">\n      <a class=\"nav\" href=\"DoNext.dc.html\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M3 11l9-8 9 8v10H3z\"></path><path d=\"M9 21v-6h6v6\"></path></svg>Do next<span class=\"n\">5</span></a>\n      <a class=\"nav on\" href=\"Referrals.dc.html\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M4 4h12l4 4v12H4z M16 4v4h4 M8 13h8M8 17h5\"></path></svg>Referrals<span class=\"n\">3</span></a>\n      <a class=\"nav\" href=\"Authorizations.dc.html\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M4 6h16M4 12h16M4 18h10\"></path></svg>Authorizations<span class=\"n\">15</span></a>\n      <a class=\"nav\" href=\"StaffDashboard.dc.html\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"8\" r=\"4\"></circle><path d=\"M4 21a8 8 0 0 1 16 0\"></path></svg>Staff<span class=\"n\">2</span></a>\n      <a class=\"nav\" href=\"Compliance.dc.html\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z\"></path><path d=\"M9 12l2 2 4-4\"></path></svg>Compliance<span class=\"n\">1</span></a>\n      <a class=\"nav\" href=\"Analytics.dc.html\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"></path></svg>Analytics</a>\n      <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8E99A6;padding:18px 12px 6px\">The four doors</div>\n      <a class=\"nav\" href=\"ExtHome.dc.html\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"></rect><path d=\"M3 9h18M7 6.5h.01M10 6.5h.01\"></path></svg>Lauris extension<span class=\"n\">on</span></a>\n      <a class=\"nav\" href=\"MobileApp.dc.html\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"7\" y=\"2\" width=\"10\" height=\"20\" rx=\"2\"></rect><path d=\"M11 18h2\"></path></svg>Mobile app</a>\n      <a class=\"nav\" href=\"ParentPortal.dc.html\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M3 11l9-7 9 7v9H3z\"></path><path d=\"M10 20v-6h4v6\"></path></svg>Parent portal</a>\n      <a class=\"nav\" href=\"SchoolPortal.dc.html\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M2 10l10-5 10 5-10 5z\"></path><path d=\"M6 12v5c3 2 9 2 12 0v-5\"></path></svg>School portal</a>\n    </nav>\n    <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:center;gap:8px;border:1px solid #2A3340;border-radius:8px;padding:8px 10px;font-size:12px;color:#C9D1D6\"><span style=\"width:8px;height:8px;border-radius:50%;background:#F0B44C;display:inline-block\"></span>Demo data · nothing is real</div>\n      <div style=\"display:flex;align-items:center;gap:10px;border-top:1px solid #2A3340;padding-top:14px\">\n        <div style=\"width:36px;height:36px;border-radius:50%;background:#217A78;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px\">JP</div>\n        <div><div style=\"font-weight:600;font-size:13px\">Jordan Perez</div><div style=\"font-size:12px;color:#8E99A6\">LPC · Asst. Clinical Support Supervisor</div></div>\n      </div>\n    </div>\n  </aside>\n\n  <main style=\"flex:999 1 560px;min-width:0;display:flex;flex-direction:column\">\n    <header style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid #E6E1D9;background:#fff\">\n      <a href=\"Referrals.dc.html\" style=\"font-weight:500;text-decoration:none\">← Referrals</a>\n      <span style=\"color:#525B66\">/</span><span style=\"font-weight:600\">REF-118 · new student · Lynchburg City · MS-2</span>\n      <span class=\"chip y\">Needs screening call</span>\n      <div style=\"margin-left:auto;display:flex;gap:8px\"><span class=\"chip n\">Submitted via Psyflo link · Oct 13, 2:18 pm · school counselor</span></div>\n    </header>\n\n    <div style=\"padding:22px 28px 32px;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end\">\n        <div>\n          <h1 style=\"margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em\">Referral REF-118 · T.W., 12 · Lynchburg City MS-2</h1>\n        </div>\n        <div style=\"margin-left:auto;display:flex;gap:8px\"><button class=\"btn o\" onClick=\"{{openGrant}}\">Route to grant program</button><button class=\"btn p\" onClick=\"{{openSched}}\">Schedule screening call</button></div>\n      </div>\n\n      <sc-if value=\"{{showSched}}\" hint-placeholder-val=\"{{false}}\">\n      <section class=\"card\" style=\"padding:18px 20px;border:2px solid #217A78;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:10px\"><h2 style=\"margin:0;font-size:16px;font-weight:600\">Schedule the screening call · T.W.</h2><span style=\"font-size:12px;color:#525B66\">30–45 min · phone · one of the two LPCs</span></div>\n        <div style=\"display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:10px\">\n          <div><div class=\"f\">Who makes the call</div><select class=\"fld\" style=\"width:100%;min-height:40px\" aria-label=\"Clinician\"><option>Jordan Perez, LPC</option><option>Clinical director, LPC</option></select></div>\n          <div><div class=\"f\">Date</div><input class=\"fld\" style=\"width:100%;min-height:40px\" type=\"date\" value=\"2026-10-16\" aria-label=\"Date\"></div>\n          <div><div class=\"f\">Time</div><select class=\"fld\" style=\"width:100%;min-height:40px\" aria-label=\"Time\"><option>2:00 pm (guardian said afternoons)</option><option>10:00 am</option><option>3:30 pm</option></select></div>\n          <div><div class=\"f\">Call</div><div class=\"fld\" style=\"min-height:40px\">Grandmother · (434) 555-0147 <span class=\"chip g\">from family link</span></div></div>\n        </div>\n        <div style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:13px\">\n          <label style=\"display:flex;align-items:center;gap:8px\"><input type=\"checkbox\" checked=\"\" style=\"width:18px;height:18px;accent-color:#217A78\"> Text the guardian a confirmation and a reminder the morning of</label>\n          <label style=\"display:flex;align-items:center;gap:8px\"><input type=\"checkbox\" checked=\"\" style=\"width:18px;height:18px;accent-color:#217A78\"> Ask the counselor for schedule and grades before the call</label>\n        </div>\n        <div style=\"border:1px solid #E6E1D9;border-radius:8px;padding:10px 12px;background:#F8F6F2;font-size:13px\">Saved to Do next and to your Lauris panel · the screening form opens pre-filled</div>\n        <div style=\"display:flex;gap:8px\"><button class=\"btn p\" onClick=\"{{saveSched}}\">Save and text the guardian</button><button class=\"btn o\" onClick=\"{{closeAll}}\">Cancel</button></div>\n      </section>\n      </sc-if>\n\n      <sc-if value=\"{{showGrant}}\" hint-placeholder-val=\"{{false}}\">\n      <section class=\"card\" style=\"padding:18px 20px;border:2px solid #F0B44C;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:10px\"><h2 style=\"margin:0;font-size:16px;font-weight:600\">Route to the grant program instead</h2><span style=\"font-size:12px;color:#525B66\">for students without Medicaid</span></div>\n        <div style=\"font-size:13px\">Grant program · no Medicaid needed · no diagnosis required · funded to Dec 2027</div>\n        <div style=\"display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px\">\n          <div><div class=\"f\">Reason</div><select class=\"fld\" style=\"width:100%;min-height:40px\" aria-label=\"Reason\"><option>No Medicaid</option><option>Medicaid lapsed</option><option>Family declined Medicaid service</option></select></div>\n          <div><div class=\"f\">Who is told, and how</div><div class=\"fld\" style=\"min-height:40px\">Grant program lead — <b>email</b> with a secure link to this referral<br>Site supervisor, MS-2 — <b>email + text</b></div></div>\n          <div><div class=\"f\">What happens to this referral</div><div class=\"fld\" style=\"min-height:40px\">Moves to the <b>Grant program</b> list · no request created · counselor emailed</div></div>\n        </div>\n        <div style=\"display:flex;gap:8px\"><button class=\"btn p\" onClick=\"{{saveGrant}}\">Route and notify</button><button class=\"btn o\" onClick=\"{{closeAll}}\">Cancel</button></div>\n      </section>\n      </sc-if>\n\n      <sc-if value=\"{{showDone}}\" hint-placeholder-val=\"{{false}}\">\n      <div style=\"border:1px solid #BFE0CC;background:#E9F4EE;border-radius:10px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#217A78\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M9 12l2 2 4-4\"></path></svg><div>{{doneText}}</div><a href=\"ExtHome.dc.html\" style=\"margin-left:auto;font-size:12px\">see it in the Lauris panel →</a></div>\n      </sc-if>\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n        <!-- What the school sent -->\n        <section class=\"card\" style=\"flex:2 1 400px;min-width:0;padding:16px 20px\">\n          <h2 style=\"margin:0 0 2px;font-size:15px;font-weight:600\">Referral form</h2>\n          \n          <div style=\"display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px;margin-bottom:10px\">\n            <div><div class=\"f\">Medicaid</div><div class=\"fld\">\"Yes\" per the school · <span class=\"chip y\">ID not provided</span></div></div>\n            <div><div class=\"f\">IEP / 504</div><div class=\"fld\">IEP · copy attached</div></div>\n            <div><div class=\"f\">Guardian informed</div><div class=\"fld\">Yes</div></div>\n          </div>\n          <div class=\"f\">Concerns in the last 30 days</div>\n          <div style=\"margin-bottom:10px\">\n            <span class=\"bx\"><i class=\"on\"></i>Physical aggression</span><span class=\"bx\"><i class=\"on\"></i>Verbal aggression</span><span class=\"bx\"><i class=\"on\"></i>Eloping</span><span class=\"bx\"><i class=\"on\"></i>Inattention</span><span class=\"bx\"><i></i>Withdrawal / avoidance</span><span class=\"bx\"><i></i>Depression</span><span class=\"bx\"><i></i>Suicidal / homicidal ideation</span><span class=\"bx\"><i></i>Self-harm</span><span class=\"bx\"><i class=\"on\"></i>Defiant / argumentative</span>\n          </div>\n          <div class=\"f\">Interventions already tried</div>\n          <div class=\"fld\" style=\"margin-bottom:10px\">\"Behaviour interventionist twice a week since September, check-in/check-out, IEP accommodations. Two office referrals in October. Family was given information about outpatient counseling last year.\"</div>\n          <div class=\"f\">Attachments</div>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><span class=\"chip g\">Behaviour report ✓</span><span class=\"chip g\">Attendance log ✓</span><span class=\"chip r\">Schedule and grades — missing</span></div>\n          <div class=\"f\" style=\"margin-top:12px\">Referral for</div>\n          <div><span class=\"bx\"><i class=\"on\"></i>TDT</span><span class=\"bx\"><i></i>Outpatient counseling</span><span class=\"bx\"><i></i>SEBS</span></div>\n        </section>\n\n        <!-- Criteria read -->\n        <section class=\"card\" style=\"flex:3 1 480px;min-width:0;padding:16px 20px\">\n          <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\"><h2 style=\"margin:0;font-size:15px;font-weight:600\">What the insurance form needs · what we can show</h2><span class=\"chip y\">2 criteria needed · 1 shown</span><span style=\"font-size:12px;color:#525B66\">DMAS TDT initial SRA, Section I</span></div>\n          <div class=\"cr\" style=\"margin-top:6px\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#217A78\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M9 12l2 2 4-4\"></path></svg><div><b>Difficulty establishing or maintaining interpersonal relationships</b>Behaviour report: peer aggression on 6 dated occasions in the last 30 days; 2 office referrals. Attendance log: 1 day ISS (Oct 6). <span style=\"color:#8A2E1C\">Still needs</span> unexcused absences this year and classes taking/passing — both come from the missing schedule and grades.</div></div>\n          <div class=\"cr\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6F4A05\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 8v4M12 16h.01\"></path></svg><div><b>Documented repeated interventions that have not worked</b>Interventionist and CICO are named but without outcomes; \"information about outpatient\" is not a prior service. <div class=\"ask\">Screening call: dates, frequency and outcome for the interventionist; whether outpatient ever started, with whom.</div></div></div>\n          <div class=\"cr\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#525B66\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke-dasharray=\"3 3\"></circle></svg><div><b>Cognitive ability to recognise danger to self or others</b>Not addressed by the referral. Eloping is ticked — <div class=\"ask\">Screening call: where to, how often, how long gone.</div></div></div>\n          <div class=\"cr\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#525B66\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke-dasharray=\"3 3\"></circle></svg><div><b>Level of care (1 of 5)</b>Nothing yet on risk of out-of-home placement, hospitalization or a more restrictive setting. <div class=\"ask\">Screening call: has the school discussed alternative placement?</div></div></div>\n          <div class=\"cr\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#8A2E1C\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M15 9l-6 6M9 9l6 6\"></path></svg><div><b>Internalizing symptoms</b>None ticked. Payers treat \"not observable\" as \"not present\"; the screening call should ask directly about sleep, withdrawal and sadness so the answer is on record either way.</div></div>\n\n          <div style=\"border:1px solid #E6E1D9;border-radius:10px;padding:12px 14px;background:#F8F6F2;margin-top:8px\">\n            <div class=\"f\">Missing before the screening call</div>\n            <div style=\"font-size:13px\">1. Schedule and grades from the school (request sent to the counselor, Oct 14) &nbsp;·&nbsp; 2. Insurance details — from the family link (the eligibility check runs when it is submitted) &nbsp;·&nbsp; 3. Guardian details and consent to contact (family link) &nbsp;·&nbsp; 4. Outcome of the interventionist support — ask the counselor, not the family</div>\n          </div>\n        </section>\n      </div>\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n        <section class=\"card\" style=\"flex:1 1 420px;min-width:0;padding:16px 20px\">\n          <h2 style=\"margin:0 0 2px;font-size:15px;font-weight:600\">Family link</h2>\n          \n          <div class=\"row\" style=\"border-top:0\"><div style=\"flex:1\">Sent by SMS to the guardian · Oct 13, 2:40 pm</div><span class=\"chip g\">opened</span></div>\n          <div class=\"row\"><div style=\"flex:1\">Guardian name, relationship, phone, address, preferred language</div><span class=\"chip g\">done</span></div>\n          <div class=\"row\"><div style=\"flex:1\">Member Medicaid ID · DOB</div><span class=\"chip y\">not yet</span></div>\n          <div class=\"row\"><div style=\"flex:1\">Consent to be contacted by Harvest · best times to call</div><span class=\"chip y\">not yet</span></div>\n          <div class=\"row\"><div style=\"flex:1\">Transportation: can you get to an in-person intake?</div><span class=\"chip y\">not yet</span></div>\n          <div style=\"margin-top:10px;display:flex;gap:8px\"><a class=\"btn o\" href=\"ExtScreening.dc.html\">Fill the rest on the call</a><a class=\"btn o\" href=\"FamilyLink.dc.html\">See what the family sees</a></div>\n        </section>\n        <section class=\"card\" style=\"flex:1 1 420px;min-width:0;padding:16px 20px\">\n          <h2 style=\"margin:0 0 2px;font-size:15px;font-weight:600\">Medicaid eligibility check</h2>\n          \n          <div class=\"row\" style=\"border-top:0\"><div style=\"flex:1\">Medicaid ID</div><span class=\"chip y\">not yet · asked on the family link (step 2)</span></div>\n          <div class=\"row\"><div style=\"flex:1\">Check result</div><span class=\"chip n\">waiting for the family link</span></div>\n          <div class=\"row\"><div style=\"flex:1\">Where the proof is kept</div><span class=\"chip n\">in Psyflo, with date and screenshot — not in Lauris</span></div>\n          <div class=\"row\"><div style=\"flex:1\">If no Medicaid: route to the DOE grant program (no diagnosis required)</div><span class=\"chip n\">n/a</span></div>\n        </section>\n        \n      </div>\n    </div>\n  </main>\n</div>\n",note:"HOW THE DATA GETS IN · review\n\nCaptured: nothing new — the referral is read by Psyflo against the DMAS TDT criteria (2 of 3, 1 of 5).\n\nFlows: referral answers → fixed rules → 'shown / not shown / ask'. The Medicaid eligibility check does not run here: the school form has no insurance details. It runs only after the family submits the link with the insurance step, using a staff login to the insurer or DMAS portal; the dated result and screenshot are stored in Psyflo, not in Lauris, and the check repeats weekly while the student is in service.\n\nPopulates: 'ask now' prompts on the screening panel (5); family-link status (3); home to-do (13). 'Schedule screening call' creates the to-do and the panel item; 'Route to grant program' emails/texts the named people and moves the referral to the Grant program list.\n\nEngineering: rules are fixed logic from the form; the AI model only words the 'ask' prompts. Weekly re-checks after enrollment, proof kept in Psyflo.",make:(function(){ 
return class Component extends DCLogic {
  constructor(p){ super(p); this.state = { dlg: null, done: null }; }
  renderVals() {
    const s = this.state;
    return {
      showSched: s.dlg === 'sched', showGrant: s.dlg === 'grant', showDone: !!s.done,
      doneText: s.done === 'sched' ? 'Screening call saved: Jordan Perez, Fri Oct 16, 2:00 pm. Guardian texted. To-do added to Home and to the Lauris panel.' : 'Routed to the DOE grant program. Emailed the grant program lead (secure link); emailed and texted the MS-2 site supervisor; told the school counselor. Now under Referrals › Grant program.',
      openSched: () => this.setState({dlg:'sched', done:null}), openGrant: () => this.setState({dlg:'grant', done:null}),
      saveSched: () => this.setState({dlg:null, done:'sched'}), saveGrant: () => this.setState({dlg:null, done:'grant'}),
      closeAll: () => this.setState({dlg:null})
    };
  }
}
 })()},
{id:"family-link",file:"FamilyLink.dc.html",title:"8 · Family link (phone) · insurance step · Oct 14",w:390,fixed:true,css:"\nbody{margin:0;background:#F8F6F2;color:#151B24;font-family:'DM Sans',system-ui,sans-serif;font-size:17px;line-height:1.45}\na{color:#217A78}a:hover{color:#15605E}\n*{box-sizing:border-box}\nlabel{display:block;font-size:15px;font-weight:600;margin-bottom:6px}\n.in{width:100%;border:1.5px solid #C9CDD3;border-radius:10px;padding:12px 14px;font:inherit;font-size:17px;background:#fff;min-height:50px;color:#151B24}\n.rad{display:flex;gap:10px}\n.rad label{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;margin:0;border:1.5px solid #C9CDD3;border-radius:10px;min-height:50px;background:#fff;font-size:16px}\n.rad label.on{border-color:#217A78;background:#DDF1EF;color:#15605E;font-weight:600}\n.rad input{width:18px;height:18px;margin:0;accent-color:#217A78}\n.btn{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:12px;font:inherit;font-weight:600;font-size:17px;border:0;width:100%;text-decoration:none}\n.btn.p{background:#217A78;color:#fff}\n",tpl:"\n\n\n<div style=\"width:390px;height:844px;background:#F8F6F2;display:flex;flex-direction:column;overflow:hidden\">\n  <div style=\"background:#151B24;color:#fff;padding:18px 20px 14px\">\n    <div style=\"font-weight:700;font-size:17px\">Harvest Outreach Center</div>\n    <div style=\"font-size:13px;color:#C9D1D6;margin-top:2px\">A few details before we call you</div>\n    <div style=\"display:flex;gap:4px;margin-top:12px\"><span style=\"flex:1;height:4px;border-radius:2px;background:#5FC0BE\"></span><span style=\"flex:1;height:4px;border-radius:2px;background:#5FC0BE\"></span><span style=\"flex:1;height:4px;border-radius:2px;background:#3C4756\"></span><span style=\"flex:1;height:4px;border-radius:2px;background:#3C4756\"></span><span style=\"flex:1;height:4px;border-radius:2px;background:#3C4756\"></span></div>\n    <div style=\"font-size:12px;color:#8E99A6;margin-top:6px\">Step 2 of 5 · insurance details · about 2 minutes left</div>\n  </div>\n\n  <div style=\"flex:1;padding:20px 20px 0;display:flex;flex-direction:column;gap:18px;overflow:hidden\">\n    <div style=\"font-size:15px;color:#525B66\">Your child's insurance, so we can check it before we call.</div>\n\n    <div>\n      <label for=\"plan\">Your child's insurance</label>\n      <select class=\"in\" id=\"plan\"><option>Medicaid (Cardinal Care)</option><option>Medicaid through a health plan (Anthem, Aetna, Humana, Sentara, UnitedHealthcare)</option><option>Other insurance</option><option>No insurance</option><option>Not sure</option></select>\n    </div>\n\n    <div>\n      <label for=\"mid\">Medicaid ID (on the card)</label>\n      <input class=\"in\" id=\"mid\" type=\"text\" value=\"0912 456 789 01\">\n      <div style=\"font-size:13px;color:#525B66;margin-top:6px\">Or take a photo of the card. <a href=\"#photo\">Use the camera</a></div>\n    </div>\n\n    <div>\n      <label for=\"dob\">Child's date of birth</label>\n      <input class=\"in\" id=\"dob\" type=\"text\" value=\"03 / 14 / 2014\">\n    </div>\n\n    \n  </div>\n\n  <div style=\"padding:14px 20px 22px;display:flex;flex-direction:column;gap:10px;background:#F8F6F2;border-top:1px solid #E6E1D9\">\n    <a class=\"btn p\" href=\"Eligibility.dc.html\">Next</a>\n    <div style=\"font-size:12px;color:#525B66;text-align:center\">Secure · only Harvest Outreach Center sees this · <a href=\"#help\">Call us instead</a></div>\n  </div>\n</div>\n",note:"HOW THE DATA GETS IN · link\n\nCaptured: the guardian types phone, consent, Medicaid card number, DOB, best time, transport, language on their phone (text-message link). Which questions are asked is set on 3b.\n\nFlows: to Psyflo only. Step 2 collects the insurance details (plan, Medicaid ID, date of birth). The eligibility check runs only when the family submits that step; nothing is checked before, and the screening call does not ask for the ID.\n\nPopulates: the guardian boxes on the Lauris screening form (5) and the intake header (6) — typed in by the extension when the screener opens those forms (Phase 2), or shown in the panel for staff to type (Phase 1).\n\nEngineering: SMS through a HIPAA-eligible provider; link expires in 7 days; optional — the screener can ask the same questions on the call.",make:(function(){ 
return class Component extends DCLogic {
  renderVals() { return {}; }
}
 })()},

rder:0;background:transparent;padding:0 14px;min-height:40px;font:inherit;font-weight:500;color:#151B24;cursor:pointer}\n.seg button.on{background:#151B24;color:#fff}\n.th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600}\n.tr{display:grid;grid-template-columns:minmax(0,1fr) 90px 110px 140px 110px 120px;gap:12px;padding:10px 0;border-top:1px solid #EFEBE4;font-size:13px;align-items:center}\n.tr>div{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.mo{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}\n.mo .bars{display:flex;align-items:flex-end;gap:3px;height:140px}\n.mo .bars i{display:block;width:22px;border-radius:3px 3px 0 0}\n.mo small{font-size:11px;color:#525B66}\n.g2{display:grid;gap:12px}\n.btn.s{min-height:34px;padding:0 12px;font-size:13px}\n.th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600}\n.row{display:grid;gap:12px;padding:10px 0;border-top:1px solid #EFEBE4;font-size:13px;align-items:center}\n.row>div{min-width:0}\n.bar{height:6px;border-radius:3px;background:#EFEBE4;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#217A78}\n.tog{border:1px solid #D9D4CC;background:#fff;border-radius:8px;padding:0 12px;min-height:40px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:#151B24}\n.tog.on{background:#151B24;color:#fff;border-color:#151B24}\n.ck{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:8px 0;border-top:1px solid #EFEBE4}\n.ck input{width:18px;height:18px;margin-top:1px;accent-color:#217A78}\n",tpl:"\n\n\n<div style=\"display:flex;flex-wrap:wrap;min-height:760px;width:100%\">\n  <aside style=\"flex:0 0 240px;background:#151B24;color:#fff;display:flex;flex-direction:column;padding:22px 16px 18px\">\n    <div style=\"padding:0 8px 6px\">\n      <svg role=\"img\" aria-label=\"psyflo\" viewBox=\"0 0 3191 1060\" width=\"104\" height=\"35\"><g transform=\"t     <div class=\"row\"><div><b>Best phone number</b></div><div><span class=\"sw\"><i></i>On</span></div><div><span class=\"sw\"><i></i>Yes</span></div><div>Screening · CNA header</div></div>\n          <div class=\"row\"><div><b>Child's insurance and Medicaid ID</b><div style=\"color:#525B66\">Runs the eligibility check</div></div><div><span class=\"sw\"><i></i>On</span></div><div><span class=\"sw\"><i></i>Yes</span></div><div>Eligibility check · screening</div></div>\n          <div class=\"row\"><div><b>Child's date of birth</b></div><div><span class=\"sw\"><i></i>On</span></div><div><span class=\"sw off\"><i></i>No</span></div><div>Eligibility check</div></div>\n          <div class=\"row\"><div><b>Consent to be called about the child</b></div><div><span class=\"sw\"><i></i>On</span></div><div><span class=\"sw\"><i></i>Yes</span></div><div>Psyflo only</div></div>\n          <div class=\"row\"><div><b>Best time to call</b></div><div><span class=\"sw\"><i></i>On</span></div><div><span class=\"sw off\"><i></i>No</span></div><div>Psyflo only</div></div>\n          <div class=\"row\"><div><b>Can you get to an in-person intake?</b><div style=\"color:#525B66\">Flags families who need transport</div></div><div><span class=\"sw\"><i></i>On</span></div><div><span class=\"sw off\"><i></i>No</span></div><div>Psyflo only · screening note</div></div>\n          <div class=\"row\"><div><b>Preferred language</b></div><div><span class=\"sw\"><i></i>On</span></div><div><span class=\"sw off\"><i></i>No</span></div><div>Screening · CNA header</div></div>\n          <div class=\"row\"><div><b>Home address</b></div><div><span class=\"sw off\"><i></i>Off</span></div><div>—</div><div>Screening (if on)</div></div>\n          <div class=\"row\"><div><b>Who else lives in the home</b></div><div><span class=\"sw off\"><i></i>Off</span></div><div>—</div><div>CNA (if on)</div></div>\n          <div class=\"row\"><div><b>Any question about behaviour, diagnosis or history</b></div><div><span class=\"chip n\">not allowed</span></div><div>—</div><div>Those stay on the call</div></div>\n          \n        </section>\n\n        <div style=\"flex:2 1 340px;min-width:0;display:flex;flex-direction:column;gap:20px\">\n          \n          <section class=\"card\" style=\"padding:16px 20px\">\n            <h2 style=\"margin:0 0 6px;font-size:15px;font-weight:600\">Message text</h2>\n            <div class=\"fld\" style=\"font-size:13px\">Hi, this is Harvest Outreach Center. [School] asked us to reach out about support for your child. Could you answer a few quick questions so we can call you? [link] · Reply STOP to opt out.</div>\n            \n          </section>\n          \n        </div>\n      </div>\n    </div>\n  </main>\n</div>\n",note:"HOW THE DATA GETS IN · settings\n\nCaptured: Harvest's choices about which questions the link asks and which are required.\n\nFlows: settings → the link each guardian receives.\n\nPopulates: the family link (3). Answers reach Lauris only by the extension typing them into the screening/intake form when a staff member opens it (Phase 2), or by staff typing from the panel (Phase 1).\n\nEngineering: no clinical fields allowed. Alternative to explore: Lauris's own 'Consumer Access' family login, so families enter details in Lauris directly and Psyflo reads them there.",make:(function(){

olid #D9D4CC}\n.btn.r{background:#B9541F;color:#fff}\n",tpl:"\n\n\n<div style=\"width:390px;height:844px;background:#F8F6F2;display:flex;flex-direction:column;overflow:hidden\">\n  <div style=\"background:#151B24;color:#fff;padding:18px 20px 14px\">\n    <div style=\"font-weight:700;font-size:17px\">Consent for services</div>\n    <div style=\"font-size:13px;color:#C9D1D6;margin-top:2px\">Form 6 of 7 · before Mon Oct 20</div>\n  </div>\n  <div style=\"flex:1;padding:16px 20px 0;display:flex;flex-direction:column;gap:12px;overflow:hidden\">\n    <div class=\"tile\" style=\"background:#F2F9F8;border-color:#217A78\"><b>What this says</b><div class=\"s\" style=\"color:#151B24;margin-top:4px;line-height:1.5\">You agree that Harvest can work with Tyler at school during the day. You can stop at any time. Harvest may record the first conversation to fill in paperwork, with your OK.</div></div>\n    <div class=\"tile\" style=\"font-size:13px;color:#525B66;line-height:1.5;max-height:170px;overflow:hidden\">Harvest Outreach Center · Consent to Treatment · Therapeutic Day Treatment · I, the parent or legal guardian of the child named above, consent to the provision of therapeutic day treatment services as described in the individual service plan… <a href=\"#full\">Read the full form</a></div>\n    <div><label>Sign with your finger</label><div style=\"border:1.5px dashed #C9CDD3;border-radius:12px;height:110px;background:#fff;display:flex;align-items:center;justify-content:center;color:#8E99A6;font-size:14px\">Denise Rivers</div></div>\n    <a class=\"btn p\" href=\"ParentPortal.dc.html\" style=\"min-height:54px\">Sign</a>\n  </div>\n  <div style=\"padding:12px 20px 22px;border-top:1px solid #E6E1D9;background:#F8F6F2;font-size:12px;color:#525B66;text-align:center\">A copy goes to your email · <a href=\"#es\">Leer en español</a></div>\n</div>\n",note:"HOW THE DATA GETS IN · Parent signs\n\nCaptured: the guardian's typed name and signature on the consent and release, before intake.\n\nFlows: the signed PDF is stored with the referral and attached to the Lauris Documents tab by the intake clinician.\n\nPopulates: the consent date on the intake and the SRA.",make:(function(){

5px solid #D9D4CC}\n.btn.r{background:#B9541F;color:#fff}\n",tpl:"\n\n\n<div style=\"width:390px;height:844px;background:#F8F6F2;display:flex;flex-direction:column;overflow:hidden\">\n  <div style=\"background:#151B24;color:#fff;padding:18px 20px 14px\">\n    <div style=\"font-weight:700;font-size:17px\">Harvest Outreach Center</div>\n    <div style=\"font-size:14px;color:#C9D1D6;margin-top:2px\">Hi Denise · Tyler's page</div>\n    <div style=\"display:flex;gap:8px;margin-top:10px;font-size:13px\"><span style=\"background:#217A78;border-radius:999px;padding:3px 10px;font-weight:600\">English</span><span style=\"border:1px solid #46525F;border-radius:999px;padding:3px 10px\">Español</span></div>\n  </div>\n\n  <div style=\"flex:1;padding:14px 20px 0;display:flex;flex-direction:column;gap:10px;overflow:hidden\">\n    <div class=\"tile\" style=\"border-color:#217A78;background:#F2F9F8\">\n      <div style=\"display:flex;align-items:center;gap:8px\"><b>Where things stand</b><span class=\"chip y\" style=\"margin-left:auto\">1 to sign</span></div>\n      <div class=\"s\">Intake done Oct 20 · request sent to Humana Oct 22 · decision due today</div>\n      <div class=\"bar\"><i style=\"width:71%\"></i></div>\n      <a class=\"btn p\" href=\"#sign\" style=\"margin-top:10px;min-height:48px\">Sign the release for the school</a>\n      \n    </div>\n\n    <div class=\"tile\">\n      <div style=\"display:flex;align-items:center;gap:8px\"><b>How Tyler is doing</b><span class=\"chip n\" style=\"margin-left:auto\">this week</span></div>\n      \n      <div style=\"margin-top:10px;font-size:14px\"><b>Staying calm when upset</b><div class=\"bar\"><i style=\"width:60%\"></i></div><div class=\"s\">4 good days out of 5 in his first week</div></div>\n    </div>\n\n    <div class=\"tile\">\n      <div style=\"display:flex;align-items:center;gap:8px\"><b>2-minute check-in</b><span class=\"chip g\" style=\"margin-left:auto\">every 2 weeks</span></div>\n      \n      <a class=\"btn o\" href=\"#survey\" style=\"margin-top:10px;min-height:48px;color:#151B24\">Start the check-in</a>\n    </div>\n\n    <div class=\"tile\">\n      <div style=\"display:flex;align-items:center;gap:8px\"><b>First check-in</b><span class=\"chip y\" style=\"margin-left:auto\">due this week</span></div>\n      <div class=\"s\">Three questions, two minutes.</div>\n    </div>\n  </div>\n\n  <div style=\"padding:12px 20px 22px;border-top:1px solid #E6E1D9;background:#F8F6F2;font-size:12px;color:#525B66;text-align:center\">Secure · only Harvest sees this · <a href=\"#call\">Call us instead</a></div>\n</div>\n",note:"HOW THE DATA GETS IN · portal\n\nCaptured: guardian signs the enrollment packet before the intake (so the visit is the conversation), answers a short check-in every two weeks (DSM cross-cutting items; the child gets their own version at 11+), asks for a ride, signs the quarterly on the phone. Clinical questions stay on the call.\n\nFlows: signatures and answers go to Psyflo; signed PDFs are handed to Lauris's Documents tab by the site supervisor until Lauris's own Consumer Access login is turned on; survey answers feed the client-progress view (21) and the quarterly.\n\nPopulates: a plain-language progress view for the guardian built from goals and daily ratings (no scores, no diagnoses); the intake checklist (2); the discrepancy flag when parent and child answers diverge.\n\nEngineering: SMS link, phone-first, two languages; in-person signature rules still apply to whatever Lauris and DMAS require in person; consent for AI use folded into the informed-consent packet after attorney review.",make:(function(){
