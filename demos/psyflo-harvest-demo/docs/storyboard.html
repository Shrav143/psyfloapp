class=\"nav\" href=\"Compliance.dc.html\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z\"></path><path d=\"M9 12l2 2 4-4\"></path></svg>Compliance<span class=\"n\">1</span></a>\n      <a class=\"nav\" href=\"Analytics.dc.html\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"></path></svg>Analytics</a>\n      <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8E99A6;padding:18px 12px 6px\">The four doors</div>\n      <a class=\"nav\" href=\"ExtHome.dc.html\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"></rect><path d=\"M3 9h18M7 6.5h.01M10 6.5h.01\"></path></svg>Lauris extension<span class=\"n\">on</span></a>\n      <a class=\"nav\" href=\"MobileApp.dc.html\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"7\" y=\"2\" width=\"10\" height=\"20\" rx=\"2\"></rect><path d=\"M11 18h2\"></path></svg>Mobile app</a>\n      <a class=\"nav\" href=\"ParentPortal.dc.html\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M3 11l9-7 9 7v9H3z\"></path><path d=\"M10 20v-6h4v6\"></path></svg>Parent portal</a>\n      <a class=\"nav\" href=\"SchoolPortal.dc.html\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M2 10l10-5 10 5-10 5z\"></path><path d=\"M6 12v5c3 2 9 2 12 0v-5\"></path></svg>School portal</a>\n    </nav>\n    <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:center;gap:8px;border:1px solid #2A3340;border-radius:8px;padding:8px 10px;font-size:12px;color:#C9D1D6\"><span style=\"width:8px;height:8px;border-radius:50%;background:#F0B44C;display:inline-block\"></span>Demo data · nothing is real</div>\n      <div style=\"display:flex;align-items:center;gap:10px;border-top:1px solid #2A3340;padding-top:14px\">\n        <div style=\"width:36px;height:36px;border-radius:50%;background:#217A78;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px\">JP</div>\n        <div><div style=\"font-weight:600;font-size:13px\">Jordan Perez</div><div style=\"font-size:12px;color:#8E99A6\">LPC · Asst. Clinical Support Supervisor</div></div>\n      </div>\n    </div>\n  </aside>\n\n  <main style=\"flex:999 1 560px;min-width:0;display:flex;flex-direction:column\">\n    <header style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid #E6E1D9;background:#fff\">\n      <a href=\"Authorizations.dc.html\" style=\"font-weight:500;text-decoration:none\">← Authorizations</a>\n      <span style=\"color:#525B66\">/</span><span style=\"font-weight:600\">R-0416 · T.W., 12</span>\n      <span class=\"chip n\">Sent · waiting for a decision</span>\n      <div style=\"margin-left:auto;display:flex;gap:8px\"><span class=\"chip r\">decision due today</span><span class=\"chip n\">Humana Healthy Horizons · fax</span></div>\n    </header>\n    <div style=\"padding:22px 28px 32px;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end\">\n        <div>\n          <h1 style=\"margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em\">Sent to Humana · T.W., 12 · Lynchburg City MS-2</h1>\n        </div>\n        <div style=\"margin-left:auto;display:flex;gap:8px\"><a class=\"btn o\" href=\"Authorizations.dc.html\">Open the signed PDF</a><a class=\"btn p\" href=\"Authorizations.dc.html\">Overdue notice · ready if needed</a></div>\n      </div>\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n        <section class=\"card\" style=\"flex:3 1 520px;min-width:0;padding:16px 20px\">\n          <h2 style=\"margin:0 0 6px;font-size:15px;font-weight:600\">What happened, in order</h2>\n          <div class=\"step\" style=\"border-top:0\"><div class=\"dt\">Oct 22 · 2:04 pm</div><div><b>Signed in Lauris</b> by J. Perez, LPC (Forms to Approve). Psyflo saved the signed PDF from the preview and put the packet together: form, cover sheet, Humana's fax number.</div></div>\n          <div class=\"step\"><div class=\"dt\">Oct 22 · 2:06 pm</div><div><b>J. Perez pressed Send</b> on this page; the packet went by fax via Sfax to Humana's authorization fax number · 11 pages · reference <b>F-2291</b> · Sfax delivery receipt 2:07 pm. (For Anthem and UHC the same button opens the portal in your own login with the packet ready to upload.)</div></div>\n          <div class=\"step\"><div class=\"dt\">Oct 22</div><div>7-calendar-day decision clock started · decision due Oct 29.</div></div>\n                    <div class=\"step\"><div class=\"dt\">Oct 27 · 10:12 am</div><div><b>Receipt check call.</b> C. Diaz called Humana provider services from the reminder on this page (script and fax reference ready). Rep (first name logged) confirmed receipt and said the case is \"in clinical review.\" Outcome typed here at 10:12 am.</div></div>\n          <div class=\"step\"><div class=\"dt\">Today</div><div>Decision due. If nothing arrives by 5 pm the row turns overdue and an overdue notice citing the 7-day standard is drafted for a clinician to send.</div></div>\n        </section>\n\n        <div style=\"flex:2 1 340px;min-width:0;display:flex;flex-direction:column;gap:20px\">\n          <section class=\"card\" style=\"padding:16px 20px\">\n            <h2 style=\"margin:0 0 6px;font-size:15px;font-weight:600\">Proof of sending</h2>\n            <div style=\"display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 10px;font-size:13px\">\n              <div style=\"color:#525B66\">Signed PDF</div><div>R-0416_T.W._initial_signed.pdf · 11 pages</div>\n              <div style=\"color:#525B66\">Sent via</div><div>Sfax · Harvest's account</div>\n              <div style=\"color:#525B66\">Reference</div><div>F-2291</div>\n              <div style=\"color:#525B66\">Delivery</div><div>Confirmed Oct 22, 2:07 pm (Sfax receipt attached)</div>\n              <div style=\"color:#525B66\">Receipt call</div><div>Oct 27, 10:12 am · C. Diaz · rep confirmed</div>\n            </div>\n          </section>\n          <section class=\"card\" style=\"padding:16px 20px\">\n            <h2 style=\"margin:0 0 6px;font-size:15px;font-weight:600\">When the answer comes</h2>\n            <div style=\"font-size:13px;color:#525B66\">Replies arrive by fax and are matched to this request.</div>\n          </section>\n          \n        </div>\n      </div>\n    </div>\n  </main>\n</div>\n",note:"HOW THE DATA GETS IN · Sent\n\nCaptured: the signed PDF (from the Lauris preview), the packet Psyflo assembled (form, cover sheet, payer's number or portal), and the fax or portal result.\n\nFlows: fax insurers → the clinician presses Send in Psyflo → Psyflo faxes via the Sfax API from Harvest's account; reference and delivery receipt stored. Portal insurers → Send opens Availity/UHC in the clinician's own login with the packet ready; the clinician uploads; the extension reads the confirmation. Receipt check: Psyflo reminds a person to call, with the script and the fax reference; the outcome is typed in.\n\nPopulates: the request's stage and clocks (10). Replies from insurers arrive by fax into Sfax, are read by OCR, matched by member ID and reference, and move the stage.\n\nEngineering: Sfax API in and out; OCR + matching rules;  no unattended portal sessions and no stored clinician credentials — the press-Send step is deliberate.",make:(function(){ 
return class Component extends DCLogic {
  renderVals() { return {}; }
}
 })()},
{id:"mobile-app",file:"MobileApp.dc.html",title:"20 · Mobile app (phone) · Oct 29",w:390,fixed:true,css:"\nbody{margin:0;background:#F8F6F2;color:#151B24;font-family:'DM Sans',system-ui,sans-serif;font-size:17px;line-height:1.45}\na{color:#217A78}a:hover{color:#15605E}\n*{box-sizing:border-box}\nlabel{display:block;font-size:15px;font-weight:600;margin-bottom:6px}\n.in{width:100%;border:1.5px solid #C9CDD3;border-radius:10px;padding:12px 14px;font:inherit;font-size:17px;background:#fff;min-height:50px;color:#151B24}\n.rad{display:flex;gap:10px}\n.rad label{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;margin:0;border:1.5px solid #C9CDD3;border-radius:10px;min-height:50px;background:#fff;font-size:16px}\n.rad label.on{border-color:#217A78;background:#DDF1EF;color:#15605E;font-weight:600}\n.rad input{width:18px;height:18px;margin:0;accent-color:#217A78}\n.btn{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:12px;font:inherit;font-weight:600;font-size:17px;border:0;width:100%;text-decoration:none}\n.btn.p{background:#217A78;color:#fff}\n.chipr{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #C9CDD3;border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;background:#fff}\n.chipr.on{border-color:#217A78;background:#DDF1EF;color:#15605E}\n.tile{border:1px solid #E6E1D9;border-radius:14px;padding:14px 16px;background:#fff}\n.tile b{font-size:16px}\n.tile .s{font-size:14px;color:#525B66;margin-top:2px}\n.bar{height:8px;border-radius:4px;background:#EFEBE4;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#217A78}\n.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}\n.chip.r{background:#FBE9E4;color:#8A2E1C}.chip.y{background:#FCEFD0;color:#6F4A05}.chip.g{background:#DDF1EF;color:#15605E}.chip.n{background:#EEEBE5;color:#3E4652}\n.btn.o{background:#fff;color:#151B24;border:1.5px solid #D9D4CC}\n.btn.r{background:#B9541F;color:#fff}\n",tpl:"\n\n\n<div style=\"width:390px;height:844px;background:#F8F6F2;display:flex;flex-direction:column;overflow:hidden\">\n  <div style=\"background:#151B24;color:#fff;padding:16px 20px 12px\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <svg role=\"img\" aria-label=\"psyflo\" viewBox=\"0 0 3191 1060\" width=\"70\" height=\"23\"><g transform=\"translate(-6.0,780.0) scale(1,-1)\"><path d=\"M66 -220V504H186L201 434Q217 456 239.0 474.5Q261 493 291.5 504.5Q322 516 363 516Q434 516 488.0 481.0Q542 446 573.5 386.5Q605 327 605 251Q605 175 573.0 115.5Q541 56 487.0 22.0Q433 -12 364 -12Q308 -12 267.5 8.5Q227 29 201 65V-220ZM332 106Q372 106 402.5 124.0Q433 142 450.0 175.0Q467 208 467 251Q467 294 450.0 327.5Q433 361 402.5 379.5Q372 398 332 398Q293 398 262.5 379.5Q232 361 214.5 328.0Q197 295 197 252Q197 209 214.5 175.5Q232 142 262.5 124.0Q293 106 332 106Z\" fill=\"#FFFFFF\"></path></g><g transform=\"translate(624.0,780.0) scale(1,-1)\"><path d=\"M272 -12Q203 -12 152.0 10.0Q101 32 72.0 71.0Q43 110 39 159H173Q178 140 190.0 124.5Q202 109 222.0 100.0Q242 91 270 91Q297 91 314.0 98.5Q331 106 339.5 119.0Q348 132 348 146Q348 167 336.0 178.5Q324 190 301.0 197.0Q278 204 245 211Q209 218 174.5 228.5Q140 239 113.0 255.0Q86 271 70.0 296.0Q54 321 54 358Q54 403 78.0 438.5Q102 474 148.0 495.0Q194 516 259 516Q350 516 403.0 475.0Q456 434 466 362H339Q333 385 312.5 398.5Q292 412 258 412Q222 412 203.0 399.0Q184 386 184 365Q184 351 196.5 340.0Q209 329 232.0 321.5Q255 314 288 307Q346 295 390.0 279.5Q434 264 459.0 235.5Q484 207 484 153Q484 105 458.0 67.5Q432 30 384.5 9.0Q337 -12 272 -12Z\" fill=\"#FFFFFF\"></path></g><g transform=\"translate(1105.0,780.0) scale(1,-1)\"><path d=\"M130 -220 252 56H222L20 504H167L311 179L441 504H584L273 -220Z\" fill=\"#FFFFFF\"></path></g><g transform=\"translate(1734.0,780.0) scale(1,-1)\"><path d=\"M89 0V549Q89 612 110.0 649.0Q131 686 170.5 703.0Q210 720 263 720H325V605H283Q251 605 237.5 592.5Q224 580 224 549V0ZM20 391V504H333V391Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2080.0,780.0) scale(1,-1)\"><path d=\"M66 0V720H201V0Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2322.0,780.0) scale(1,-1)\"><path d=\"M304 -12Q232 -12 174.5 21.5Q117 55 83.5 114.5Q50 174 50 251Q50 330 83.5 389.5Q117 449 175.0 482.5Q233 516 305 516Q378 516 435.5 482.5Q493 449 526.5 389.5Q560 330 560 252Q560 174 526.5 114.5Q493 55 435.0 21.5Q377 -12 304 -12ZM304 105Q338 105 364.5 121.0Q391 137 406.5 170.0Q422 203 422 252Q422 301 406.5 333.5Q391 366 364.5 382.5Q338 399 305 399Q273 399 246.0 382.5Q219 366 203.5 333.5Q188 301 188 252Q188 203 203.5 170.0Q219 137 245.5 121.0Q272 105 304 105Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2922.0,780.0) scale(1,-1)\"><path d=\"M127 -5Q89 -5 66.0 17.5Q43 40 43 73Q43 106 66.0 128.5Q89 151 127 151Q163 151 186.0 128.5Q209 106 209 73Q209 40 186.0 17.5Q163 -5 127 -5Z\" fill=\"#F0B44C\"></path></g></svg>\n      <div style=\"margin-left:auto;font-size:13px;color:#C9D1D6\">Kayla · ES-1 · Thu Oct 29</div>\n    </div>\n    <div style=\"margin-top:12px;background:#222A35;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px\">\n      <span style=\"width:12px;height:12px;border-radius:50%;background:#F0B44C;display:inline-block\"></span>\n      <div style=\"flex:1\"><div style=\"font-size:13px;color:#C9D1D6\">With a student now</div><div style=\"font-size:22px;font-weight:700;letter-spacing:-.01em\">M.R. · 23:41</div></div>\n      <button class=\"btn r\" style=\"width:auto;min-height:44px;padding:0 18px;border-radius:10px\">Stop</button>\n    </div>\n    <div style=\"font-size:12px;color:#8E99A6;margin-top:8px\">Since 1:52 pm · runs with the screen locked</div>\n  </div>\n\n  <div style=\"flex:1;padding:16px 20px 0;display:flex;flex-direction:column;gap:14px;overflow:hidden\">\n    <div>\n      <label style=\"font-size:13px;color:#525B66;font-weight:600;margin-bottom:8px\">Who are you with?</label>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\"><span class=\"chipr on\">M.R.</span><span class=\"chipr\">J.T.</span><span class=\"chipr\">D.P.</span><span class=\"chipr\">A.G.</span><span class=\"chipr\">E.S.</span><span class=\"chipr\">C.B.</span></div>\n      <div style=\"font-size:13px;color:#525B66;margin-top:8px\">Or just say the name.</div>\n    </div>\n\n    <a class=\"btn p\" href=\"#start\" style=\"min-height:58px;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 8v4l3 2\"></path></svg>Start with M.R.</a>\n    <a class=\"btn o\" href=\"#dictate\" style=\"min-height:58px;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;color:#151B24\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"></rect><path d=\"M5 11a7 7 0 0 0 14 0M12 18v3\"></path></svg>Say what happened</a>\n    <div style=\"font-size:13px;color:#525B66;margin-top:-6px;text-align:center\">or type</div>\n\n    <div class=\"tile\">\n      <div style=\"display:flex;align-items:center;gap:8px\"><b>Your day so far</b><span class=\"chip g\" style=\"margin-left:auto\">2 notes waiting</span></div>\n      <div class=\"s\">9:05 M.R. 45 min · 10:10 J.T. 1 h 05 · 1:42 said: \"played basketball with M.R., he cooled down after\" · 1:10 C.B. 50 min · 1:52 M.R. running</div>\n      \n    </div>\n  </div>\n\n  <div style=\"padding:12px 20px 22px;display:flex;justify-content:space-around;border-top:1px solid #E6E1D9;background:#F8F6F2;font-size:12px;color:#525B66\">\n    <div style=\"text-align:center;color:#217A78;font-weight:600\">Today</div><div style=\"text-align:center\">My students</div><div style=\"text-align:center\">Assessments <span class=\"chip y\">2</span></div><div style=\"text-align:center\">Me</div>\n  </div>\n</div>\n",note:"HOW THE DATA GETS IN · app\n\nCaptured: on the work iPhone (every staffer has one): pick a student or say their name, start/stop the timer, say what happened. The timer keeps counting with the screen locked. Typing is always an option when someone is within earshot.\n\nFlows: taps and dictation go to Psyflo with timestamps. The dictation is turned into note language using the ISP drop-down names and waits in Psyflo; it drops into the note the moment the staffer opens that student in Lauris.\n\nPopulates: the daily note in Lauris (staff read it and press save/process); contact time and units (11, 10); the staff dashboard (19).\n\nEngineering: iOS app plus a web fallback; interim path is an email/Notes capture that routes into Psyflo; on-device recording with upload when there is signal (schools often have none); nothing is written to Lauris except into an open form.",make:(function(){ 
return class Component extends DCLogic {
  renderVals() { return {}; }

solid #EFEBE4;font-size:11px;color:#151B24\"><span style=\"background:#E6F4EA;border:1px solid #BFE3CB;padding:2px 9px;border-radius:999px\">green · already in Lauris</span><span style=\"background:#FFF8E6;border:1px solid #E8C56A;padding:2px 9px;border-radius:999px\">yellow · Psyflo typed — check it</span></div>\n\n      <div style=\"padding:12px 16px;display:flex;flex-direction:column;gap:12px;overflow:auto\">\n        <div style=\"display:flex;gap:6px\" role=\"group\" aria-label=\"Example\">\n          <button class=\"{{tA}}\" onClick=\"{{pA}}\">Dictated in the hallway</button>\n          <button class=\"{{tB}}\" onClick=\"{{pB}}\">Typed with \"observed\"</button>\n        </div>\n\n        <div style=\"border:1px solid #E6E1D9;border-radius:10px;padding:10px 12px;background:#F8F6F2\">\n          <div style=\"font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600;display:flex;align-items:center;gap:6px\"><svg aria-hidden=\"true\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#217A78\" stroke-width=\"2\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"12\" rx=\"3\"></rect><path d=\"M5 11a7 7 0 0014 0M12 18v3\"></path></svg>{{srcLabel}}</div>\n          <div style=\"font-size:13px;margin-top:4px;font-style:italic\">“{{said}}”</div>\n        </div>\n\n        <div>\n          <div style=\"font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600;margin-bottom:4px\">Drafted for the narrative</div>\n          <div style=\"border:1px solid #F0B44C;background:#FFFDF7;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5\"><sc-if value=\"{{isB}}\" hint-placeholder-val=\"{{false}}\"><span class=\"mark\">Observed</span> client during math; he stayed on task 15 of 30 min. <div style=\"margin-top:6px;color:#525B66\">→ <b>Worked with</b> M.R. during math using a visual timer and prompted re-entry twice; on task 15 of 30 min (Obj. 3, off-task behaviour).</div></sc-if><sc-if value=\"{{isA}}\" hint-placeholder-val=\"{{true}}\">Worked with M.R. on emotional regulation and frustration tolerance through a structured <b>Movement</b> intervention (basketball, 1:10–1:40 pm). When he lost the game he became frustrated and walked off the court; staff used a co-regulation walk and he re-engaged after 6 minutes, practicing <b>Solving peer conflict</b> language with a prompt. Addresses ISP Objective 1 (emotional regulation) and Objective 2 (impulse control).</sc-if></div>\n          \n        </div>\n\n        <div style=\"border:1px solid #E6E1D9;border-radius:10px;padding:10px 12px;background:#fff\">\n          <div style=\"font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600;margin-bottom:4px\">What Psyflo added, and where it came from</div>\n          <div style=\"font-size:12px;line-height:1.5\"><span style=\"background:#DDF1EF;border-radius:3px;padding:0 3px\">movement intervention → regulation</span> from the ISP drop-down · <span style=\"background:#DDF1EF;border-radius:3px;padding:0 3px\">6 min, prompted</span> from your timer and what you said · <span style=\"background:#DDF1EF;border-radius:3px;padding:0 3px\">objective 1.2</span> from the plan. Nothing else was invented.</div>\n          <div style=\"display:flex;gap:6px;margin-top:8px\"><button class=\"btn o\" style=\"min-height:32px;padding:0 10px;font-size:12px\">Good recommendation</button><button class=\"btn o\" style=\"min-height:32px;padding:0 10px;font-size:12px;color:#8A2E1C\">That didn't happen</button></div>\n          \n        </div>\n\n        <div style=\"font-size:12px\"><span class=\"chip n\">Movement intervention · QMHP 1.4 · Harvest's list</span></div>\n\n        <div>\n          <div style=\"font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600;margin-bottom:2px\">Checked before you press Process Form</div>\n          <div class=\"ck\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{c1}}\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"{{c1p}}\"></path></svg><div>{{c1t}}</div></div>\n          <div class=\"ck\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#217A78\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M9 12l2 2 4-4\"></path></svg><div>Intervention on the ISP list — and <b>why</b> it was used (movement → regulation), not just that it happened</div></div>\n          <div class=\"ck\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#217A78\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M9 12l2 2 4-4\"></path></svg><div>Linked to an ISP objective; progress stated as a count, not a percentage</div></div>\n          <div class=\"ck\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#217A78\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M9 12l2 2 4-4\"></path></svg><div>Frequency, duration and intensity present (6 min, prompted, moderate) — what the continued stay will need in 30 days</div></div>\n        </div>\n\n        <div>\n          <div style=\"font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600;margin-bottom:2px\">Contact time today</div>\n          \n          <div class=\"stamp\" style=\"border-top:0\"><div>● 8:05–8:35</div><div>Morning check-in, classroom</div><div>30 m</div></div>\n          <div class=\"stamp\"><div>● 9:50–11:05</div><div>In-class support, math &amp; reading</div><div>75 m</div></div>\n          <div class=\"stamp\"><div>● 11:40–12:25</div><div>Lunch support</div><div>45 m</div></div>\n          <div class=\"stamp\"><div>● 1:10–1:40</div><div>Movement intervention + co-regulation walk · voice memo 1:42</div><div>30 m</div></div>\n          <div class=\"stamp\"><div>○ 1:40–3:10</div><div>Afternoon classes, transitions · <span style=\"color:#6F4A05\">confirm</span></div><div>90 m</div></div>\n          <div class=\"stamp\" style=\"font-weight:600\"><div>Total</div><div>5 h 10 min → 3 units (5 h+)</div><div></div></div>\n          <div style=\"display:flex;align-items:center;gap:8px;margin-top:6px;border:1px solid #217A78;border-radius:8px;padding:8px 10px;background:#F2F9F8;font-size:12px\"><div style=\"flex:1\"><b>3 units used today for M.R.?</b> · 27 → 24 left on this authorization · checked against this page each time it is open</div><button class=\"btn p\" style=\"min-height:32px;padding:0 10px;font-size:12px\">Confirm</button></div>\n        </div>\n\n        <div style=\"display:flex;gap:8px;margin-top:auto\">\n          <button class=\"btn p\" style=\"flex:1\">Insert into narrative</button>\n          <button class=\"btn o\">Edit</button>\n        </div>\n        \n      </div>\n    </aside>\n  </div>\n</div>\n",note:"HOW THE DATA GETS IN · note\n\nCaptured: the staffer writes or dictates the note in the Lauris box, then presses Scan & enhance. Psyflo reads the box, rewrites it in note language using the intervention names from the treatment plan drop-downs, and shows the stronger version in the panel. Contact time: ● Start/Stop taps during the day (Track time), ○ added later from the note.\n\nFlows: the staffer edits the enhanced note in the panel → 'Use this' puts it back in the same Lauris box → Process Form. At Process Form the extension copies the finished note to Psyflo — one copy, the last thing entered in Lauris. Units = direct time under the band rule, confirmed by the staffer.\n\nPopulates: Psyflo's note store (feeds 12–15); units left on Authorizations (10); the contact-time evidence used on partials and peer-to-peers (14, 15).\n\nEngineering: the word check is a list of non-billable verbs plus an AI rewrite; copy-on-Process-Form reads the page; units checked against 'units available' each time the page is open; a direct-support login sees only its own students' notes.",make:(function(){ 
return class Component extends DCLogic {
  constructor(p){ super(p); this.state = { ex: 'a' }; }
  renderVals() {
    const a = this.state.ex === 'a';
    return {
      isA: a, isB: !a,
      tA: 'tog' + (a ? ' on' : ''), tB: 'tog' + (a ? '' : ' on'),
      pA: () => this.setState({ex:'a'}), pB: () => this.setState({ex:'b'}),
      srcLabel: a ? 'Said into the phone, 1:42 pm' : 'Typed in the narrative box',
      said: a ? 'played basketball with him, he got frustrated when he lost and walked out, we did a walk and he came back' : 'Observed client during math; he stayed on task 15 of 30 min.',
      narrative: a ? '' : 'Observed client during math; he stayed on task 15 of 30 min.',
      c1: a ? '#217A78' : '#8A2E1C', c1p: a ? 'M9 12l2 2 4-4' : 'M15 9l-6 6M9 9l6 6',
      c1t: a ? 'Billable verbs only — no "observed," "monitored," "watched"' : '"Observed" voids this unit in an audit. Replace with worked with / engaged / facilitated / prompted.'
    };
  }

umn;gap:12px\">\n      <div style=\"display:flex;align-items:center;gap:8px;border:1px solid #2A3340;border-radius:8px;padding:8px 10px;font-size:12px;color:#C9D1D6\"><span style=\"width:8px;height:8px;border-radius:50%;background:#F0B44C;display:inline-block\"></span>Demo data · nothing is real</div>\n      <div style=\"display:flex;align-items:center;gap:10px;border-top:1px solid #2A3340;padding-top:14px\">\n        <div style=\"width:36px;height:36px;border-radius:50%;background:#217A78;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px\">KH</div>\n        <div><div style=\"font-weight:600;font-size:13px\">Kayla Hale</div><div style=\"font-size:12px;color:#8E99A6\">Direct support · Campbell ES-1</div></div>\n      </div>\n    </div>\n  </aside>\n\n  <main style=\"flex:999 1 560px;min-width:0;display:flex;flex-direction:column\">\n    <header style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid #E6E1D9;background:#fff\">\n      <div style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#525B66;font-weight:600\">As of <span style=\"color:#151B24\">Thu, Oct 29</span></div>\n      <div class=\"seg\" role=\"group\" aria-label=\"View\"><button class=\"{{bMe}}\" onClick=\"{{pMe}}\">My view · K. Hale</button><button class=\"{{bSup}}\" onClick=\"{{pSup}}\">Supervisor view · Campbell ES-1</button></div>\n      <div style=\"margin-left:auto\"></div>\n    </header>\n\n    <div style=\"padding:26px 28px 32px;display:flex;flex-direction:column;gap:20px\">\n      <sc-if value=\"{{me}}\">\n      <div>\n        <h1 style=\"margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em\">Your day, Kayla</h1>\n      </div>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n        <div class=\"kpi\"><div class=\"l\">Daily notes today</div><b>4 <span style=\"font-size:16px;color:#525B66\">of 6</span></b><span>J.T. and C.B. still open</span></div>\n        <div class=\"kpi\"><div class=\"l\">Notes in by 24 h, this month</div><b>92%</b><span>Medicaid asks for 24 h · site average 81%</span></div>\n        <div class=\"kpi\"><div class=\"l\">Weekly parent contacts</div><b>5 <span style=\"font-size:16px;color:#525B66\">of 6</span></b><span>M.R.'s grandmother by Friday</span></div>\n        <div class=\"kpi\"><div class=\"l\">Monthly collaterals</div><b>4 <span style=\"font-size:16px;color:#525B66\">of 6</span></b><span>D.P. counselor · A.G. pediatrician</span></div>\n        <div class=\"kpi\"><div class=\"l\">Assessments due</div><b>2</b><span>SUDS for A.G. · DSM cross-cutting for E.S.</span></div>\n        <div class=\"kpi\"><div class=\"l\">Rejected forms</div><b>1</b><span>from Lauris · fix shown below</span></div>\n      </div>\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n        <section class=\"card\" style=\"flex:3 1 520px;min-width:0;padding:16px 20px\">\n          <h2 style=\"margin:0 0 2px;font-size:16px;font-weight:600\">Still open today</h2>\n          \n          <label class=\"ck\"><input type=\"checkbox\"> <span><b>Daily note · J.T.</b> — 2 h 10 min tracked today; the 11:40 dictation is waiting in your Lauris panel. <a href=\"ExtDPN.dc.html\">Open in Lauris</a></span></label>\n          <label class=\"ck\"><input type=\"checkbox\"> <span><b>Daily note · C.B.</b> — timer ran 9:05–9:50 and 1:10–2:00; nothing dictated yet. <a href=\"MobileApp.dc.html\">Dictate on the phone</a></span></label>\n          <label class=\"ck\"><input type=\"checkbox\"> <span><b>Weekly call · M.R.'s grandmother</b> — due Friday; last call Oct 22 covered the bus incident.</span></label>\n          <label class=\"ck\"><input type=\"checkbox\"> <span><b>Monthly collateral · D.P.'s school counselor</b> — due Oct 31; release on file.</span></label>\n          <label class=\"ck\"><input type=\"checkbox\"> <span><b>SUDS · A.G.</b> — third of the semester; two questions, takes a minute.</span></label>\n          <label class=\"ck\"><input type=\"checkbox\"> <span><b>Rejected in Lauris · daily note Oct 27, M.R.</b> — reviewer note: \"observed\" in the intervention line. Scan &amp; enhance rewrites it as what you did. <a href=\"ExtDPN.dc.html\">Fix it</a></span></label>\n        </section>\n        <section class=\"card\" style=\"flex:2 1 340px;min-width:0;padding:16px 20px\">\n          <h2 style=\"margin:0 0 2px;font-size:16px;font-weight:600\">Your goals</h2>\n          \n          <div style=\"font-size:13px;padding:8px 0;border-top:1px solid #EFEBE4\"><b>Notes in before 3:30</b> · 4 of 5 days this week<div class=\"bar\"><i style=\"width:80%\"></i></div></div>\n          <div style=\"font-size:13px;padding:8px 0;border-top:1px solid #EFEBE4\"><b>Vary interventions</b> · 3 different ones per student this week, goal 3<div class=\"bar\"><i style=\"width:100%\"></i></div></div>\n          <div style=\"font-size:13px;padding:8px 0;border-top:1px solid #EFEBE4\"><b>Name the goal in every note</b> · 18 of 22 notes this month<div class=\"bar\"><i style=\"width:82%\"></i></div></div>\n          <div style=\"font-size:13px;padding:8px 0;border-top:1px solid #EFEBE4\"><b>Safety plan whenever SI is mentioned</b> · 2 of 2<div class=\"bar\"><i style=\"width:100%\"></i></div></div>\n        </section>\n      </div>\n\n      <section class=\"card\" style=\"padding:16px 20px\">\n        <h2 style=\"margin:0 0 2px;font-size:16px;font-weight:600\">Goal watch, by student</h2>\n        \n        <div class=\"row th\" style=\"grid-template-columns:120px minmax(0,1fr) 160px 200px;border-top:0;padding-top:0\"><div>Student</div><div>Goals touched in the last 30 notes</div><div>Progress rating trend</div><div>Prompt</div></div>\n        <div class=\"row\" style=\"grid-template-columns:120px minmax(0,1fr) 160px 200px\"><div><b>M.R., 7</b></div><div>Goal 1 emotional regulation · 22 notes. Goal 2 peer interaction · 9. <span class=\"chip y\">Goal 3 following directions · 0 in 6 weeks</span></div><div>improving (2.1 → 3.4)</div><div style=\"font-size:12px\">Try a structured game with one peer; see the library.</div></div>\n        <div class=\"row\" style=\"grid-template-columns:120px minmax(0,1fr) 160px 200px\"><div><b>J.T., 8</b></div><div>Goal 1 · 25. Goal 2 · 18. Goal 3 · 12.</div><div>flat (2.8 → 2.9)</div><div style=\"font-size:12px\">Same intervention 6 times running; 2 alternatives suggested.</div></div>\n        <div class=\"row\" style=\"grid-template-columns:120px minmax(0,1fr) 160px 200px\"><div><b>D.P., 9</b></div><div>Goal 1 · 20. Goal 2 · 20.</div><div>improving (1.9 → 3.1)</div><div style=\"font-size:12px\">On track; quarterly due Nov 14.</div></div>\n      </section>\n      </sc-if>\n\n      <sc-if value=\"{{sup}}\">\n      <div>\n        <h1 style=\"margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em\">Campbell County ES-1 · 4 staff, 23 students</h1>\n      </div>\n      <section class=\"card\">\n        <div style=\"min-width:0;padding:16px 20px\">\n          <div class=\"row th\" style=\"grid-template-columns:150px 110px 100px 90px 190px minmax(0,1fr);border-top:0;padding-top:0\"><div>Staff</div><div>Dailies today</div><div>In by 24 h</div><div>Rejected</div><div>Review mode</div><div>Flags</div></div>\n          <div class=\"row\" style=\"grid-template-columns:150px 110px 100px 90px 190px minmax(0,1fr)\"><div><b>K. Hale</b><div class=\"sub\" style=\"font-size:12px;color:#525B66\">6 students</div></div><div>4 of 6</div><div>92%</div><div>1</div><div><span class=\"chip n\">spot check</span></div><div style=\"font-size:12px\">Goal 3 untouched for M.R. (6 weeks)</div></div>\n          <div class=\"row\" style=\"grid-template-columns:150px 110px 100px 90px 190px minmax(0,1fr)\"><div><b>R. Owens</b><div class=\"sub\" style=\"font-size:12px;color:#525B66\">5 students · QMHP-T</div></div><div>5 of 5</div><div>97%</div><div>0</div><div><span class=\"chip g\" style=\"white-space:normal\">every note to supervisor</span></div><div style=\"font-size:12px\">Trainee: 14 notes awaiting your approval</div></div>\n          <div class=\"row\" style=\"grid-template-columns:150px 110px 100px 90px 190px minmax(0,1fr)\"><div><b>S. Lane</b><div class=\"sub\" style=\"font-size:12px;color:#525B66\">6 students</div></div><div><span class=\"chip r\">1 of 6</span></div><div><span class=\"chip r\">61%</span></div><div>3</div><div><span class=\"chip y\">needs support</span></div><div style=\"font-size:12px\">4 dailies not in Lauris since Oct 21</div></div>\n          <div class=\"row\" style=\"grid-template-columns:150px 110px 100px 90px 190px minmax(0,1fr)\"><div><b>J. Reyes</b><div class=\"sub\" style=\"font-size:12px;color:#525B66\">6 students</div></div><div>6 of 6</div><div>95%</div><div>0</div><div><span class=\"chip n\">spot check</span></div><div style=\"font-size:12px\"><span class=\"chip y\">3 safety-care holds in 30 days · site average 0.7</span></div></div>\n        </div>\n      </section>\n      <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n        <section class=\"card\" style=\"flex:1 1 420px;min-width:0;padding:16px 20px\">\n          <h2 style=\"margin:0 0 2px;font-size:16px;font-weight:600\">Patterns to talk about this month</h2>\n          \n          <div class=\"ck\"><span><b>J. Reyes · restraints.</b> 3 safety-care interventions in 30 days against a site average under 1. Two were the same student at lunch.</span></div>\n          <div class=\"ck\"><span><b>S. Lane · backlog.</b> Dailies slipped after Oct 21; 4 not in Lauris. Offer the phone app and a 20-minute catch-up block.</span></div>\n          <div class=\"ck\"><span><b>Same words, different days.</b> 6 of K. Hale's last 30 notes share a paragraph; the enhancer now varies them, but the pattern is worth a conversation.</span></div>\n        </section>\n        <section class=\"card\" style=\"flex:1 1 360px;min-width:0;padding:16px 20px\">\n          <h2 style=\"margin:0 0 2px;font-size:16px;font-weight:600\">Metrics the program tracks</h2>\n          \n          <div style=\"display:grid;grid-template-columns:200px minmax(0,1fr);gap:6px 12px;font-size:13px\">\n            <div>Note completion</div><div>% of dailies in within 24 h</div>\n            <div>Care continuity</div><div>weekly parent and monthly collateral contacts made</div>\n            <div>Progress tracking</div><div>goals named in notes; ratings trend per student</div>\n            <div>Measurement-based care</div><div>assessments done on schedule (PHQ, GAD, SUDS, DSM)</div>\n            <div>High-acuity ratio</div><div>share of caseload with 3+ incidents in 3 months</div>\n            <div>Clinical improvement</div><div>assessment deltas intake → now, per student</div>\n          </div>\n        </section>\n      </div>\n      </sc-if>\n\n      \n    </div>\n  </main>\n</div>\n",note:"HOW THE DATA GETS IN · dashboard\n\nCaptured: nothing new — everything is read from what the extension, the phone app and Lauris's rejected-forms list already carry: notes done and open, time in by 24 h, rejected forms and why, contacts made, assessments due, goals named in notes, progress ratings, safety-care holds.\n\nFlows: the same page in two views. The staffer sees their own day and their deliberate-practice goals; the site supervisor sees every staffer at the site, review mode per person (trainee notes route for approval), and patterns the month they happen.\n\nPopulates: the metrics Michelle Hamilton described (note completion, care continuity, progress tracking, measurement-based care, high-acuity ratio) and the supervision conversation.\n\nEngineering: role-scoped views; approval routing is a permission flag; pattern alerts are simple thresholds against site averages; nothing here is typed in.",make:(function(){ 
return class Component extends DCLogic {
  constructor(p){ super(p); this.state = { v: 'me' }; }
  renderVals() { const v=this.state.v; return { me:v==='me', sup:v==='sup', bMe:v==='me'?'on':'', bSup:v==='sup'?'on':'', pMe:()=>this.setState({v:'me'}), pSup:()=>this.setState({v:'sup'}) }; }

Healthy Horizons</option><option>Sentara Health Plans</option><option>UnitedHealthcare Community Plan</option><option>Medicaid FFS · Acentra Health</option></select>\n          <label for=\"svc\" style=\"position:absolute;left:-9999px\">Service</label>\n          <select id=\"svc\" class=\"sel\"><option>All services</option><option>TDT school day · H2016</option><option>TDT after-school · H2016-UG</option><option>TDT summer · H2016-U7</option><option>Outpatient</option></select>\n          <label for=\"rt\" style=\"position:absolute;left:-9999px\">Request type</label>\n          <select id=\"rt\" class=\"sel\"><option>All request types</option><option>Initial SRA</option><option>Continued stay</option><option>Additional information</option><option>Peer-to-peer</option><option>Early discharge + new initial</option><option>Appeal (guardian-led)</option></select>\n        </div>\n      </div>\n\n      <section class=\"card\">\n        <div style=\"min-width:0\">\n          <div class=\"hdr\"><div>Student · request</div><div>Insurer · how sent</div><div>Units</div><div>Stage · clock</div><div>Next action</div><div></div></div>\n          <sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"10\">\n            <div class=\"r\">\n              <div><a class=\"id\" href=\"{{r.href}}\">{{r.client}} · {{r.id}}</a><div class=\"sub\">{{r.school}}</div><div class=\"sub\">{{r.type}} · {{r.service}}</div></div>\n              <div><div style=\"font-weight:500\">{{r.payer}}</div><div class=\"sub\">{{r.channel}}</div></div>\n              <div><div style=\"font-weight:500\">{{r.units}}</div><sc-if value=\"{{r.hasBar}}\" hint-placeholder-val=\"{{true}}\"><div class=\"bar\"><i style=\"{{r.barStyle}}\"></i></div></sc-if><div class=\"sub\">{{r.unitsSub}}</div></div>\n              <div style=\"display:flex;flex-direction:column;gap:4px;align-items:flex-start\"><span class=\"{{r.stageCls}}\" style=\"white-space:normal\">{{r.stage}}</span><span class=\"{{r.clockCls}}\" style=\"white-space:normal\">{{r.clock}}</span></div>\n              <div style=\"font-size:13px\">{{r.next}}</div>\n              <div style=\"text-align:right\"><a class=\"{{r.btnCls}}\" href=\"{{r.href}}\">{{r.btn}}</a></div>\n            </div>\n          </sc-for>\n        </div>\n      </section>\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:20px\">\n        <section class=\"card\" style=\"flex:1 1 420px;padding:16px 20px\">\n          <h2 style=\"margin:0 0 6px;font-size:15px;font-weight:600\">Channels by payer</h2>\n          <div style=\"display:grid;grid-template-columns:240px minmax(0,1fr);gap:8px 16px;font-size:13px;align-items:start\">\n            <div>Aetna Better Health</div><div><span class=\"chip g\">Sfax · you press Send after signature</span></div>\n            <div>Anthem HealthKeepers Plus</div><div><span class=\"chip g\">Availity · uploaded in the clinician's session</span> <span style=\"color:#525B66\">· decision read when you open Availity</span></div>\n            <div>Humana Healthy Horizons</div><div><span class=\"chip g\">Sfax</span></div>\n            <div>Sentara Health Plans</div><div><span class=\"chip g\">Sfax</span></div>\n            <div>UnitedHealthcare Community Plan</div><div><span class=\"chip g\">UHC portal · in-session upload</span></div>\n            <div>Medicaid FFS · Acentra Health</div><div><span class=\"chip g\">Sfax</span></div>\n          </div>\n          \n        </section>\n      </div>\n    </div>\n  </main>\n</div>\n",note:"HOW THE DATA GETS IN · Authorizations\n\nCaptured: stage changes from the extension (processed, signed), from Send (9), and from screens 12–15; units from the Lauris consumer list and the daily notes; decisions from Sfax or the portal read-back.\n\nFlows: every event updates the row; the clocks (7-day decision, 24-hour information request, 14-business-day renewal lead) are computed from dates. The filters are the ones staff asked for: needs my sign-off, info requested, partial, denied, active, {id:"ext-quarterly",file:"ExtQuarterly.dc.html",title:"32 · Review a request · quarterly report · Oct 29",w:1440,fixed:true,css:"\nbody{margin:0;background:#E9E6E0;color:#151B24;font-family:'DM Sans',system-ui,sans-serif;font-size:14px;line-height:1.45}\na{color:#217A78}a:hover{color:#15605E}\n*{box-sizing:border-box}\n.ef{font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#222}\n.ef label{display:block;font-size:11px;color:#666;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}\n.ef .in{border:1px solid #C9CDD3;background:#fff;padding:6px 8px;border-radius:3px;min-height:30px}\n.ef .in.g{background:#E6F4EA}\n.ef .in.a{background:#FFF8E6;border-color:#E8C56A}\n.lnav{display:flex;align-items:center;gap:9px;padding:8px 14px;font-size:12px;color:#C8CFD8}\n.lnav.on{background:#3C4756;color:#fff;border-left:3px solid #E0A030;padding-left:11px}\n.lnav .b{margin-left:auto;background:#C2410C;color:#fff;border-radius:999px;font-size:10px;padding:0 6px;font-weight:700}\n.tab{font-size:12px;color:#555;padding:8px 0;border-bottom:2px solid transparent}\n.tab.on{color:#222;font-weight:700;border-bottom-color:#E0A030}\n.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}\n.chip.r{background:#FBE9E4;color:#8A2E1C}.chip.y{background:#FCEFD0;color:#6F4A05}.chip.g{background:#DDF1EF;color:#15605E}.chip.n{background:#EEEBE5;color:#3E4652}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:8px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;border:1px solid transparent;white-space:nowrap}\n.btn.p{background:#217A78;color:#fff}.btn.p:hover{background:#15605E;color:#fff}\n.btn.o{background:#fff;color:#151B24;border-color:#D9D4CC}.btn.o:hover{background:#F3F0EA;color:#151B24}\n.sec{display:flex;align-items:center;gap:8px;font-size:12px;padding:7px 0;border-top:1px solid #EFEBE4}\n.sec b{flex:1;font-weight:600}\n.stamp{display:grid;grid-template-columns:64px 1fr;gap:8px;font-size:12px;padding:4px 0;border-top:1px solid #EFEBE4}\n.sec .chip{white-space:normal;text-align:right;max-width:60%}\n.stamp>div{min-width:0}\n",tpl:"\n\n\n<div style=\"width:1440px;height:1080px;display:flex;flex-direction:column;background:#E9E6E0;overflow:hidden\">\n  <div style=\"background:#DEDAD3;padding:8px 12px 0;display:flex;align-items:flex-end;gap:8px\">\n    <div style=\"display:flex;gap:6px;padding:0 6px 10px\"><span style=\"width:12px;height:12px;border-radius:50%;background:#C9C4BC;display:inline-block\"></span><span style=\"width:12px;height:12px;border-radius:50%;background:#C9C4BC;display:inline-block\"></span><span style=\"width:12px;height:12px;border-radius:50%;background:#C9C4BC;display:inline-block\"></span></div>\n    <div style=\"padding:8px 14px;font-size:12px;color:#525B66\">Psyflo</div>\n    <div style=\"background:#F8F6F2;border-radius:8px 8px 0 0;padding:8px 14px;font-size:12px;font-weight:500;display:flex;gap:8px;align-items:center\"><span style=\"width:14px;height:14px;border-radius:3px;background:#8E99A6;display:inline-block\"></span>Lauris Online — Quarterly Report</div>\n  </div>\n  <div style=\"background:#F8F6F2;padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #D9D4CC\">\n    <div style=\"flex:1;background:#fff;border:1px solid #D9D4CC;border-radius:999px;padding:6px 14px;font-size:12px;color:#525B66\">https://…laurisonline…/consumers/3310/session/quarterly</div>\n    <div style=\"display:flex;align-items:center;gap:6px;background:#151B24;color:#fff;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600\"><span style=\"width:8px;height:8px;border-radius:50%;background:#F0B44C;display:inline-block\"></span>psyflo · on</div>\n  </div>\n\n  <div style=\"flex:1;display:flex;min-height:0\">\n    <!-- Schematic of the EHR (structure and labels only, not its styling) -->\n    <div class=\"ef\" style=\"flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:#F2F3F5\">\n      <div style=\"background:#2F3A4A;color:#fff;padding:9px 16px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700\"><span style=\"color:#E0A030\">»</span> Lauris Online <span style=\"margin-left:auto;font-weight:400;font-size:11px;color:#C8CFD8\">Switch to Classic · Sign Out</span></div>\n      <div style=\"flex:1;display:flex;min-height:0\">\n        <nav aria-label=\"EHR menu (schematic)\" style=\"flex:0 0 170px;background:#2F3A4A;padding:6px 0;display:flex;flex-direction:column\">\n          <div class=\"lnav\">Consumers</div><div class=\"lnav\">Authorizations</div><div class=\"lnav\">Approvals</div><div class=\"lnav on\">Add Session</div><div class=\"lnav\">Saved Session<span class=\"b\">2</span></div><div class=\"lnav\">Reports</div><div class=\"lnav\">User Information</div><div class=\"lnav\">Time Tracker</div>\n          <div style=\"border-top:1px solid #46525F;margin:8px 0\"></div>\n          <div class=\"lnav\">Forms to Approve<span class=\"b\">6</span></div><div class=\"lnav\">Rejected Forms<span class=\"b\">1</span></div><div class=\"lnav\">Consumers w/o Authorizations<span class=\"b\">3</span></div>\n        </nav>\n        <div style=\"flex:1;min-width:0;padding:12px 20px;overflow:hidden\">\n          <div style=\"display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #DDE1E6;border-radius:4px;padding:8px 14px\">\n            <div style=\"width:36px;height:36px;border-radius:50%;background:#DDE1E6\"></div>\n            <div><div style=\"font-weight:700;font-size:15px;color:#1F3B6B\">M.R.</div><div style=\"font-size:11px;color:#666\">Harvest # 3310 · Campbell County · ES-1 · Aug 18 – Nov 13 · Clinician: J. Perez, LPC</div></div>\n            <div style=\"margin-left:auto;font-size:12px;color:#1F6FBF;font-weight:700\">27 units available</div>\n          </div>\n          <div style=\"display:flex;gap:18px;margin:6px 0 8px\"><span class=\"tab\" {id:"ext-case",file:"ExtCase.dc.html",title:"33 · Review a request · continued stay · Oct 29",w:1440,fixed:true,css:"\nbody{margin:0;background:#E9E6E0;color:#151B24;font-family:'DM Sans',system-ui,sans-serif;font-size:14px;line-height:1.45}\na{color:#217A78}a:hover{color:#15605E}\n*{box-sizing:border-box}\n.ef{font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#222}\n.ef label{display:block;font-size:11px;color:#666;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}\n.ef .in{border:1px solid #C9CDD3;background:#fff;padding:6px 8px;border-radius:3px;min-height:30px}\n.ef .in.g{background:#E6F4EA}\n.ef .in.a{background:#FFF8E6;border-color:#E8C56A}\n.lnav{display:flex;align-items:center;gap:9px;padding:8px 14px;font-size:12px;color:#C8CFD8}\n.lnav.on{background:#3C4756;color:#fff;border-left:3px solid #E0A030;padding-left:11px}\n.lnav .b{margin-left:auto;background:#C2410C;color:#fff;border-radius:999px;font-size:10px;padding:0 6px;font-weight:700}\n.tab{font-size:12px;color:#555;padding:8px 0;border-bottom:2px solid transparent}\n.tab.on{color:#222;font-weight:700;border-bottom-color:#E0A030}\n.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}\n.chip.r{background:#FBE9E4;color:#8A2E1C}.chip.y{background:#FCEFD0;color:#6F4A05}.chip.g{background:#DDF1EF;color:#15605E}.chip.n{background:#EEEBE5;color:#3E4652}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:8px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;border:1px solid transparent;white-space:nowrap}\n.btn.p{background:#217A78;color:#fff}.btn.p:hover{background:#15605E;color:#fff}\n.btn.o{background:#fff;color:#151B24;border-color:#D9D4CC}.btn.o:hover{background:#F3F0EA;color:#151B24}\n.sec{display:flex;align-items:center;gap:8px;font-size:12px;padding:7px 0;border-top:1px solid #EFEBE4}\n.sec b{flex:1;font-weight:600}\n.stamp{display:grid;grid-template-columns:64px 1fr;gap:8px;font-size:12px;padding:4px 0;border-top:1px solid #EFEBE4}\n.sec .chip{white-space:normal;text-align:right;max-width:60%}\n.stamp>div{min-width:0}\n.conf{background:#FCEFD0;border-radius:3px;padding:0 3px}\n.tog{border:1px solid #D9D4CC;background:#fff;border-radius:8px;padding:0 10px;min-height:34px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;color:#151B24}\n.tog.on{background:#151B24;color:#fff;border-color:#151B24}\n.par{border:1px solid #F0B44C;background:#FFFDF7;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5}\nsup{color:#217A78;font-weight:600}\n",tpl:"\n\n\n<div style=\"width:1440px;height:1080px;display:flex;flex-direction:column;background:#E9E6E0;overflow:hidden\">\n  <div style=\"background:#DEDAD3;padding:8px 12px 0;display:flex;align-items:flex-end;gap:8px\">\n    <div style=\"display:flex;gap:6px;padding:0 6px 10px\"><span style=\"width:12px;height:12px;border-radius:50%;background:#C9C4BC;display:inline-block\"></span><span style=\"width:12px;height:12px;border-radius:50%;background:#C9C4BC;display:inline-block\"></span><span style=\"width:12px;height:12px;border-radius:50%;background:#C9C4BC;display:inline-block\"></span></div>\n    <div style=\"padding:8px 14px;font-size:12px;color:#525B66\">Psyflo — Authorizations</div>\n    <div style=\"background:#F8F6F2;border-radius:8px 8px 0 0;padding:8px 14px;font-size:12px;font-weight:500;display:flex;gap:8px;align-items:center\"><span style=\"width:14px;height:14px;border-radius:3px;background:#8E99A6;display:inline-block\"></span>Lauris Online — CMHRS Continued Stay Request</div>\n  </div>\n  <div style=\"background:#F8F6F2;padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #D9D4CC\">\n    <div style=\"flex:1;background:#fff;border:1px solid #D9D4CC;border-radius:999px;padding:6px 14px;font-size:12px;color:#525B66\">https://…laurisonline…/consumers/3310/session/sra-continued</div>\n    <div style=\"display:flex;align-items:center;gap:6px;background:#151B24;color:#fff;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600\"><span style=\"width:8px;height:8px;border-radius:50%;background:#F0B44C;display:inline-block\"></span>psyflo · on</div>\n  </div>\n\n  <div style=\"flex:1;display:flex;min-height:0\">\n    <div class=\"ef\" style=\"flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:#F2F3F5\">\n      <div style=\"background:#2F3A4A;color:#fff;padding:9px 16px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700\"><span style=\"color:#E0A030\">»</span> Lauris Online <span style=\"margin-left:auto;font-weight:400;font-size:11px;color:#C8CFD8\">Switch to Classic · Sign Out</span></div>\n      <div style=\"flex:1;display:flex;min-height:0\">\n        <nav aria-label=\"EHR menu (schematic)\" style=\"flex:0 0 170px;background:#2F3A4A;padding:6px 0;display:flex;flex-direction:column\">\n          <div class=\"lnav\">Consumers</div><div class=\"lnav\">Authorizations</div><div class=\"lnav\">Approvals</div><div class=\"lnav on\">Add Session</div><div class=\"lnav\">Saved Session<span class=\"b\">2</span></div><div class=\"lnav\">Reports</div><div class=\"lnav\">User Information</div><div class=\"lnav\">Time Tracker</div>\n          <div style=\"border-top:1px solid #46525F;margin:8px 0\"></div>\n          <div class=\"lnav\">Forms to Approve<span class=\"b\">6</span></div><div class=\"lnav\">Rejected Forms<span class=\"b\">1</span></div><div class=\"lnav\">Consumers w/o Authorizations<span class=\"b\">3</span></div>\n        </nav>\n        <div style=\"flex:1;min-width:0;padding:12px 20px;overflow:hidden\">\n          <div style=\"display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #DDE1E6;border-radius:4px;padding:8px 14px\">\n            <div style=\"width:36px;height:36px;border-radius:50%;background:#DDE1E6\"></div>\n            <div><div style=\"font-weight:700;font-size:15px;color:#1F3B6B\">M.R.</div><div style=\"font-size:11px;color:#666\">Harvest # 3310 · Campbell County · ES-1 · in service since Feb 2026 · authorization Aug 18 – Nov 13 · Clinician: J. Perez, LPC</div></div>\n            <div style=\"margin-left:auto;font-size:12px;color:#1F6FBF;font-weight:700\">27 units available · renew by Nov 13</div>\n          </div>\n          <div style=\"display:flex;gap:18px;margin:6px 0 8px\"><span class=\"tab\">General Information</span><span class=\"tab\">Authorization Information</span><span class=\"tab\">Documents</span><span class=\"tab on\">Active File</span><span class=\"tab\">Medications</span><span class=\"tab\">Allergies</span></div>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\"><label style=\"margin:0\">Session entry</label><div class=\"in\" style=\"min-width:300px\">CMHRS Continued Stay Request · TDT (H2016)</div><span style=\"font-size:11px;color:#666\">Add Session · 10/29/2026 · J. Perez, LPC</span></div>\n\n          <div style=\"display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:10px;margin-bottom:8px\">\n            <div><label>Member</label><div class=\"in g\">M.R. · Medicaid # on file</div></div>\n            <div><label>Current authorization</label><div class=\"in g\">Anthem · 110 units · Aug 18 – Nov 13</div></div>\n            <div><label>Units used</label><div class=\"in g\">83 of 110 · 3 per school day</div></div>\n            <div><label>Request</label><div class=\"in a\">Nov 16 – Feb 13 · 150 units · 15 h/wk</div></div>\n          </div>\n          <div style=\"display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;margin-bottom:8px\">\n            <div><label>Progress toward goals (last 30 days)</label><div class=\"in a\" style=\"min-height:72px\">In the last 30 days M.R. used a taught strategy before leaving the room in 3 of 5 escalations, up from 1 of 6 in the prior period. On-task time in math rose from about 10 to 15 of 30 minutes with a visual timer and two re-entry prompts. He needed staff presence to return to task every school day.</div></div>\n            <div><label>Continued need · risk</label><div class=\"in a\" style=\"min-height:72px\">Two escalations still ended in physical aggression or elopement (Oct 21 shove at lunch; Oct 6 elopement with 1 day ISS), both in unstructured time. ISP changed Oct 22: lunch and transitions now carry a named staff member and a pre-set regulation break; the safety plan was reviewed with the guardian.</div></div>\n          </div>\n          <div style=\"display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;margin-bottom:8px\">\n            <div><label>Care coordination</label><div class=\"in a\" style=\"min-height:58px\">Monthly contact with the school counselor (Oct 1, Sep 3, Aug 29) and pediatrician; IEP review scheduled Nov 4 at Harvest's request. No medication change.</div></div>\n            <div><label>Family involvement</label><div class=\"in a\" style=\"min-height:58px\">Grandmother (guardian) joined 11 of 12 weekly calls; practiced the calm-down corner at home. Continuing need: consistent bedtime routine.</div></div>\n            <div><label>Barriers to treatment</label><div class=\"in a\" style=\"min-height:58px\">Unstructured periods (lunch, transitions) remain the highest-risk time of day. Children with severe behavioural dysregulation are at increased risk of academic failure and social rejection (Evans et al., J. Child Psychol. Psychiatry, 2024).</div></div>\n          </div>\n          <div style=\"display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;margin-bottom:8px\">\n            <div><label>Goal 1 (from ISP)</label><div class=\"in g\" style=\"min-height:40px\">Use a taught strategy before leaving the room, 4 of 5 · progressing</div></div>\n            <div><label>Goal 2 (from ISP)</label><div class=\"in g\" style=\"min-height:40px\">Peer conflict without physical contact, 4 of 5 · progressing</div></div>\n            <div><label>Goal 3 (from ISP)</label><div class=\"in g\" style=\"min-height:40px\">Follow directions first time, 4 of 5 · <span style=\"color:#8A2E1C\">not addressed in 6 weeks</span></div></div>\n          </div>\n          <div style=\"display:flex;gap:8px;margin-top:4px;align-items:center\">\n            <button class=\"btn o\" style=\"font-family:Arial,sans-serif;border-radius:3px;min-height:32px\">Save Form Data</button><button class=\"btn o\" style=\"font-family:Arial,sans-serif;border-radius:3px;min-height:32px\">Process Form</button>\n            \n          </div>\n        </div>\n      </div>\n    </div>\n\n    <aside style=\"flex:0 0 400px;background:#fff;border-left:1px solid #D9D4CC;display:flex;flex-direction:column;overflow:hidden\">\n      <div style=\"background:#151B24;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px\">\n        <svg role=\"img\" aria-label=\"psyflo\" viewBox=\"0 0 3191 1060\" width=\"78\" height=\"26\"><g transform=\"translate(-6.0,780.0) scale(1,-1)\"><path d=\"M66 -220V504H186L201 434Q217 456 239.0 474.5Q261 493 291.5 504.5Q322 516 363 516Q434 516 488.0 481.0Q542 446 573.5 386.5Q605 327 605 251Q605 175 573.0 115.5Q541 56 487.0 22.0Q433 -12 364 -12Q308 -12 267.5 8.5Q227 29 201 65V-220ZM332 106Q372 106 402.5 124.0Q433 142 450.0 175.0Q467 208 467 251Q467 294 450.0 327.5Q433 361 402.5 379.5Q372 398 332 398Q293 398 262.5 379.5Q232 361 214.5 328.0Q197 295 197 252Q197 209 214.5 175.5Q232 142 262.5 124.0Q293 106 332 106Z\" fill=\"#FFFFFF\"></path></g><g transform=\"translate(624.0,780.0) scale(1,-1)\"><path d=\"M272 -12Q203 -12 152.0 10.0Q101 32 72.0 71.0Q43 110 39 159H173Q178 140 190.0 124.5Q202 109 222.0 100.0Q242 91 270 91Q297 91 314.0 98.5Q331 106 339.5 119.0Q348 132 348 146Q348 167 336.0 178.5Q324 190 301.0 197.0Q278 204 245 211Q209 218 174.5 228.5Q140 239 113.0 255.0Q86 271 70.0 296.0Q54 321 54 358Q54 403 78.0 438.5Q102 474 148.0 495.0Q194 516 259 516Q350 516 403.0 475.0Q456 434 466 362H339Q333 385 31 radius:999px\">yellow · Psyflo typed — check it</span></div>\n\n      <div style=\"padding:12px 16px;display:flex;flex-direction:column;gap:10px;overflow:auto\">\n        <div style=\"border:1px solid #217A78;border-radius:10px;padding:10px 12px;background:#F2F9F8\">\n          <div style=\"font-size:13px\"><b>Draft ready for M.R.</b> — written from {{nDpn}} daily notes, {{nWk}} weekly guardian calls, {{nMo}} monthly collaterals and the internal quarterly, in the range you pick. History from Harvest's Lauris export.</div>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:8px\" role=\"group\" aria-label=\"Date range\"><button class=\"{{t30}}\" onClick=\"{{pick30}}\">Last 30 days</button><button class=\"{{tAll}}\" onClick=\"{{pickAll}}\">Whole period</button><button class=\"tog\">Pick dates…</button></div>\n          <div style=\"display:flex;gap:8px;margin-top:10px\"><button class=\"btn p\" style=\"flex:1\">Fill the 6 yellow boxes</button><button class=\"btn o\">One at a time</button></div>\n        </div>\n\n        <div>\n          <div style=\"font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600;margin-bottom:4px\">Counted across the notes in range</div>\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:12px;border:1px solid #E6E1D9;border-radius:8px;padding:8px 10px\"><span>Physical aggression toward peers</span><b>{{kAgg}}</b><span>Eloped from the room or building</span><b>{{kElope}}</b><span>Used a taught strategy first</span><b>{{kStrat}}</b><span>Positive peer interaction noted</span><b>{{kPos}}</b><span>Safety-care hold</span><b>{{kHold}}</b></div>\n          \n        </div>\n\n        <div>\n          <div style=\"font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600;margin-bottom:4px\">Progress · edit here, every sentence has a source</div>\n          <div class=\"par\">In the last 30 days M.R. used a taught strategy before leaving the room in <b>3 of 5</b> escalations<sup>3,4,6</sup>, up from 1 of 6 in the prior period<sup>7</sup>. On-task time in math rose from about 10 to 15 of 30 minutes with a visual timer and two re-entry prompts<sup>5</sup>.</div>\n        </div>\n\n        <div>\n          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:4px\"><div style=\"font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600\">Continued need · a family disclosure is in play</div></div>\n          <div class=\"par\">Two escalations still ended in physical aggression or elopement (Oct 21; Oct 6)<sup>4,6</sup>, both in unstructured time. ISP changed Oct 22<sup>4,2</sup>. <span class=\"conf\">{{confText}}</span></div>\n          <div style=\"display:flex;gap:6px;margin-top:6px;align-items:center\"><span style=\"font-size:12px;color:#525B66;flex:1\">Send the household context to the payer?</span><button class=\"{{bInc}}\" onClick=\"{{include}}\">Include</button><button class=\"{{bExc}}\" onClick=\"{{exclude}}\">Exclude</button></div>\n          \n        </div>\n\n        <div>\n          <div style=\"font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600;margin-bottom:2px\">Sources · {{nSrc}}</div>\n          <div class=\"stamp\" style=\"border-top:0\"><div>1</div><div>Monthly collateral · school counselor · Oct 1</div></div>\n          <div class=\"stamp\"><div>2</div><div>Weekly guardian call · Oct 22</div></div>\n          <div class=\"stamp\"><div>3–6</div><div>Daily notes · Oct 6, 14, 21, 27 (K. Hale)</div></div>\n          <div class=\"stamp\"><div>7</div><div>Prior continued-stay request · Aug 14</div></div>\n        </div>\n\n        \n        \n      </div>\n    </aside>\n  </div>\n</div>\n",note:"HOW THE DATA GETS IN · stay\n\nCaptured: nothing new. The clinician opens the CMHRS Continued Stay form in Lauris; the panel assembles the draft from the daily notes, weekly guardian calls, monthly collaterals and the internal quarterly already copied to Psyflo at Process Form, in the date range the clinician picks (last 30 days by default; insurers want recent dates). Lauris fills the header, current authorization, units used and goals (green).\n\nFlows: keyword counts and every drafted sentence cite the note they came from; the clinician edits in the panel, decides whether a family disclosure goes to the payer (excluded text stays in the chart), then Fill types the paragraphs into the yellow boxes. Process Form → Forms to Approve → signature with NPI → Psyflo takes the signed copy and prepares the packet → the clinician presses Send in the app.\n\nPopulates: the Lauris form (the record); the Authorizations row and clocks; the next peer-to-peer brief or information-request reply if the payer pushes back.\n\nEngineering: same write path as the initial SRA (form boxes only, never a submit); this used to be a separate app screen and was moved into the extension because the continued-stay SRA is a Lauris form.",make:(function(){ 
return class Component extends DCLogic {
  constructor(p){ super(p); this.state = { range: '30', conf: 'include' }; }
  renderVals() {
    const r30 = this.state.range === '30';
    const inc = this.state.conf === 'include';
    const K = r30 ? {kAgg:'3',kElope:'2',kStrat:'3 of 5',kPos:'11',kHold:'0'} : {kAgg:'9',kElope:'5',kStrat:'7 of 14',kPos:'24',kHold:'1'};
    return Object.assign(K, {
      t30: 'tog' + (r30 ? ' on' : ''), tAll: 'tog' + (r30 ? '' : ' on'),
      pick30: () => this.setState({range:'30'}), pickAll: () => this.setState({range:'all'}),
      nDpn: r30 ? 21 : 61, nWk: r30 ? 4 : 12, nMo: r30 ? 1 : 3, nSrc: r30 ? '7 cited' : '19 cited',
      confText: inc ? 'The guardian reported a change in the household on Oct 16 that coincided with the Oct 21 incident; the clinical team has adjusted supports accordingly.' : '[Household context excluded — the payer sees the incident and the ISP change, not why.]',
      bInc: 'tog' + (inc ? ' on' : ''), bExc: 'tog' + (inc ? '' : ' on'),
      include: () => this.setState({conf:'include'}), exclude: () => this.setState({conf:'exclude'})
    });
  }
}
 })()},

>Edit the reply</a><a class=\"btn p\" href=\"#send\">Review and send</a></div>\n      </div>\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n        <section class=\"card\" style=\"flex:2 1 380px;min-width:0;padding:16px 20px\">\n          <h2 style=\"margin:0 0 8px;font-size:15px;font-weight:600\">What Anthem asked</h2>\n          <div class=\"fld\" style=\"font-style:italic;margin-bottom:12px\">\"Please provide additional clinical information to support medical necessity: (1) frequency and duration of physical aggression within the last 30 days; (2) documentation of prior outpatient treatment and outcome; (3) current IEP supports and why they are insufficient.\"</div>\n          <h2 style=\"margin:0 0 8px;font-size:15px;font-weight:600\">What happened</h2>\n          <div class=\"step\" style=\"border-top:0\"><div class=\"dt\">Oct 21</div><div>Initial request sent via Availity (150 units)</div></div>\n          <div class=\"step\"><div class=\"dt\">Oct 28 · 5:40 pm</div><div>Jordan opened Availity; the extension read Anthem's information request and started the 24-hour clock</div></div>\n          <div class=\"step\"><div class=\"dt\">Oct 28 · 5:41 pm</div><div>Reply drafted from the request already sent + the last 30 days of notes; Jordan emailed and texted</div></div>\n          <div class=\"step\"><div class=\"dt\">Today · 5:40 pm</div><div><b>Deadline.</b> Missed = the request is decided on what they have.</div></div>\n        </section>\n\n        <section class=\"card\" style=\"flex:3 1 560px;min-width:0;padding:18px 22px 22px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;border-bottom:1px solid #E6E1D9;padding-bottom:10px\">\n            <h2 style=\"margin:0;font-size:15px;font-weight:700\">The reply, as it will be sent</h2>\n            <span style=\"font-size:12px;color:#525B66\">drafted by Psyflo · you check it, then send</span>\n            <div style=\"margin-left:auto\"><span class=\"chip y\">draft</span></div>\n          </div>\n\n          <div style=\"border:1px solid #F0B44C;background:#FFFDF7;border-radius:10px;padding:22px 26px;margin-top:12px;font-size:13px;line-height:1.55\">\n            <div style=\"display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:#525B66;font-size:12px\">\n              <div><b style=\"color:#151B24\">Harvest Outreach Center</b><br>Lynchburg City · Group NPI and Tax ID on file<br>Clinical contact: Jordan Perez, LPC · phone on file</div>\n              <div style=\"text-align:right\">October 29, 2026<br>To: Anthem HealthKeepers Plus · Utilization Management<br>Via Availity · case reference on file</div>\n            </div>\n            <div style=\"margin-top:14px\"><b>Re:</b> Additional information requested Oct 28, 2026 · Member K.T. · Medicaid ID on file · DOB on file<br><b>Service:</b> Therapeutic Day Treatment, H2016 · initial request submitted Oct 21, 2026 (150 units, Nov 3 – Jan 30)</div>\n            <p style=\"margin:14px 0 10px\">Thank you for your request of October 28. The three items you asked for are below. All information is drawn from the member's record and from the request already submitted.</p>\n            <p style=\"margin:0 0 10px\"><b>1. Frequency and duration of physical aggression within the last 30 days.</b> Between September 29 and October 28, K.T. was physically aggressive toward peers on seven dated occasions (October 2, 6, 9, 14, 17, 22 and 27)<sup>1</sup>, each lasting 5–15 minutes at moderate intensity and requiring staff de-escalation<sup>1</sup>. Two of these incidents resulted in office referrals<sup>2</sup>. This frequency is unchanged from the 2–3 times per week reported at screening<sup>3</sup>.</p>\n            <p style=\"margin:0 0 10px\"><b>2. Prior outpatient treatment and outcome.</b> K.T. attended weekly outpatient counseling at Piedmont Counseling from January to April 2026, nine sessions<sup>4</sup>. Treatment ended when the family lost transportation. The school's incident count did not decrease during or after that period (four incidents in March, five in April)<sup>2</sup>.</p>\n            <p style=\"margin:0 0 10px\"><b>3. Current IEP supports and why they are insufficient.</b> K.T.'s IEP, reviewed March 2026, provides a behaviour plan, preferential seating and a check-in/check-out system<sup>5</sup>. These supports are classroom-based and delivered by school personnel; they do not provide daily clinical intervention or de-escalation during unstructured periods, where five of the seven incidents above occurred<sup>1</sup>. TDT adds licensed clinical oversight and three units of direct intervention per school day, which the IEP cannot provide<sup>3</sup>.</p>\n            <p style=\"margin:0 0 14px\">Please contact me with any further questions.</p>\n            <div style=\"color:#525B66\">Sincerely,</div>\n            <div style=\"margin-top:18px;border-top:1px solid #C9CDD3;width:260px;padding-top:4px\"><b>Jordan Perez, LPC</b><br><span style=\"color:#525B66;font-size:12px\">Assistant Clinical Support Supervisor · license and NPI on file · signed on send</span></div>\n          </div>\n\n          <div style=\"border:1px solid #F0B44C;background:#FFFDF7;border-radius:8px;padding:10px 12px;font-size:13px;margin:12px 0\"><b>Not added:</b> anything new. Last month, giving Sentara more than they asked for produced a smaller award. This reply answers the three questions and stops.</div>\n\n          <div id=\"send\" style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;border:1px solid #151B24;border-radius:10px;padding:14px 16px;background:#F8F6F2\">\n            <div style=\"flex:1;min-width:260px;font-size:13px\"><b>Sent by a clinician, on Availity, in their own login.</b></div>\n            <div style=\"display:flex;gap:8px\"><a class=\"btn o\" href=\"Authorizations.dc.html\">Edit</a><a class=\"btn p\" href=\"Authorizations.dc.html\">Open in Availity and send</a></div>\n          </div>\n          \n        </section>\n      </div>\n    </div>\n  </main>\n</div>\n",note:"HOW THE DATA GETS IN · asks for more\n\nCaptured: the request arrives on Availity (read by the extension when a staff member is logged in) or by fax (Sfax, OCR). The 24-hour clock starts when it is read; Harvest checks Availity daily for open requests.\n\nFlows: Psyflo pairs the insurer's questions with the request already sent and the last 30 days of notes → a reply letter.\n\nPopulates: pasted into the Availity case from the clinician's login, or faxed via Sfax, after a clinician approves. Logged on the request.\n\nEngineering: the reply is limited to facts already in the submitted packet plus dated notes; nothing new is introduced.",make:(function(){
