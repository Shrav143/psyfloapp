{id:"ext-screening",file:"ExtScreening.dc.html",title:"14 · Scribe · screening call · Oct 16",w:1440,fixed:true,css:"\nbody{margin:0;background:#E9E6E0;color:#151B24;font-family:'DM Sans',system-ui,sans-serif;font-size:14px;line-height:1.45}\na{color:#217A78}a:hover{color:#15605E}\n*{box-sizing:border-box}\n.ef{font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#222}\n.ef label{display:block;font-size:11px;color:#666;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}\n.ef .in{border:1px solid #C9CDD3;background:#fff;padding:6px 8px;border-radius:3px;min-height:30px}\n.ef .in.g{background:#E6F4EA}\n.lnav{display:flex;align-items:center;gap:9px;padding:8px 14px;font-size:12px;color:#C8CFD8}\n.lnav.on{background:#3C4756;color:#fff;border-left:3px solid #E0A030;padding-left:11px}\n.lnav .b{margin-left:auto;background:#C2410C;color:#fff;border-radius:999px;font-size:10px;padding:0 6px;font-weight:700}\n.tab{font-size:12px;color:#555;padding:8px 0;border-bottom:2px solid transparent}\n.tab.on{color:#222;font-weight:700;border-bottom-color:#E0A030}\n.ef table{width:100%;border-collapse:collapse;font-size:12px;background:#fff}\n.ef th,.ef td{border:1px solid #CFCFCF;padding:5px 7px;text-align:left;vertical-align:top}\n.ef th{background:#EDEDED;font-weight:700}\n.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}\n.chip.r{background:#FBE9E4;color:#8A2E1C}.chip.y{background:#FCEFD0;color:#6F4A05}.chip.g{background:#DDF1EF;color:#15605E}.chip.n{background:#EEEBE5;color:#3E4652}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:8px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;border:1px solid transparent;white-space:nowrap}\n.btn.p{background:#217A78;color:#fff}.btn.p:hover{background:#15605E;color:#fff}\n.btn.o{background:#fff;color:#151B24;border-color:#D9D4CC}.btn.o:hover{background:#F3F0EA;color:#151B24}\n.cr{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid #EFEBE4;font-size:12px}\n.cr svg{flex:0 0 18px;margin-top:1px}\n.cr b{display:block;font-size:13px}\n.cr .ask{margin-top:3px;color:#6F4A05;font-weight:600}\n.sec .chip{white-space:normal;text-align:right;max-width:60%}\n.stamp>div{min-width:0}\n",tpl:"\n\n\n<div style=\"width:1440px;height:1080px;display:flex;flex-direction:column;background:#E9E6E0;overflow:hidden\">\n  <div style=\"background:#DEDAD3;padding:8px 12px 0;display:flex;align-items:flex-end;gap:8px\">\n    <div style=\"display:flex;gap:6px;padding:0 6px 10px\"><span style=\"width:12px;height:12px;border-radius:50%;background:#C9C4BC;display:inline-block\"></span><span style=\"width:12px;height:12px;border-radius:50%;background:#C9C4BC;display:inline-block\"></span><span style=\"width:12px;height:12px;border-radius:50%;background:#C9C4BC;display:inline-block\"></span></div>\n    <div style=\"padding:8px 14px;font-size:12px;color:#525B66\">Lauris Online — Session Entry · Daily Progress Note</div>\n    <div style=\"background:#F8F6F2;border-radius:8px 8px 0 0;padding:8px 14px;font-size:12px;font-weight:500;display:flex;gap:8px;align-items:center\"><span style=\"width:14px;height:14px;border-radius:3px;background:#8E99A6;display:inline-block\"></span>Lauris Online — Admission Screening</div>\n  </div>\n  <div style=\"background:#F8F6F2;padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #D9D4CC\">\n    <div style=\"flex:1;background:#fff;border:1px solid #D9D4CC;border-radius:999px;padding:6px 14px;font-size:12px;color:#525B66\">https://…laurisonline…/consumers/new/session/screening</div>\n    <div style=\"display:flex;align-items:center;gap:6px;background:#151B24;color:#fff;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600\"><span style=\"width:8px;height:8px;border-radius:50%;background:#F0B44C;display:inline-block\"></span>psyflo · on</div>\n  </div>\n\n  <div style=\"flex:1;display:flex;min-height:0\">\n    <!-- Schematic of the EHR (structure and labels only, not its styling) -->\n    <div class=\"ef\" style=\"flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:#F2F3F5\">\n      <div style=\"background:#2F3A4A;color:#fff;padding:9px 16px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700\"><span style=\"color:#E0A030\">»</span> Lauris Online <span style=\"margin-left:auto;font-weight:400;font-size:11px;color:#C8CFD8\">Switch to Classic · Sign Out</span></div>\n      <div style=\"flex:1;display:flex;min-height:0\">\n        <nav aria-label=\"EHR menu (schematic)\" style=\"flex:0 0 170px;background:#2F3A4A;padding:6px 0;display:flex;flex-direction:column\">\n          <div class=\"lnav\">Consumers</div><div class=\"lnav\">Authorizations</div><div class=\"lnav\">Approvals</div><div class=\"lnav on\">Add Session</div><div class=\"lnav\">Saved Session<span class=\"b\">2</span></div><div class=\"lnav\">Reports</div><div class=\"lnav\">User Information</div><div class=\"lnav\">Time Tracker</div>\n          <div style=\"border-top:1px solid #46525F;margin:8px 0\"></div>\n          <div class=\"lnav\">Forms to Approve<span class=\"b\">6</span></div><div class=\"lnav\">Rejected Forms<span class=\"b\">1</span></div><div class=\"lnav\">Consumers w/o Authorizations<span class=\"b\">3</span></div>\n        </nav>\n        <div style=\"flex:1;min-width:0;padding:12px 20px;overflow:hidden\">\n          <div style=\"display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #DDE1E6;border-radius:4px;padding:8px 14px\">\n            <div style=\"width:36px;height:36px;border-radius:50%;background:#DDE1E6\"></div>\n            <div><div style=\"font-weight:700;font-size:15px;color:#1F3B6B\">New consumer (referral)</div><div style=\"font-size:11px;color:#666\">Lynchburg City · MS-2 · referred by school counselor 10/13 · Screener: J. Perez, LPC · call started 2:04 pm</div></div>\n            <div style=\"margin-left:auto;font-size:12px;color:#C2410C;font-weight:700\">No authorizations available</div>\n          </div>\n          <div style=\"display:flex;gap:18px;margin:6px 0 8px\"><span class=\"tab on\">General Information</span><span class=\"tab\">Authorization Information</span><span class=\"tab\">Documents</span><span class=\"tab\">Active File</span><span class=\"tab\">Medications</span><span class=\"tab\">Allergies</span></div>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\"><label style=\"margin:0\">Session entry</label><div class=\"in\" style=\"min-width:260px\">Admission Screening (phone)</div><span style=\"font-size:11px;color:#666\">Add Session · 10/16/2026</span></div>\n      <div style=\"display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;margin-bottom:8px\">\n        <div><label>Guardian on the call</label><div class=\"in g\">Grandmother (legal guardian) · (434) 555-0147</div></div>\n        <div><label>Medicaid</label><div class=\"in g\">Humana Healthy Horizons · ID on file · checked today</div></div>\n        <div><label>IEP</label><div class=\"in g\">Yes — copy attached to referral; last review Mar 2026</div></div>\n      </div>\n      <label>Behaviours reported (frequency · duration · intensity)</label>\n      <table style=\"margin-bottom:12px\">\n        <tr><th style=\"width:28%\">Behaviour</th><th>Y/N</th><th>Frequency</th><th>Duration</th><th>Intensity</th><th>Example given</th></tr>\n        <tr><td>Physical aggression toward peers</td><td>Y</td><td>2–3× / week</td><td>5–20 min</td><td>Moderate</td><td>Shoved a classmate at lunch; 2 office referrals this month</td></tr>\n        <tr><td>Leaving the classroom / building</td><td>Y</td><td>~1× / week</td><td>10–30 min</td><td>High</td><td>Left to the parking lot 10/6 — 1 day ISS</td></tr>\n        <tr><td>Verbal aggression / threats</td><td>Y</td><td>Daily</td><td>&lt;5 min</td><td>Low–mod</td><td>—</td></tr>\n        <tr><td>Self-harm statements</td><td>N</td><td></td><td></td><td></td><td>Asked directly; grandmother says no</td></tr>\n        <tr><td>Withdrawal / internalizing</td><td style=\"color:#8A2E1C;font-weight:700\">?</td><td></td><td></td><td></td><td>Not yet asked</td></tr>\n      </table>\n      <div style=\"display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;margin-bottom:12px\">\n        <div><label>Prior / current services (provider · dates · outcome)</label><div class=\"in\" style=\"min-height:64px\">School counseling, weekly, since Sep 2025 — ongoing<br>Outpatient therapy — \"a while ago\" — <span style=\"color:#8A2E1C\">dates and outcome unknown</span></div></div>\n        <div><label>School coordination to date</label><div class=\"in\" style=\"min-height:64px\">Behaviour interventionist 2× / week since Sep; check-in/check-out; IEP accommodations in place</div></div>\n      </div>\n      <label>Narrative summary</label>\n      <div class=\"in\" style=\"min-height:40px;color:#777\">Drafts from the recording when the call ends — not typed during it.</div>\n      <div style=\"display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;margin-top:12px\">\n        <div><label>Meets admission criteria?</label><div class=\"in\">☐ Yes &nbsp; ☐ No &nbsp; (decide at the end of the call)</div></div>\n        <div><label>Preliminary diagnosis</label><div class=\"in\">F91.3 (prelim.) — <span style=\"color:#777\">tagged pre-contact; CNA re-evaluates</span></div></div>\n      </div>\n\n          <div style=\"display:flex;gap:8px;margin-top:8px;align-items:center\">\n            <button class=\"btn o\" style=\"font-family:Arial,sans-serif;border-radius:3px;min-height:32px\">Save Form Data</button><button class=\"btn o\" style=\"font-family:Arial,sans-serif;border-radius:3px;min-height:32px\">Process Form</button>\n            \n          </div>\n        </div>\n      </div>\n    </div>\n\n    <aside style=\"flex:0 0 400px;background:#fff;border-left:1px solid #D9D4CC;display:flex;flex-direction:column;overflow:hidden\">\n      <div style=\"background:#151B24;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px\">\n        <svg role=\"img\" aria-label=\"psyflo\" viewBox=\"0 0 3191 1060\" width=\"78\" height=\"26\"><g transform=\"translate(-6.0,780.0) scale(1,-1)\"><path d=\"M66 -220V504H186L201 434Q217 456 239.0 474.5Q261 493 291.5 504.5Q322 516 363 516Q434 516 488.0 481.0Q542 446 573.5 386.5Q605 327 605 251Q605 175 573.0 115.5Q541 56 487.0 22.0Q433 -12 364 -12Q308 -12 267.5 8.5Q227 29 201 65V-220ZM332 106Q372 106 402.5 124.0Q433 142 450.0 175.0Q467 208 467 251Q467 294 450.0 327.5Q433 361 402.5 379.5Q372 398 332 398Q293 398 262.5 379.5Q232 361 214.5 328.0Q197 295 197 252Q197 209 214.5 175.5Q232 142 262.5 124.0Q293 106 332 106Z\" fill=\"#FFFFFF\"></path></g><g transform=\"translate(624.0,780.0) scale(1,-1)\"><path d=\"M272 -12Q203 -12 152.0 10.0Q101 32 72.0 71.0Q43 110 39 159H173Q178 140 190.0 124.5Q202 109 222.0 100.0Q242 91 270 91Q297 91 314.0 98.5Q331 106 339.5 119.0Q348 132 348 146Q348 167 336.0 178.5Q324 190 301.0 197.0Q278 204 245 211Q209 218 174.5 228.5Q140 239 113.0 255.0Q86 271 70.0 296.0Q54 321 54 358Q54 403 78.0 438.5Q102 474 148.0 495.0Q194 516 259 516Q350 516 403.0 475.0Q456 434 466 362H339Q333 385 312.5 398.5Q292 412 258 412Q222 412 203.0 399.0Q184 386 184 365Q184 351 196.5 340.0Q209 329 232.0 321.5Q255 314 288 307Q346 295 390.0 279.5Q434 264 459.0 235.5Q484 207 484 153Q484 105 458.0 67.5Q432 30 384.5 9.0Q337 -12 272 -12Z\" fill=\"#FFFFFF\"></path></g><g transform=\"translate(1105.0,780.0) scale(1,-1)\"><path d=\"M130 -220 252 56H222L20 504H167L311 179L441 504H584L273 -220Z\" fill=\"#FFFFFF\"></path></g><g transform=\"translate(1734.0,780.0) scale(1,-1)\"><path d=\"M89 0V549Q89 612 110.0 649.0Q131 686 170.5 703.0Q210 720 263 720H325V605H283Q251 605 237.5 592.5Q224 580 224 549V0ZM20 391V504H333V391Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2080.0,780.0) scale(1,-1)\"><path d=\"M66 0V720H201V0Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2322.0,780.0) scale(1,-1)\"><path d=\"M304 -12Q232 -12 174.5 21.5Q117 55 83.5 114.5Q50 174 50 251Q50 330 83.5 389.5Q117 449 175.0 482.5Q233 516 305 516Q378 516 435.5 482.5Q493 449 526.5 389.5Q560 330 560 252Q560 174 526.5 114.5Q493 55 435.0 21.5Q377 -12 304 -12ZM304 105Q338 105 364.5 121.0Q391 137 406.5 170.0Q422 203 422 252Q422 301 406.5 333.5Q391 366 364.5 382.5Q338 399 305 399Q273 399 246.0 382.5Q219 366 203.5 333.5Q188 301 188 252Q188 203 203.5 170.0Q219 137 245.5 121.0Q272 105 304 105Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2922.0,780.0) scale(1,-1)\"><path d=\"M127 -5Q89 -5 66.0 17.5Q43 40 43 73Q43 106 66.0 128.5Q89 151 127 151Q163 151 186.0 128.5Q209 106 209 73Q209 40 186.0 17.5Q163 -5 127 -5Z\" fill=\"#F0B44C\"></path></g></svg>\n        <div style=\"font-size:12px;color:#C9D1D6\">Scribe · Admission screening · Jordan Perez, LPC</div>\n      </div>\n<div style=\"display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid #EFEBE4;font-size:11px;color:#151B24\"><span style=\"background:#E6F4EA;border:1px solid #BFE3CB;padding:2px 9px;border-radius:999px\">green · already in Lauris</span><span style=\"background:#FFF8E6;border:1px solid #E8C56A;padding:2px 9px;border-radius:999px\">yellow · Psyflo typed — check it</span></div>\n\n      <div style=\"padding:12px 16px;display:flex;flex-direction:column;gap:10px;overflow:auto\">\n        <div style=\"display:flex;align-items:center;gap:10px;border:1px solid #BFE0CC;border-radius:10px;padding:8px 12px;background:#E9F4EE;font-size:12px\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#217A78\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M9 12l2 2 4-4\"></path></svg><div><b>Filled before you picked up:</b> 6 boxes from the referral and the family link — guardian, phone, language, Medicaid ID, IEP. Check them.</div></div>\n        <div style=\"display:flex;align-items:center;gap:10px;border:1px solid #E6E1D9;border-radius:10px;padding:8px 12px;background:#F8F6F2\">\n          <span style=\"width:10px;height:10px;border-radius:50%;background:#B9541F;display:inline-block\"></span>\n          <div style=\"flex:1;font-size:12px\"><b>Recording the call · 38 min</b> · consent read at 2:04 pm · <b>19 boxes</b> drafted when you hang up</div>\n        </div>\n        <div style=\"display:flex;align-items:baseline;gap:8px\"><div style=\"font-size:15px;font-weight:600\">Before you hang up</div><span class=\"chip y\">insurance needs 2 of 3 · we can show 1</span></div>\n        \n\n        <div style=\"font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600;margin-top:2px\">Insurance needs two of these three</div>\n        <div class=\"cr\" style=\"border-top:0\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#217A78\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M9 12l2 2 4-4\"></path></svg><div><b>Difficulty establishing or maintaining interpersonal relationships</b>We can show this: peer aggression 2–3×/wk, 5–20 min, moderate; 2 office referrals. <span style=\"color:#8A2E1C\">Still needs the school numbers:</span> unexcused absences this year · ISS days and OSS days past 6 months · classes taking / passing.<div class=\"ask\">Ask now: \"How many days has he been suspended since April?\"</div></div></div>\n        <div class=\"cr\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6F4A05\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 8v4M12 16h.01\"></path></svg><div><b>Documented repeated interventions that have not worked</b>Not shown yet. \"Outpatient a while ago\" will be read by the insurer as no prior service; school counseling does not count as a failed service.<div class=\"ask\">Ask now: who, when, how often, and whether it helped. If it was through other insurance, say so.</div></div></div>\n        <div class=\"cr\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#525B66\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke-dasharray=\"3 3\"></circle></svg><div><b>Cognitive ability to recognise danger to self or others</b>Not asked. Elopement to the parking lot (10/6) may support this — needs the guardian's words.</div></div>\n\n        <div style=\"font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600;margin-top:4px\">And one of these (level of care)</div>\n        <div class=\"cr\" style=\"border-top:0\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6F4A05\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 8v4M12 16h.01\"></path></svg><div><b>Risk of out-of-home placement or more restrictive setting</b>Partly: 1 day ISS, school asking about alternative placement. <div class=\"ask\">Ask now: \"Has the school talked about moving him to a different program?\"</div></div></div>\n\n        <div style=\"font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600;margin-top:4px\">Not yet asked</div>\n        <div class=\"cr\" style=\"border-top:0\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#8A2E1C\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M15 9l-6 6M9 9l6 6\"></path></svg><div><b>Internalizing: sleep, withdrawal, sadness, worries</b>Insurers often deny these because they \"can't see\" them. Asking now puts the answer on record with a date.</div></div>\n\n        <div style=\"display:flex;gap:6px;flex-wrap:wrap;font-size:12px\"><span class=\"chip g\">Summary · drafted after the call</span><span class=\"chip n\">Decision and diagnosis · yours</span><span class=\"chip y\">Then · Process Form</span></div>\n\n        <div style=\"display:flex;gap:8px;margin-top:auto\">\n          <button class=\"btn p\" style=\"flex:1\">Stop and draft the 19 boxes</button>\n          <button class=\"btn o\">Copy asks</button>\n        </div>\n        \n      </div>\n    </aside>\n  </div>\n</div>\n",note:"HOW THE DATA GETS IN · call\n\nHow the screener gets here: the same way as today — Add Session → Admission Screening in Lauris. Psyflo's to-do and the panel button open that form; either way it is the form they always use.\n\nCaptured: the LPC's call is recorded (consent read first). Psyflo transcribes it and pulls out each behaviour with frequency, duration and intensity, prior services, IEP, school coordination.\n\nFlows: before the call, the extension fills the guardian/Medicaid/IEP boxes (green) from the referral and family link. During the call: audio → transcript → fields → typed into the yellow boxes on the open form. The LPC checks and presses Process Form.\n\nPopulates: Lauris (official, after Process Form); Psyflo keeps the fields for the intake (6) and the initial request (8).\n\nEngineering: audio from a softphone or room mic; the extension writes only into boxes on the open form; audio deleted after processing.",make:(function(){ 
return class Component extends DCLogic {
  renderVals() { return {}; }
}

grid-template-columns:64px 1fr;gap:8px;font-size:12px;padding:4px 0;border-top:1px solid #EFEBE4}\n.sec .chip{white-space:normal;text-align:right;max-width:60%}\n.stamp>div{min-width:0}\n",tpl:"\n\n\n<div style=\"width:1440px;height:1080px;display:flex;flex-direction:column;background:#E9E6E0;overflow:hidden\">\n  <div style=\"background:#DEDAD3;padding:8px 12px 0;display:flex;align-items:flex-end;gap:8px\">\n    <div style=\"display:flex;gap:6px;padding:0 6px 10px\"><span style=\"width:12px;height:12px;border-radius:50%;background:#C9C4BC;display:inline-block\"></span><span style=\"width:12px;height:12px;border-radius:50%;background:#C9C4BC;display:inline-block\"></span><span style=\"width:12px;height:12px;border-radius:50%;background:#C9C4BC;display:inline-block\"></span></div>\n    <div style=\"padding:8px 14px;font-size:12px;color:#525B66\">Lauris Online — Admission Screening</div>\n    <div style=\"background:#F8F6F2;border-radius:8px 8px 0 0;padding:8px 14px;font-size:12px;font-weight:500;display:flex;gap:8px;align-items:center\"><span style=\"width:14px;height:14px;border-radius:3px;background:#8E99A6;display:inline-block\"></span>Lauris Online — Comprehensive Needs Assessment</div>\n  </div>\n  <div style=\"background:#F8F6F2;padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #D9D4CC\">\n    <div style=\"flex:1;background:#fff;border:1px solid #D9D4CC;border-radius:999px;padding:6px 14px;font-size:12px;color:#525B66\">https://…laurisonline…/consumers/4492/session/cna</div>\n    <div style=\"display:flex;align-items:center;gap:6px;background:#151B24;color:#fff;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600\"><span style=\"width:8px;height:8px;border-radius:50%;background:#F0B44C;display:inline-block\"></span>psyflo · on</div>\n  </div>\n\n  <div style=\"flex:1;display:flex;min-height:0\">\n    <!-- Schematic of the EHR (structure and labels only, not its styling) -->\n    <div class=\"ef\" style=\"flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:#F2F3F5\">\n      <div style=\"background:#2F3A4A;color:#fff;padding:9px 16px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700\"><span style=\"color:#E0A030\">»</span> Lauris Online <span style=\"margin-left:auto;font-weight:400;font-size:11px;color:#C8CFD8\">Switch to Classic · Sign Out</span></div>\n      <div style=\"flex:1;display:flex;min-height:0\">\n        <nav aria-label=\"EHR menu (schematic)\" style=\"flex:0 0 170px;background:#2F3A4A;padding:6px 0;display:flex;flex-direction:column\">\n          <div class=\"lnav\">Consumers</div><div class=\"lnav\">Authorizations</div><div class=\"lnav\">Approvals</div><div class=\"lnav on\">Add Session</div><div class=\"lnav\">Saved Session<span class=\"b\">2</span></div><div class=\"lnav\">Reports</div><div class=\"lnav\">User Information</div><div class=\"lnav\">Time Tracker</div>\n          <div style=\"border-top:1px solid #46525F;margin:8px 0\"></div>\n          <div class=\"lnav\">Forms to Approve<span class=\"b\">6</span></div><div class=\"lnav\">Rejected Forms<span class=\"b\">1</span></div><div class=\"lnav\">Consumers w/o Authorizations<span class=\"b\">3</span></div>\n        </nav>\n        <div style=\"flex:1;min-width:0;padding:12px 20px;overflow:hidden\">\n          <div style=\"display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #DDE1E6;border-radius:4px;padding:8px 14px\">\n            <div style=\"width:36px;height:36px;border-radius:50%;background:#DDE1E6\"></div>\n            <div><div style=\"font-weight:700;font-size:15px;color:#1F3B6B\">T.W.</div><div style=\"font-size:11px;color:#666\">Harvest # 4492 · Lynchburg City · MS-2 · Intake in person · guardian present · Clinician: J. Perez, LPC · QMHP: site supervisor</div></div>\n            <div style=\"margin-left:auto;font-size:12px;color:#C2410C;font-weight:700\">No authorizations available</div>\n          </div>\n          <div style=\"display:flex;gap:18px;margin:6px 0 8px\"><span class=\"tab\">General Information</span><span class=\"tab\">Authorization Information</span><span class=\"tab\">Documents</span><span class=\"tab on\">Active File</span><span class=\"tab\">Medications</span><span class=\"tab\">Allergies</span></div>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\"><label style=\"margin:0\">Session entry</label><div class=\"in\" style=\"min-width:300px\">Comprehensive Needs Assessment</div><span style=\"font-size:11px;color:#666\">Add Session · 10/20/2026 · 2 h 10 min elapsed</span></div>\n\n          <div style=\"display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;margin-bottom:8px\">\n            <div><label>Presenting issue / reason for referral</label><div class=\"in g\" style=\"min-height:52px\">Referred by MS-2 for physical and verbal aggression toward peers (6 dated incidents in 30 days), elopement from the building (Oct 6, ISS), and daily off-task behaviour. Copied from the referral and the screening call.</div></div>\n            <div><label>Prior services (provider · dates · outcome)</label><div class=\"in a\" style=\"min-height:52px\">Behaviour interventionist, MS-2, 2×/wk since Sep 2026 — ongoing, incidents unchanged (counselor, Oct 15). Outpatient: Piedmont Counseling, Mar–Jun 2025, 6 sessions, ended when transport fell through. <span style=\"color:#8A2E1C\">← from today's conversation; confirm dates with guardian</span></div></div>\n          </div>\n          <div style=\"display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;margin-bottom:8px\">\n            <div><label>Developmental history</label><div class=\"in a\" style=\"min-height:62px\">Full-term; walked at 13 months; speech delay noted at 3, resolved with school SLP by 1st grade. Grandmother raising him since age 4.</div></div>\n            <div><label>Medical · medications · prescriber</label><div class=\"in a\" style=\"min-height:62px\">No current medications (grandmother). Pediatrician: Dr. [name on file]. Asthma, inhaler at school.</div></div>\n            <div><label>Family mental-health history</label><div class=\"in a\" style=\"min-height:62px\">Reported: maternal depression. <span style=\"color:#8A2E1C\">Written in the clinician's words — no family quotes.</span></div></div>\n          </div>\n          <div style=\"display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;margin-bottom:8px\">\n            <div><label>Trauma history (placed after developmental history)</label><div class=\"in\" style=\"min-height:52px;color:#777\">Left for the clinician. Psyflo drafts nothing here; it notes that the section was discussed at 1:48 pm and leaves the content to you.</div></div>\n            <div><label>PHQ-9 (modified for adolescents) · answers from the interview</label><div class=\"in a\" style=\"min-height:52px\">Items 1–9 filled from the guardian/client responses; Lauris scores on Process Form. Item 9: <b>0</b> — asked directly, 2:02 pm.</div></div>\n          </div>\n          <div style=\"display:flex;gap:8px;margin-top:4px;align-items:center\">\n            <button class=\"btn o\" style=\"font-family:Arial,sans-serif;border-radius:3px;min-height:32px\">Save Form Data</button><button class=\"btn o\" style=\"font-family:Arial,sans-serif;border-radius:3px;min-height:32px\">Process Form</button>\n            \n          </div>\n        </div>\n      </div>\n    </div>\n\n    <!-- Psyflo side panel -->\n    <aside style=\"flex:0 0 400px;background:#fff;border-left:1px solid #D9D4CC;display:flex;flex-direction:column;overflow:hidden\">\n      <div style=\"background:#151B24;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px\">\n        <svg role=\"img\" aria-label=\"psyflo\" viewBox=\"0 0 3191 1060\" width=\"78\" height=\"26\"><g transform=\"translate(-6.0,780.0) scale(1,-1)\"><path d=\"M66 -220V504H186L201 434Q217 456 239.0 474.5Q261 493 291.5 504.5Q322 516 363 516Q434 516 488.0 481.0Q542 446 573.5 386.5Q605 327 605 251Q605 175 573.0 115.5Q541 56 487.0 22.0Q433 -12 364 -12Q308 -12 267.5 8.5Q227 29 201 65V-220ZM332 106Q372 106 402.5 124.0Q433 142 450.0 175.0Q467 208 467 251Q467 294 450.0 327.5Q433 361 402.5 379.5Q372 398 332 398Q293 398 262.5 379.5Q232 361 214.5 328.0Q197 295 197 252Q197 209 214.5 175.5Q232 142 262.5 124.0Q293 106 332 106Z\" fill=\"#FFFFFF\"></path></g><g transform=\"translate(624.0,780.0) scale(1,-1)\"><path d=\"M272 -12Q203 -12 152.0 10.0Q101 32 72.0 71.0Q43 110 39 159H173Q178 140 190.0 124.5Q202 109 222.0 100.0Q242 91 270 91Q297 91 314.0 98.5Q331 106 339.5 119.0Q348 132 348 146Q348 167 336.0 178.5Q324 190 301.0 197.0Q278 204 245 211Q209 218 174.5 228.5Q140 239 113.0 255.0Q86 271 70.0 296.0Q54 321 54 358Q54 403 78.0 438.5Q102 474 148.0 495.0Q194 516 259 516Q350 516 403.0 475.0Q456 434 466 362H339Q333 385 312.5 398.5Q292 412 258 412Q222 412 203.0 399.0Q184 386 184 365Q184 351 196.5 340.0Q209 329 232.0 321.5Q255 314 288 307Q346 295 390.0 279.5Q434 264 459.0 235.5Q484 207 484 153Q484 105 458.0 67.5Q432 30 384.5 9.0Q337 -12 272 -12Z\" fill=\"#FFFFFF\"></path></g><g transform=\"translate(1105.0,780.0) scale(1,-1)\"><path d=\"M130 -220 252 56H222L20 504H167L311 179L441 504H584L273 -220Z\" fill=\"#FFFFFF\"></path></g><g transform=\"translate(1734.0,780.0) scale(1,-1)\"><path d=\"M89 0V549Q89 612 110.0 649.0Q131 686 170.5 703.0Q210 720 263 720H325V605H283Q251 605 237.5 592.5Q224 580 224 549V0ZM20 391V504H333V391Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2080.0,780.0) scale(1,-1)\"><path d=\"M66 0V720H201V0Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2322.0,780.0) scale(1,-1)\"><path d=\"M304 -12Q232 -12 174.5 21.5Q117 55 83.5 114.5Q50 174 50 251Q50 330 83.5 389.5Q117 449 175.0 482.5Q233 516 305 516Q378 516 435.5 482.5Q493 449 526.5 389.5Q560 330 560 252Q560 174 526.5 114.5Q493 55 435.0 21.5Q377 -12 304 -12ZM304 105Q338 105 364.5 121.0Q391 137 406.5 170.0Q422 203 422 252Q422 301 406.5 333.5Q391 366 364.5 382.5Q338 399 305 399Q273 399 246.0 382.5Q219 366 203.5 333.5Q188 301 188 252Q188 203 203.5 170.0Q219 137 245.5 121.0Q272 105 304 105Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2922.0,780.0) scale(1,-1)\"><path d=\"M127 -5Q89 -5 66.0 17.5Q43 40 43 73Q43 106 66.0 128.5Q89 151 127 151Q163 151 186.0 128.5Q209 106 209 73Q209 40 186.0 17.5Q163 -5 127 -5Z\" fill=\"#F0B44C\"></path></g></svg>\n        <div style=\"font-size:12px;color:#C9D1D6\">Scribe · Intake (CNA) · T.W. · Jordan Perez, LPC</div>\n      </div>\n<div style=\"display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid #EFEBE4;font-size:11px;color:#151B24\"><span style=\"background:#E6F4EA;border:1px solid #BFE3CB;padding:2px 9px;border-radius:999px\">green · already in Lauris</span><span style=\"background:#FFF8E6;border:1px solid #E8C56A;padding:2px 9px;border-radius:999px\">yellow · Psyflo typed — check it</span></div>\n\n      <div style=\"padding:12px 16px;display:flex;flex-direction:column;gap:10px;overflow:auto\">\n        <div style=\"display:flex;align-items:center;gap:10px;border:1px solid #E6E1D9;border-radius:10px;padding:10px 12px;background:#F8F6F2\">\n          <span style=\"width:10px;height:10px;border-radius:50%;background:#B9541F;display:inline-block\"></span>\n          <div style=\"flex:1;font-size:13px\"><b>Recording · 2 h 10 min</b><div style=\"font-size:12px;color:#525B66\">Consent signed 11:52 am</div></div>\n          <button class=\"btn o\" style=\"min-height:34px;padding:0 10px;font-size:12px\">Pause</button>\n        </div>\n\n        <div>\n          <div style=\"display:flex;align-items:baseline;gap:6px;flex-wrap:wrap\"><div style=\"font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600\">CNA fields</div><span class=\"chip g\">31 of 48 filled in</span><span class=\"chip y\">6 for you to check</span><span class=\"chip n\">11 not talked about yet</span></div>\n          <div class=\"sec\" style=\"border-top:0\"><b>Presenting issue · referral reason</b><span class=\"chip g\">copied from screening</span></div>\n          <div class=\"sec\"><b>Mental-health and hospitalization history</b><span class=\"chip g\">written from the conversation</span></div>\n          <div class=\"sec\"><b>Prior services, with outcomes</b><span class=\"chip y\">check the dates</span></div>\n          <div class=\"sec\"><b>Developmental history</b><span class=\"chip g\">written from the conversation</span></div>\n          <div class=\"sec\"><b>Medications · prescriber</b><span class=\"chip g\">written from the conversation</span></div>\n          <div class=\"sec\"><b>Trauma history</b><span class=\"chip n\">you write this one</span></div>\n          <div class=\"sec\"><b>School behaviour · attendance · grades</b><span class=\"chip g\">copied from the referral</span></div>\n          <div class=\"sec\"><b>PHQ-9 · substance-use screen (if triggered)</b><span class=\"chip g\">answers filled in</span></div>\n          <div class=\"sec\"><b>Strengths and resources</b><span class=\"chip y\">not asked yet</span></div>\n        </div>\n\n        <div>\n          <div style=\"font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600;margin-bottom:2px\">Still to ask</div>\n          <div class=\"stamp\" style=\"border-top:0\"><div>Strengths</div><div>What does he do well, what does he like — the form has a field for it and the SRA needs it</div></div>\n          <div class=\"stamp\"><div>Dates</div><div>Outpatient at Piedmont: start and end month, and whether it was through secondary insurance</div></div>\n          <div class=\"stamp\"><div>Danger</div><div>Does he understand the risk when he leaves the building? (criterion 3)</div></div>\n          <div class=\"stamp\"><div>Collateral</div><div>Releases: school counselor, pediatrician, previous outpatient provider</div></div>\n        </div>\n\n        \n\n        <div style=\"display:flex;gap:8px;margin-top:auto\">\n          <button class=\"btn p\" style=\"flex:1\">Fill 31 boxes</button>\n          <button class=\"btn o\">Review one by one</button>\n        </div>\n        \n      </div>\n    </aside>\n  </div>\n</div>\n",note:"HOW THE DATA GETS IN · CNA\n\nCaptured: the 2–3 h in-person intake is recorded (consent). Same pipeline as the screening.\n\nFlows: green boxes = copied from the referral and screening fields Psyflo already holds. Yellow = written from today's recording. Typed into the Lauris CNA form on screen; the LPC checks and presses Process Form. The trauma section is never drafted.\n\nPopulates: Lauris CNA (official). Psyflo keeps the fields for the treatment plan (7) and the initial request (8). Enrollment paperwork stays on paper.\n\nEngineering: long audio handled in chunks; PHQ-9 answers filled as values, Lauris scores them; no writing outside the open form.",make:(function(){ 
return class Component extends DCLogic {
  renderVals() { return {}; }
}

yle=\"flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:#F2F3F5\">\n      <div style=\"background:#2F3A4A;color:#fff;padding:9px 16px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700\"><span style=\"color:#E0A030\">»</span> Lauris Online <span style=\"margin-left:auto;font-weight:400;font-size:11px;color:#C8CFD8\">Switch to Classic · Sign Out</span></div>\n      <div style=\"flex:1;display:flex;min-height:0\">\n        <nav aria-label=\"EHR menu (schematic)\" style=\"flex:0 0 170px;background:#2F3A4A;padding:6px 0;display:flex;flex-direction:column\">\n          <div class=\"lnav\">Consumers</div><div class=\"lnav\">Authorizations</div><div class=\"lnav\">Approvals</div><div class=\"lnav on\">Add Session</div><div class=\"lnav\">Saved Session<span class=\"b\">2</span></div><div class=\"lnav\">Reports</div><div class=\"lnav\">User Information</div><div class=\"lnav\">Time Tracker</div>\n          <div style=\"border-top:1px solid #46525F;margin:8px 0\"></div>\n          <div class=\"lnav\">Forms to Approve<span class=\"b\">6</span></div><div class=\"lnav\">Rejected Forms<span class=\"b\">1</span></div><div class=\"lnav\">Consumers w/o Authorizations<span class=\"b\">3</span></div>\n        </nav>\n        <div style=\"flex:1;min-width:0;padding:12px 20px;overflow:hidden\">\n          <div style=\"display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #DDE1E6;border-radius:4px;padding:8px 14px\">\n            <div style=\"width:36px;height:36px;border-radius:50%;background:#DDE1E6\"></div>\n            <div><div style=\"font-weight:700;font-size:15px;color:#1F3B6B\">T.W.</div><div style=\"font-size:11px;color:#666\">Harvest # 4492 · Lynchburg City · MS-2 · intake 10/20 · plan due by 10/21, 11:52 am</div></div>\n            <div style=\"margin-left:auto;font-size:12px;color:#C2410C;font-weight:700\">No authorizations available</div>\n          </div>\n          <div style=\"display:flex;gap:18px;margin:6px 0 8px\"><span class=\"tab\">General Information</span><span class=\"tab\">Authorization Information</span><span class=\"tab\">Documents</span><span class=\"tab on\">Active File</span><span class=\"tab\">Medications</span><span class=\"tab\">Allergies</span></div>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\"><label style=\"margin:0\">Session entry</label><div class=\"in\" style=\"min-width:300px\">Individual Service Plan 2.0</div><span style=\"font-size:11px;color:#666\">Add Session · 10/21/2026 · J. Perez, LPC · guardian and client present</span></div>\n\n          <div style=\"display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:10px;margin-bottom:8px\">\n            <div><label>Diagnosis 1</label><div class=\"in g\">F91.3 — from CNA</div></div>\n            <div><label>Start · end of plan</label><div class=\"in g\">10/21/2026 – 10/20/2027</div></div>\n            <div><label>Prescribed frequency</label><div class=\"in g\">Daily</div></div>\n            <div><label>Setting</label><div class=\"in g\">School · MS-2</div></div>\n          </div>\n          <div style=\"display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;margin-bottom:8px\">\n            <div><label>Presenting issue / reason for referral</label><div class=\"in g\" style=\"min-height:48px\">Physical and verbal aggression toward peers, leaving the building, daily off-task behaviour. Copied from the CNA.</div></div>\n            <div><label>Strengths</label><div class=\"in a\" style=\"min-height:48px\">Engaged grandmother; enjoys basketball and drawing; responds well to one-to-one adult attention.</div></div>\n          </div>\n          <div style=\"display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;margin-bottom:8px\">\n            <div><label>Goal 1 · emotional regulation</label><div class=\"in a\" style=\"min-height:70px\"><b>Objective:</b> T.W. will use a taught coping strategy before leaving the room in 4 of 5 escalations.<br><b>Clinical 2.1:</b> Movement ▾ · <b>QMHP 1.3:</b> Psychoeducation ▾<br><b>Est. completion:</b> 3 months ▾</div></div>\n            <div><label>Goal 2 · peer conflict</label><div class=\"in a\" style=\"min-height:70px\"><b>Objective:</b> T.W. will respond to peer conflict without physical contact in 4 of 5 incidents.<br><b>QMHP 1.9:</b> Solving peer conflict ▾ · <b>QMHP 1.5:</b> Make or maintain friendships ▾<br><b>Est. completion:</b> 3 months ▾</div></div>\n            <div><label>Goal 3 · staying in class</label><div class=\"in a\" style=\"min-height:70px\"><b>Objective:</b> T.W. will stay in class for the full period on 4 of 5 school days.<br><b>QMHP 1.6:</b> Recognize danger / healthy boundaries ▾ · <b>QMHP 1.4:</b> Structured problem solving ▾<br><b>Est. completion:</b> 3 months ▾</div></div>\n          </div>\n          <div style=\"display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;margin-bottom:8px\">\n            <div><label>Treatment goals and discharge criteria</label><div class=\"in g\" style=\"min-height:44px\">Once the individual no longer demonstrates meeting the eligibility criteria… (Harvest's standard text)</div></div>\n            <div><label>Signatures</label><div class=\"in\" style=\"min-height:44px\">Harvest staff: J. Perez, LPC · Client: <span style=\"color:#1F6FBF\">Get Signature</span> · Parent/Guardian: <span style=\"color:#1F6FBF\">Get Signature</span> · Approver: J. Perez</div></div>\n          </div>\n          <div style=\"display:flex;gap:8px;margin-top:4px;align-items:center\">\n            <button class=\"btn o\" style=\"font-family:Arial,sans-serif;border-radius:3px;min-height:32px\">Save Form Data</button><button class=\"btn o\" style=\"font-family:Arial,sans-serif;border-radius:3px;min-height:32px\">Process Form</button>\n            \n          </div>\n        </div>\n      </div>\n    </div>\n\n    <!-- Psyflo side panel -->\n    <aside style=\"flex:0 0 400px;background:#fff;border-left:1px solid #D9D4CC;display:flex;flex-direction:column;overflow:hidden\">\n      <div style=\"background:#151B24;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px\">\n        <svg role=\"img\" aria-label=\"psyflo\" viewBox=\"0 0 3191 1060\" width=\"78\" height=\"26\"><g transform=\"translate(-6.0,780.0) scale(1,-1)\"><path d=\"M66 -220V504H186L201 434Q217 456 239.0 474.5Q261 493 291.5 504.5Q322 516 363 516Q434 516 488.0 481.0Q542 446 573.5 386.5Q605 327 605 251Q605 175 573.0 115.5Q541 56 487.0 22.0Q433 -12 364 -12Q308 -12 267.5 8.5Q227 29 201 65V-220ZM332 106Q372 106 402.5 124.0Q433 142 450.0 175.0Q467 208 467 251Q467 294 450.0 327.5Q433 361 402.5 379.5Q372 398 332 398Q293 398 262.5 379.5Q232 361 214.5 328.0Q197 295 197 252Q197 209 214.5 175.5Q232 142 262.5 124.0Q293 106 332 106Z\" fill=\"#FFFFFF\"></path></g><g transform=\"translate(624.0,780.0) scale(1,-1)\"><path d=\"M272 -12Q203 -12 152.0 10.0Q101 32 72.0 71.0Q43 110 39 159H173Q178 140 190.0 124.5Q202 109 222.0 100.0Q242 91 270 91Q297 91 314.0 98.5Q331 106 339.5 119.0Q348 132 348 146Q348 167 336.0 178.5Q324 190 301.0 197.0Q278 204 245 211Q209 218 174.5 228.5Q140 239 113.0 255.0Q86 271 70.0 296.0Q54 321 54 358Q54 403 78.0 438.5Q102 474 148.0 495.0Q194 516 259 516Q350 516 403.0 475.0Q456 434 466 362H339Q333 385 312.5 398.5Q292 412 258 412Q222 412 203.0 399.0Q184 386 184 365Q184 351 196.5 340.0Q209 329 232.0 321.5Q255 314 288 307Q346 295 390.0 279.5Q434 264 459.0 235.5Q484 207 484 153Q484 105 458.0 67.5Q432 30 384.5 9.0Q337 -12 272 -12Z\" fill=\"#FFFFFF\"></path></g><g transform=\"translate(1105.0,780.0) scale(1,-1)\"><path d=\"M130 -220 252 56H222L20 504H167L311 179L441 504H584L273 -220Z\" fill=\"#FFFFFF\"></path></g><g transform=\"translate(1734.0,780.0) scale(1,-1)\"><path d=\"M89 0V549Q89 612 110.0 649.0Q131 686 170.5 703.0Q210 720 263 720H325V605H283Q251 605 237.5 592.5Q224 580 224 549V0ZM20 391V504H333V391Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2080.0,780.0) scale(1,-1)\"><path d=\"M66 0V720H201V0Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2322.0,780.0) scale(1,-1)\"><path d=\"M304 -12Q232 -12 174.5 21.5Q117 55 83.5 114.5Q50 174 50 251Q50 330 83.5 389.5Q117 449 175.0 482.5Q233 516 305 516Q378 516 435.5 482.5Q493 449 526.5 389.5Q560 330 560 252Q560 174 526.5 114.5Q493 55 435.0 21.5Q377 -12 304 -12ZM304 105Q338 105 364.5 121.0Q391 137 406.5 170.0Q422 203 422 252Q422 301 406.5 333.5Q391 366 364.5 382.5Q338 399 305 399Q273 399 246.0 382.5Q219 366 203.5 333.5Q188 301 188 252Q188 203 203.5 170.0Q219 137 245.5 121.0Q272 105 304 105Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2922.0,780.0) scale(1,-1)\"><path d=\"M127 -5Q89 -5 66.0 17.5Q43 40 43 73Q43 106 66.0 128.5Q89 151 127 151Q163 151 186.0 128.5Q209 106 209 73Q209 40 186.0 17.5Q163 -5 127 -5Z\" fill=\"#F0B44C\"></path></g></svg>\n        <div style=\"font-size:12px;color:#C9D1D6\">Scan &amp; enhance · Treatment plan (ISP) · T.W.</div>\n      </div>\n<div style=\"display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid #EFEBE4;font-size:11px;color:#151B24\"><span style=\"background:#E6F4EA;border:1px solid #BFE3CB;padding:2px 9px;border-radius:999px\">green · already in Lauris</span><span style=\"background:#FFF8E6;border:1px solid #E8C56A;padding:2px 9px;border-radius:999px\">yellow · Psyflo typed — check it</span></div>\n\n      <div style=\"padding:12px 16px;display:flex;flex-direction:column;gap:10px;overflow:auto\">\n        <div style=\"display:flex;align-items:center;gap:10px;border:1px solid #F0B44C;border-radius:10px;padding:8px 12px;background:#FFFDF7;font-size:12px\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6F4A05\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7v5l3 2\"></path></svg><div><b>Due 11:52 am tomorrow</b> — 24 hours from the intake. The rest of the file is due in a week.</div></div>\n\n        <div style=\"border:1px solid #217A78;border-radius:10px;padding:10px 12px;background:#F2F9F8\">\n          <div style=\"font-size:13px\"><b>Three goals drafted from the intake.</b> Written to be talked through with T.W. and his grandmother — not pasted while they sit there.</div>\n          \n          <div style=\"display:flex;gap:8px;margin-top:10px\"><button class=\"btn p\" style=\"flex:1\">Fill the 3 goals</button><button class=\"btn o\">Show one at a time</button></div>\n        </div>\n\n        <div>\n          <div style=\"font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600;margin-bottom:2px\">Where each goal came from</div>\n          <div class=\"sec\" style=\"border-top:0\"><b>Goal 1 · emotional regulation</b><span class=\"chip n\">CNA: 6 aggression incidents, leaves when frustrated</span></div>\n          <div class=\"sec\"><b>Goal 2 · peer conflict</b><span class=\"chip n\">CNA + referral: shoving, 2 office referrals</span></div>\n          <div class=\"sec\"><b>Goal 3 · staying in class</b><span class=\"chip n\">attendance log: weekly elopement</span></div>\n          <div class=\"sec\"><b>Strengths</b><span class=\"chip n\">CNA: grandmother, basketball, drawing</span></div>\n        </div>\n\n        <div>\n          <div style=\"font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600;margin-bottom:2px\">Checked before you process</div>\n          <div class=\"stamp\" style=\"border-top:0\"><div>Measurable</div><div>Every objective has a number and a time frame</div></div>\n          <div class=\"stamp\"><div>Interven­tions</div><div>Each goal names at least one intervention from the approved list</div></div>\n          <div class=\"stamp\"><div>Too many?</div><div>Goals 1 and 2 overlap. You can merge them into one goal with two objectives — fewer goals is less to write every day and every renewal.</div></div>\n          <div class=\"stamp\"><div>Matches the SRA</div><div>The initial request (next screen) copies these goals as written. Change them here, not there.</div></div>\n        </div>\n\n        \n\n        \n      </div>\n    </aside>\n  </div>\n</div>\n",note:"HOW THE DATA GETS IN · (ISP)\n\nHow the clinician gets here: Add Session → Individual Service Plan 2.0 in Lauris, within 24 h of the intake, with the guardian and client present — as today.\n\nCaptured: nothing new. Psyflo drafts three goals with measurable objectives from the intake, the referral attachments and Harvest's own goal scaffold; interventions are chosen from the drop-down lists on this form.\n\nFlows: draft → typed into the yellow boxes on the open Lauris ISP → talked through with the family → clinician edits → signatures on the Lauris pad → Process Form.\n\nPopulates: Lauris ISP (official). Psyflo reads the processed plan back and uses its objectives to check every daily note (12) and to fill the goals on the initial and continued-stay requests (8, 15).\n\nEngineering: objectives are always counts, never percentages; drop-down values are read from the form's own options; same form-fill mechanism as screening and intake.",make:(function(){ 
return class Component extends DCLogic {
  renderVals() { return {}; }
}

lay:grid;grid-template-columns:64px 1fr;gap:8px;font-size:12px;padding:4px 0;border-top:1px solid #EFEBE4}\n.sec .chip{white-space:normal;text-align:right;max-width:60%}\n.stamp>div{min-width:0}\n",tpl:"\n\n\n<div style=\"width:1440px;height:1080px;display:flex;flex-direction:column;background:#E9E6E0;overflow:hidden\">\n  <div style=\"background:#DEDAD3;padding:8px 12px 0;display:flex;align-items:flex-end;gap:8px\">\n    <div style=\"display:flex;gap:6px;padding:0 6px 10px\"><span style=\"width:12px;height:12px;border-radius:50%;background:#C9C4BC;display:inline-block\"></span><span style=\"width:12px;height:12px;border-radius:50%;background:#C9C4BC;display:inline-block\"></span><span style=\"width:12px;height:12px;border-radius:50%;background:#C9C4BC;display:inline-block\"></span></div>\n    <div style=\"padding:8px 14px;font-size:12px;color:#525B66\">Psyflo — Initial request · T.W.</div>\n    <div style=\"background:#F8F6F2;border-radius:8px 8px 0 0;padding:8px 14px;font-size:12px;font-weight:500;display:flex;gap:8px;align-items:center\"><span style=\"width:14px;height:14px;border-radius:3px;background:#8E99A6;display:inline-block\"></span>Lauris Online — TDT Initial Service Authorization Request</div>\n  </div>\n  <div style=\"background:#F8F6F2;padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #D9D4CC\">\n    <div style=\"flex:1;background:#fff;border:1px solid #D9D4CC;border-radius:999px;padding:6px 14px;font-size:12px;color:#525B66\">https://…laurisonline…/consumers/4492/session/sra-initial</div>\n    <div style=\"display:flex;align-items:center;gap:6px;background:#151B24;color:#fff;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600\"><span style=\"width:8px;height:8px;border-radius:50%;background:#F0B44C;display:inline-block\"></span>psyflo · on</div>\n  </div>\n\n  <div style=\"flex:1;display:flex;min-height:0\">\n    <!-- Schematic of the EHR (structure and labels only, not its styling) -->\n    <div class=\"ef\" style=\"flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:#F2F3F5\">\n      <div style=\"background:#2F3A4A;color:#fff;padding:9px 16px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700\"><span style=\"color:#E0A030\">»</span> Lauris Online <span style=\"margin-left:auto;font-weight:400;font-size:11px;color:#C8CFD8\">Switch to Classic · Sign Out</span></div>\n      <div style=\"flex:1;display:flex;min-height:0\">\n        <nav aria-label=\"EHR menu (schematic)\" style=\"flex:0 0 170px;background:#2F3A4A;padding:6px 0;display:flex;flex-direction:column\">\n          <div class=\"lnav\">Consumers</div><div class=\"lnav\">Authorizations</div><div class=\"lnav\">Approvals</div><div class=\"lnav on\">Add Session</div><div class=\"lnav\">Saved Session<span class=\"b\">2</span></div><div class=\"lnav\">Reports</div><div class=\"lnav\">User Information</div><div class=\"lnav\">Time Tracker</div>\n          <div style=\"border-top:1px solid #46525F;margin:8px 0\"></div>\n          <div class=\"lnav\">Forms to Approve<span class=\"b\">6</span></div><div class=\"lnav\">Rejected Forms<span class=\"b\">1</span></div><div class=\"lnav\">Consumers w/o Authorizations<span class=\"b\">3</span></div>\n        </nav>\n        <div style=\"flex:1;min-width:0;padding:12px 20px;overflow:hidden\">\n          <div style=\"display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #DDE1E6;border-radius:4px;padding:8px 14px\">\n            <div style=\"width:36px;height:36px;border-radius:50%;background:#DDE1E6\"></div>\n            <div><div style=\"font-weight:700;font-size:15px;color:#1F3B6B\">T.W.</div><div style=\"font-size:11px;color:#666\">Harvest # 4492 · Lynchburg City · MS-2 · intake 10/20 · ISP 10/21 · Clinician: J. Perez, LPC</div></div>\n            <div style=\"margin-left:auto;font-size:12px;color:#C2410C;font-weight:700\">No authorizations available</div>\n          </div>\n          <div style=\"display:flex;gap:18px;margin:6px 0 8px\"><span class=\"tab\">General Information</span><span class=\"tab\">Authorization Information</span><span class=\"tab\">Documents</span><span class=\"tab on\">Active File</span><span class=\"tab\">Medications</span><span class=\"tab\">Allergies</span></div>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\"><label style=\"margin:0\">Session entry</label><div class=\"in\" style=\"min-width:300px\">TDT (H2016) Initial Service Authorization Request</div><span style=\"font-size:11px;color:#666\">Add Session · 10/22/2026 · J. Perez, LPC</span></div>\n\n          <div style=\"display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:10px;margin-bottom:8px\">\n            <div><label>Member</label><div class=\"in g\">T.W. · Medicaid # on file</div></div>\n            <div><label>Group NPI · tax ID</label><div class=\"in g\">on file · Lynchburg City</div></div>\n            <div><label>Procedure</label><div class=\"in g\">☑ H2016 (school day) · MS-2</div></div>\n            <div><label>Request</label><div class=\"in a\">10/27/2026 – 01/23/2027 · 150 units · 15 h/wk</div></div>\n          </div>\n          <div style=\"display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;margin-bottom:8px\">\n            <div><label>Section I · criterion 1 — interpersonal relationships</label><div class=\"in a\" style=\"min-height:66px\">In the 30 days before referral T.W. was physically aggressive toward peers on 6 dated occasions, 2–3 times a week, lasting 5–20 minutes, moderate intensity; 2 office referrals and 1 day of in-school suspension followed. Verbal aggression daily. IEP: yes. Unexcused absences: 9. ISS past 6 months: 1 day. OSS: 0. Classes: 7, passing 4.</div></div>\n            <div><label>Section I · criterion 2 — interventions that have not worked</label><div class=\"in a\" style=\"min-height:66px\">School behaviour interventionist, 2×/week, Sep 2026–present — no reduction in incidents. Outpatient therapy, Piedmont Counseling, Mar–Jun 2025, 6 sessions — ended (transportation); behaviours continued.</div></div>\n          </div>\n          <div style=\"display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;margin-bottom:8px\">\n            <div><label>Level of care</label><div class=\"in a\" style=\"min-height:58px\">The school has raised alternative placement twice this year; weekly elopement from the building (10–30 min) and the suspension place T.W. at risk of removal from his setting.</div></div>\n            <div><label>Section III · trauma-informed care</label><div class=\"in\" style=\"min-height:58px;color:#777\">Not filled by Psyflo. Jordan writes this one.</div></div>\n            <div><label>Barriers to treatment</label><div class=\"in a\" style=\"min-height:58px\">Unstructured periods are the highest-risk times. Transportation ended the last outpatient episode. Children with severe behavioural dysregulation are at increased risk of academic failure and social rejection (Evans et al., J. Child Psychol. Psychiatry, 2024).</div></div>\n          </div>\n          <div style=\"display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;margin-bottom:8px\">\n            <div><label>Goal 1 (from ISP)</label><div class=\"in g\" style=\"min-height:44px\">Use a taught coping strategy before leaving the room, 4 of 5 times · Movement, Psychoeducation</div></div>\n            <div><label>Goal 2 (from ISP)</label><div class=\"in g\" style=\"min-height:44px\">Respond to peer conflict without physical contact, 4 of 5 times · Solving peer conflict</div></div>\n            <div><label>Goal 3 (from ISP)</label><div class=\"in g\" style=\"min-height:44px\">Stay in class for the full period, 4 of 5 days · Recognize danger / healthy boundaries</div></div>\n          </div>\n          <div style=\"display:flex;gap:8px;margin-top:4px;align-items:center\">\n            <button class=\"btn o\" style=\"font-family:Arial,sans-serif;border-radius:3px;min-height:32px\">Save Form Data</button><button class=\"btn o\" style=\"font-family:Arial,sans-serif;border-radius:3px;min-height:32px\">Process Form</button>\n            \n          </div>\n        </div>\n      </div>\n    </div>\n\n    <!-- Psyflo side panel -->\n    <aside style=\"flex:0 0 400px;background:#fff;border-left:1px solid #D9D4CC;display:flex;flex-direction:column;overflow:hidden\">\n      <div style=\"background:#151B24;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px\">\n        <svg role=\"img\" aria-label=\"psyflo\" viewBox=\"0 0 3191 1060\" width=\"78\" height=\"26\"><g transform=\"translate(-6.0,780.0) scale(1,-1)\"><path d=\"M66 -220V504H186L201 434Q217 456 239.0 474.5Q261 493 291.5 504.5Q322 516 363 516Q434 516 488.0 481.0Q542 446 573.5 386.5Q605 327 605 251Q605 175 573.0 115.5Q541 56 487.0 22.0Q433 -12 364 -12Q308 -12 267.5 8.5Q227 29 201 65V-220ZM332 106Q372 106 402.5 124.0Q433 142 450.0 175.0Q467 208 467 251Q467 294 450.0 327.5Q433 361 402.5 379.5Q372 398 332 398Q293 398 262.5 379.5Q232 361 214.5 328.0Q197 295 197 252Q197 209 214.5 175.5Q232 142 262.5 124.0Q293 106 332 106Z\" fill=\"#FFFFFF\"></path></g><g transform=\"translate(624.0,780.0) scale(1,-1)\"><path d=\"M272 -12Q203 -12 152.0 10.0Q101 32 72.0 71.0Q43 110 39 159H173Q178 140 190.0 124.5Q202 109 222.0 100.0Q242 91 270 91Q297 91 314.0 98.5Q331 106 339.5 119.0Q348 132 348 146Q348 167 336.0 178.5Q324 190 301.0 197.0Q278 204 245 211Q209 218 174.5 228.5Q140 239 113.0 255.0Q86 271 70.0 296.0Q54 321 54 358Q54 403 78.0 438.5Q102 474 148.0 495.0Q194 516 259 516Q350 516 403.0 475.0Q456 434 466 362H339Q333 385 312.5 398.5Q292 412 258 412Q222 412 203.0 399.0Q184 386 184 365Q184 351 196.5 340.0Q209 329 232.0 321.5Q255 314 288 307Q346 295 390.0 279.5Q434 264 459.0 235.5Q484 207 484 153Q484 105 458.0 67.5Q432 30 384.5 9.0Q337 -12 272 -12Z\" fill=\"#FFFFFF\"></path></g><g transform=\"translate(1105.0,780.0) scale(1,-1)\"><path d=\"M130 -220 252 56H222L20 504H167L311 179L441 504H584L273 -220Z\" fill=\"#FFFFFF\"></path></g><g transform=\"translate(1734.0,780.0) scale(1,-1)\"><path d=\"M89 0V549Q89 612 110.0 649.0Q131 686 170.5 703.0Q210 720 263 720H325V605H283Q251 605 237.5 592.5Q224 580 224 549V0ZM20 391V504H333V391Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2080.0,780.0) scale(1,-1)\"><path d=\"M66 0V720H201V0Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2322.0,780.0) scale(1,-1)\"><path d=\"M304 -12Q232 -12 174.5 21.5Q117 55 83.5 114.5Q50 174 50 251Q50 330 83.5 389.5Q117 449 175.0 482.5Q233 516 305 516Q378 516 435.5 482.5Q493 449 526.5 389.5Q560 330 560 252Q560 174 526.5 114.5Q493 55 435.0 21.5Q377 -12 304 -12ZM304 105Q338 105 364.5 121.0Q391 137 406.5 170.0Q422 203 422 252Q422 301 406.5 333.5Q391 366 364.5 382.5Q338 399 305 399Q273 399 246.0 382.5Q219 366 203.5 333.5Q188 301 188 252Q188 203 203.5 170.0Q219 137 245.5 121.0Q272 105 304 105Z\" fill=\"#5FC0BE\"></path></g><g transform=\"translate(2922.0,780.0) scale(1,-1)\"><path d=\"M127 -5Q89 -5 66.0 17.5Q43 40 43 73Q43 106 66.0 128.5Q89 151 127 151Q163 151 186.0 128.5Q209 106 209 73Q209 40 186.0 17.5Q163 -5 127 -5Z\" fill=\"#F0B44C\"></path></g></svg>\n        <div style=\"font-size:12px;color:#C9D1D6\">Review a service request · T.W. · first request</div>\n      </div>\n<div style=\"display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid #EFEBE4;font-size:11px;color:#151B24\"><span style=\"background:#E6F4EA;border:1px solid #BFE3CB;padding:2px 9px;border-radius:999px\">green · already in Lauris</span><span style=\"background:#FFF8E6;border:1px solid #E8C56A;padding:2px 9px;border-radius:999px\">yellow · Psyflo typed — check it</span></div>\n\n      <div style=\"padding:12px 16px;display:flex;flex-direction:column;gap:10px;overflow:auto\">\n        <div style=\"border:1px solid #217A78;border-radius:10px;padding:10px 12px;background:#F2F9F8\">\n          <div style=\"font-size:13px\"><b>Draft ready for T.W.</b> — written from the screening (Oct 16), the intake (Oct 20), the plan (Oct 21) and the referral.</div>\n          \n          <div style=\"font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600;margin-top:10px\">Criterion 1 · relationships — edit here</div>\n          <textarea aria-label=\"Criterion 1 draft\" style=\"width:100%;min-height:92px;border:1px solid #D9D4CC;border-radius:8px;padding:8px 10px;font:inherit;font-size:12px;line-height:1.4;background:#fff;margin-top:4px;resize:vertical\">6 dated incidents of physical or verbal aggression toward peers in the last 30 days (Oct 2, 6, 9, 14, 20, 22 — school incident log). Counselor reports he has no sustained peer friendships this year and was removed from group work twice. Guardian reports the same pattern with cousins at home.</textarea>\n          <div style=\"display:flex;gap:8px;margin-top:10px\"><button class=\"btn p\" style=\"flex:1\">Fill all 7 boxes</button><button class=\"btn o\">One at a time</button></div>\n        </div>\n\n        <div>\n          <div style=\"font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600;margin-bottom:2px\">Boxes on this form</div>\n          <div class=\"sec\" style=\"border-top:0\"><b>Request dates · units · hours</b><span class=\"chip g\">filled</span></div>\n          <div class=\"sec\"><b>Criterion 1 · relationships</b><span class=\"chip g\">filled</span></div>\n          <div class=\"sec\"><b>Criterion 2 · interventions tried</b><span class=\"chip g\">filled</span></div>\n          <div class=\"sec\"><b>Criterion 3 · recognising danger</b><span class=\"chip n\">left blank · 2 already met</span></div>\n          <div class=\"sec\"><b>Level of care</b><span class=\"chip g\">filled</span></div>\n          <div class=\"sec\"><b>Care coordination</b><span class=\"chip g\">filled</span></div>\n          <div class=\"sec\"><b>Trauma-informed care</b><span class=\"chip n\">you write this one</span></div>\n          <div class=\"sec\"><b>Goals 1–3</b><span class=\"chip g\">copied from the ISP</span></div>\n          <div class=\"sec\"><b>Strengths · barriers · discharge</b><span class=\"chip g\">filled</span></div>\n        </div>\n\n        <div>\n          <div style=\"font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600;margin-bottom:2px\">Checked before you process</div>\n          <div class=\"stamp\" style=\"border-top:0\"><div>Numbers</div><div>Every count is \"3 of 5,\" never a percentage — the form asks for it that way</div></div>\n          <div class=\"stamp\"><div>Dates</div><div>All examples are from the last 30 days</div></div>\n          <div class=\"stamp\"><div>Prior services</div><div>Outcome column is filled for both rows</div></div>\n          <div class=\"stamp\"><div>Nothing extra</div><div>Only what the form asks. Nothing from the family that you excluded.</div></div>\n        </div>\n\n        \n\n        \n      </div>\n    </aside>\n  </div>\n</div>\n",note:"HOW THE DATA GETS IN · service request\n\nCaptured: nothing new. Psyflo writes the narrative sections from what it already holds: referral + attachments, screening and intake fields (captured at Process Form), the treatment plan (read from the Lauris ISP), and the daily notes. Each sentence carries its source. Lauris fills the header, provider, codes and goals itself (green).\n\nFlows: the clinician reads and edits each paragraph in the panel → 'Fill' types them into the yellow boxes on the open Lauris form → clinician checks → Process Form → Forms to Approve → signs with credentials and NPI. The final text is whatever was in the Lauris box at Process Form; Psyflo keeps that version, not an earlier one.\n\nPopulates: Lauris holds the official signed form. Psyflo reads the signed preview page, keeps a PDF copy, and marks the request 'signed' on the Authorizations page (10) ready for Send (9).\n\nEngineering: the one place the extension WRITES into a Lauris page (form boxes only, never a submit). Fallback: a per-box copy button. Edit log between draft and processed version kept for audit.",make:(function(){ 
return class Component extends DCLogic {
  renderVals() { return {}; }
}
