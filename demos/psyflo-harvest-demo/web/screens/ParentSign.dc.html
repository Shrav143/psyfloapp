<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parent portal — sign a form</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0;background:#F8F6F2;color:#151B24;font-family:'DM Sans',system-ui,sans-serif;font-size:17px;line-height:1.45}
a{color:#217A78}a:hover{color:#15605E}
*{box-sizing:border-box}
label{display:block;font-size:15px;font-weight:600;margin-bottom:6px}
.in{width:100%;border:1.5px solid #C9CDD3;border-radius:10px;padding:12px 14px;font:inherit;font-size:17px;background:#fff;min-height:50px;color:#151B24}
.rad{display:flex;gap:10px}
.rad label{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;margin:0;border:1.5px solid #C9CDD3;border-radius:10px;min-height:50px;background:#fff;font-size:16px}
.rad label.on{border-color:#217A78;background:#DDF1EF;color:#15605E;font-weight:600}
.rad input{width:18px;height:18px;margin:0;accent-color:#217A78}
.btn{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:12px;font:inherit;font-weight:600;font-size:17px;border:0;width:100%;text-decoration:none}
.btn.p{background:#217A78;color:#fff}
.chipr{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #C9CDD3;border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;background:#fff}
.chipr.on{border-color:#217A78;background:#DDF1EF;color:#15605E}
.tile{border:1px solid #E6E1D9;border-radius:14px;padding:14px 16px;background:#fff}
.tile b{font-size:16px}
.tile .s{font-size:14px;color:#525B66;margin-top:2px}
.bar{height:8px;border-radius:4px;background:#EFEBE4;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#217A78}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.r{background:#FBE9E4;color:#8A2E1C}.chip.y{background:#FCEFD0;color:#6F4A05}.chip.g{background:#DDF1EF;color:#15605E}.chip.n{background:#EEEBE5;color:#3E4652}
.btn.o{background:#fff;color:#151B24;border:1.5px solid #D9D4CC}
.btn.r{background:#B9541F;color:#fff}
</style>
</helmet>

<div style="width:100%;height:844px;background:#F8F6F2;display:flex;flex-direction:column;overflow:hidden">
  <div style="background:#151B24;color:#fff;padding:18px 20px 14px">
    <div style="font-weight:700;font-size:17px">{{formTitle}}</div>
    <div style="font-size:13px;color:#C9D1D6;margin-top:2px">{{formSub}}</div>
  </div>
  <div style="flex:1;padding:16px 20px 0;display:flex;flex-direction:column;gap:12px;overflow-y:auto">
    <div class="tile" style="background:#F2F9F8;border-color:#217A78"><b>{{t.what}}</b><div class="s" style="color:#151B24;margin-top:4px;line-height:1.5">{{summary}}</div></div>
    <sc-if value="{{!full}}"><div class="tile" style="font-size:13px;color:#525B66;line-height:1.5;max-height:170px;overflow:hidden">{{fullStart}}… <a href="#full">{{t.readFull}}</a></div></sc-if>
    <sc-if value="{{full}}"><div class="tile" style="font-size:13px;color:#525B66;line-height:1.5;white-space:pre-line;flex-shrink:0">{{fullText}} <a href="#full">{{t.less}}</a></div></sc-if>
    <sc-if value="{{done}}">
      <div class="tile" style="border-color:#217A78"><b>{{done.title}}</b><div class="s">{{done.sub}}<sc-if value="{{done.file}}"> · <a href="{{done.file}}" target="_blank" rel="noopener">{{t.copy}}</a></sc-if></div></div>
      <a class="btn p" href="#back" style="min-height:54px;flex-shrink:0">{{t.back}}</a>
    </sc-if>
    <sc-if value="{{!done}}">
    <div><label for="sig">{{t.signHere}}</label><div style="border:1.5px dashed #C9CDD3;border-radius:12px;height:110px;background:#fff;display:flex;align-items:center;justify-content:center;color:#8E99A6;font-size:14px;position:relative;overflow:hidden"><canvas id="sig" aria-label="{{t.signHere}}" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair"></canvas><span id="sigph" style="pointer-events:none;position:relative">{{signer}}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;color:#525B66;margin-top:6px"><span>{{t.signerIs}} {{signer}}</span><a href="#clear">{{t.clear}}</a></div></div>
    <a class="btn p" href="#sign" style="min-height:54px;flex-shrink:0">{{t.sign}}</a>
    </sc-if>
  </div>
  <div style="padding:12px 20px 22px;border-top:1px solid #E6E1D9;background:#F8F6F2;font-size:12px;color:#525B66;text-align:center">{{t.copyMail}} · <a href="#es">{{t.other}}</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
