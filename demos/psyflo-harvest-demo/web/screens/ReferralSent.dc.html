<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Referral sent — Harvest Outreach Center</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
/* shared school look: SCHOOL_CSS in js/screens/SchoolPortal.js */
.s-done{max-width:560px;margin:0 auto;padding:56px 0 40px;text-align:center}
.s-tick{width:56px;height:56px;border-radius:50%;background:var(--teal-tint);display:inline-flex;align-items:center;justify-content:center;color:var(--teal-dark)}
</style>
</helmet>

<div class="s-pg">
  <header class="s-hd">
    <b>Harvest Outreach Center</b><span class="m">School portal · {{schoolShort}}</span>
    <span class="r">{{signedIn}} · <a href="#out">Sign out</a></span>
  </header>
  <main class="s-main">
    <div class="s-done">
      <span class="s-tick"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"></path></svg></span>
      <h1 class="u-title" style="margin-top:12px">{{title}}</h1>
      <div class="u-mut" style="margin-top:2px">{{sub}}</div>
      <div class="u-rows" style="margin-top:24px;text-align:left">
        <div class="u-row" style="--cols:96px minmax(0,1fr)"><span class="u-mut">Next</span><span>{{next}}</span></div>
        <sc-for list="{{missing}}" as="m"><div class="u-row" style="--cols:96px minmax(0,1fr) auto"><span class="u-mut">Missing</span><span>{{m.label}}</span><a class="u-btn" href="#up" data-key="{{m.key}}">Attach now</a></div></sc-for>
        <input type="file" id="attfile" accept=".pdf,image/*,.doc,.docx,.xls,.xlsx,.txt" style="display:none">
      </div>
      <div style="display:flex;gap:8px;justify-content:center;align-items:center;margin-top:24px"><a class="u-btn pri" href="SchoolPortal.dc.html">Back to portal</a><a class="u-btn txt" href="ReferralForm.dc.html">Refer another</a></div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":700}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
