<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>School portal — referral sent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0;background:#F8F6F2;color:#151B24;font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.45}
a{color:#217A78}a:hover{color:#15605E}
*{box-sizing:border-box}
label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.in{width:100%;border:1px solid #C9CDD3;border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;background:#fff;min-height:44px;color:#151B24}
textarea.in{min-height:96px;resize:vertical}
.g2{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:14px}
.sec{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#525B66;font-weight:700;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid #151B24}
.ck{display:flex;align-items:center;gap:10px;min-height:36px;font-size:15px}
.ck input{width:20px;height:20px;margin:0;accent-color:#217A78}
.rad{display:flex;gap:12px;align-items:center;min-height:44px;flex-wrap:wrap}
.rad label{display:flex;align-items:center;gap:8px;font-weight:500;margin:0}
.rad input{width:20px;height:20px;margin:0;accent-color:#217A78}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:8px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;border:1px solid transparent;text-decoration:none}
.btn.p{background:#217A78;color:#fff}.btn.p:hover{background:#15605E;color:#fff}
.btn.o{background:#fff;color:#151B24;border-color:#D9D4CC}
.note{font-size:13px;color:#525B66}
.card{background:#fff;border:1px solid #E6E1D9;border-radius:12px}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.r{background:#FBE9E4;color:#8A2E1C}.chip.y{background:#FCEFD0;color:#6F4A05}.chip.g{background:#DDF1EF;color:#15605E}.chip.n{background:#EEEBE5;color:#3E4652}
.bar{height:6px;border-radius:3px;background:#EFEBE4;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#217A78}
.door{display:flex;flex-direction:column;gap:6px;padding:18px 20px;border:1.5px solid #E6E1D9;border-radius:14px;background:#fff;text-decoration:none;color:#151B24;min-height:120px}
.door:hover{border-color:#217A78;color:#151B24}
.door b{font-size:17px}
.door span{font-size:14px;color:#525B66}
.row{display:grid;gap:12px;padding:10px 0;border-top:1px solid #EFEBE4;font-size:14px;align-items:center}
.row>div{min-width:0}
.th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#525B66;font-weight:600}
</style>
</helmet>

<div style="min-height:700px;width:100%;display:flex;flex-direction:column;background:#F8F6F2">
  <header style="background:#151B24;color:#fff;padding:14px 40px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div style="font-weight:700;font-size:18px">Harvest Outreach Center</div>
    <div style="font-size:13px;color:#C9D1D6">School portal · {{schoolShortLong}}</div>
    <div style="margin-left:auto;font-size:13px;color:#C9D1D6">{{signedIn}} · <a href="#out" style="color:#5FC0BE">Sign out</a></div>
  </header>
  <div style="max-width:760px;width:100%;margin:0 auto;padding:60px 40px 40px;text-align:center">
    <div style="width:64px;height:64px;border-radius:50%;background:#DDF1EF;display:inline-flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#15605E" stroke-width="2.5"><path d="M5 12l5 5L20 7"></path></svg></div>
    <h1 style="margin:16px 0 0;font-size:28px;font-weight:600;letter-spacing:-.01em">{{title}}</h1>
    <div style="color:#525B66;margin-top:6px;font-size:16px">{{sub}}</div>
    <div class="card" style="text-align:left;padding:18px 22px;margin-top:26px">
      <div class="row" style="grid-template-columns:140px minmax(0,1fr);border-top:0;padding-top:0"><div><b>Next</b></div><div>{{next}}</div></div>
      <div class="row" style="grid-template-columns:140px minmax(0,1fr)"><div><b>Still needed</b></div><div><sc-for list="{{missing}}" as="m"><div>{{m.label}} · <a href="#up" data-key="{{m.key}}">attach now</a></div></sc-for><sc-if value="{{!missing.length}}">Nothing · {{received}}</sc-if><input type="file" id="attfile" accept=".pdf,image/*,.doc,.docx,.xls,.xlsx,.txt" style="display:none"></div></div>
      <div class="row" style="grid-template-columns:140px minmax(0,1fr)"><div><b>You'll hear</b></div><div>{{hear}}</div></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:22px"><a class="btn p" href="SchoolPortal.dc.html">Back to the portal</a><a class="btn o" href="ReferralForm.dc.html">Refer another student</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":700}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
