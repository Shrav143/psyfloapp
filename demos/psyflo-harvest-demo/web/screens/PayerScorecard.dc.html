<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Psyflo — Payer scorecard</title></head>
<body>
<x-dc>
<helmet><style>
body{margin:0;background:#F8F6F2}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#C9D1D6;text-decoration:none;font-weight:500;font-size:14px;min-height:44px}
.nav:hover{background:#222A35;color:#fff}.nav.on{background:#217A78;color:#fff}
.nav .n{margin-left:auto;background:#2A3340;color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600}.nav.on .n{background:rgba(255,255,255,.22)}
.b3-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.b3-stat{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.b3-stat span{font-size:12px;line-height:16px;font-weight:600;color:var(--ink-3)}
.b3-stat b{font-size:28px;line-height:36px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:normal}
.b3-wrap{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.b3-wrap .u-tbl{border:0;border-radius:0;min-width:640px}
.b3-key{display:inline-flex;gap:14px;align-items:center;font-size:12px;line-height:16px;color:var(--ink-2);font-weight:500;margin-left:auto}
.b3-key i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.b3-key .req{border:1.5px solid var(--ink-3);background:var(--white)}.b3-key .aw{background:var(--teal)}
.b3-chart{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 20px}
@media (max-width:900px){.b3-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></helmet>
<div class="u-app"><aside style="flex:0 0 240px"></aside>
<main class="u-main">
  <div class="u-head">
    <h1 class="u-title">Payer scorecard</h1><span class="u-chip info">Sample data</span>
    <span class="u-sp"></span><a class="u-link" href="Roadmap.dc.html">Roadmap</a><span class="u-date">{{today}}</span>
  </div>
  <div class="b3-stats">
    <sc-for list="{{stats}}" as="t"><div class="b3-stat"><span>{{t.l}}</span><b>{{t.v}}</b></div></sc-for>
  </div>
  <h2 class="u-sec">By payer</h2>
  <div class="b3-wrap">
    <table class="u-tbl">
      <thead><tr><th scope="col">Payer</th><th scope="col">Partial rate</th><th scope="col">Awarded vs requested</th><th scope="col">Full denials</th><th scope="col">Decision days</th><th scope="col">Channel</th></tr></thead>
      <tbody>
        <sc-for list="{{payers}}" as="p">
          <tr><td style="font-weight:600">{{p.name}}</td><td><span class="u-chip {{p.chip}}">{{p.partial}}</span></td>
            <td>{{p.awarded}} <span class="u-bar" role="img" aria-label="{{p.awarded}}"><i style="width:{{p.awardedW}}"></i></span></td>
            <td>{{p.denials}}</td><td>{{p.days}}</td><td>{{p.channel}}</td></tr>
        </sc-for>
      </tbody>
    </table>
  </div>
  <h2 class="u-sec">Units by month <span class="b3-key"><span><i class="req"></i>Requested</span><span><i class="aw"></i>Awarded</span></span></h2>
  <div class="b3-chart">{{chart}}</div>
</main></div>
</x-dc>
</body>
</html>
