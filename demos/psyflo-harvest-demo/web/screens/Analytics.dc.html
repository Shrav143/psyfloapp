<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Psyflo — Analytics</title></head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F8F6F2}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#C9D1D6;text-decoration:none;font-weight:500;font-size:14px;min-height:44px}
.nav:hover{background:#222A35;color:#fff}.nav.on{background:#217A78;color:#fff}
.nav .n{margin-left:auto;background:#2A3340;color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600}.nav.on .n{background:rgba(255,255,255,.22)}
.b3-kpis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.6fr);gap:12px}
.b3-tile{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:4px;min-width:0}
.b3-lab{font-size:14px;line-height:20px;font-weight:600;color:var(--ink-2)}
.b3-big{font-size:44px;line-height:52px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:normal}
.b3-big small{font-size:16px;line-height:24px;font-weight:500;color:var(--ink-3);margin-left:6px;letter-spacing:0}
.b3-cap{font-size:12px;line-height:16px;color:var(--ink-3)}
.b3-wrap{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.b3-wrap .u-tbl{border:0;border-radius:0;min-width:520px}
.b3-num{font-variant-numeric:tabular-nums}
@media (max-width:760px){.b3-kpis{grid-template-columns:minmax(0,1fr)}}
</style>
</helmet>
<div class="u-app">
<aside style="flex:0 0 240px"></aside>
<main class="u-main">
  <div class="u-head">
    <h1 class="u-title">{{title}}</h1>
    <select class="u-sel" aria-label="Site" onChange="{{pickSite}}"><sc-for list="{{sites}}" as="o"><option value="{{o.id}}" {{o.sel}}>{{o.name}}</option></sc-for></select>
    <span class="u-sp"></span><span class="u-date">{{today}}</span>
  </div>

  <h2 class="u-sec" style="margin-top:8px">{{kpis}} <span class="u-chip info">Sample data</span></h2>
  <div class="b3-kpis">
    <div class="b3-tile"><span class="b3-lab">{{timelyLabel}}</span><span class="b3-big">{{timelyValue}}</span>{{timelyLine}}<span class="b3-cap">Weekly</span></div>
    <div class="b3-tile"><span class="b3-lab">{{minutesLabel}}</span><span class="b3-big">{{minutesValue}}<small>min</small></span>{{minutesLine}}<span class="b3-cap">Weekly</span></div>
    <div class="b3-tile"><span class="b3-lab">{{backlogLabel}}</span><span class="b3-big">{{backlog}}</span></div>
  </div>

  <h2 class="u-sec">{{outcomesTitle}} <span class="u-mut" style="font-weight:500">{{student}}</span> <span class="u-chip info">Sample data</span></h2>
  <div class="b3-wrap">
    <table class="u-tbl">
      <thead><tr><th scope="col">Measure</th><th scope="col">Start</th><th scope="col">Mid</th><th scope="col">Now</th><th scope="col">Trend</th></tr></thead>
      <tbody>
        <sc-for list="{{outcomes}}" as="o">
          <tr><td style="font-weight:600">{{o.name}}</td><td class="b3-num">{{o.a}}</td><td class="b3-num">{{o.b}}</td><td class="b3-num" style="font-weight:600">{{o.c}}</td><td><span class="u-chip {{o.chip}}">{{o.word}}</span></td></tr>
        </sc-for>
      </tbody>
    </table>
  </div>
</main>
</div>
</x-dc>
</body>
</html>
