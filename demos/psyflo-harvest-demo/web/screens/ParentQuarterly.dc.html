<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quarterly report — Harvest Outreach Center</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
/* shared phone look: C_CSS in js/screens/MobileApp.js */
.c-sig{border:1px dashed var(--ink-4);border-radius:12px;height:120px;background:var(--white);display:flex;align-items:center;justify-content:center;color:var(--ink-3);position:relative;overflow:hidden}.c-kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line)}.c-kv:first-child{border-top:0}
</style>
</helmet>
<div class="c-ph">
  {{hd}}
  <main class="c-bd">
    <section class="c-card" style="background:var(--teal-tint);border-color:var(--teal)"><div data-doc>{{summary}}</div></section>
    <section class="c-card"><sc-for list="{{facts}}" as="f"><div class="c-kv"><span class="c-mut">{{f.k}}</span><b>{{f.v}}</b></div></sc-for></section>
    <section class="c-card"><h2 class="c-sec">{{t.goals}}</h2>
      <sc-for list="{{goals}}" as="g"><div style="margin-top:10px"><b style="font-weight:600">{{g.name}}</b><div class="c-bar" style="margin-top:6px"><i style="width:{{g.pct}}%"></i></div></div></sc-for></section>
    <sc-if value="{{!full}}"><a class="c-lnk" href="#full">{{t.readFull}}</a></sc-if>
    <sc-if value="{{full}}"><div class="c-card c-sm" data-doc style="white-space:pre-line;color:var(--ink-2)">{{fullText}}</div><a class="c-lnk" href="#full">{{t.less}}</a></sc-if>
    <sc-if value="{{done}}"><section class="c-card" style="border-color:var(--teal)"><div style="font-size:18px;font-weight:700">{{done.title}}</div><div class="c-mut">{{done.sub}}</div><sc-if value="{{done.file}}"><div style="margin-top:8px"><a class="c-lnk" href="{{done.file}}" target="_blank" rel="noopener">{{t.copy}}</a></div></sc-if></section></sc-if>
    <sc-if value="{{!done}}">
      <div><label class="c-lbl" for="sig">{{t.signHere}}</label>
        <div class="c-sig"><canvas id="sig" aria-label="{{t.signHere}}" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair"></canvas><span id="sigph" style="pointer-events:none;position:relative">{{signer}}</span></div>
        <div style="display:flex;justify-content:flex-end;margin-top:6px"><a class="c-lnk" href="#clear" style="font-size:14px">{{t.clear}}</a></div></div>
    </sc-if>
  </main>
  <sc-if value="{{!done}}"><div style="padding:12px 20px 8px;flex:0 0 auto"><a class="c-btn pri lg" href="#sign">{{t.sign}}</a></div></sc-if>
  {{ft}}
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
