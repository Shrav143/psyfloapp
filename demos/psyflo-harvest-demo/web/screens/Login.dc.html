<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in — Psyflo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
.l-page{min-height:100vh;width:100%;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:24px 16px;font-family:'DM Sans',system-ui,sans-serif;color:var(--navy)}
.l-card{width:100%;max-width:460px;background:var(--white);border-radius:12px;padding:32px 36px;display:flex;flex-direction:column;gap:14px}
.l-org{font-size:12px;line-height:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.l-card label{display:block;font-size:12px;line-height:16px;font-weight:600;margin-bottom:4px}
.l-card .u-in{width:100%;min-height:44px}
.l-roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.l-role{min-height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--white);font:600 14px/20px 'DM Sans',system-ui,sans-serif;color:var(--navy);text-align:left;cursor:pointer}
.l-role.on{border-color:var(--teal);background:var(--teal-tint);color:var(--teal-dark)}
.l-link{color:var(--teal-dark);font-weight:600;text-decoration:none}
.l-link:hover{text-decoration:underline}
.l-sep{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:14px}
</style>
</helmet>

<div class="l-page">
  <div class="l-card">
    <svg role="img" aria-label="psyflo" viewBox="0 0 3191 1060" width="110" height="37"><g transform="translate(-6.0,780.0) scale(1,-1)"><path d="M66 -220V504H186L201 434Q217 456 239.0 474.5Q261 493 291.5 504.5Q322 516 363 516Q434 516 488.0 481.0Q542 446 573.5 386.5Q605 327 605 251Q605 175 573.0 115.5Q541 56 487.0 22.0Q433 -12 364 -12Q308 -12 267.5 8.5Q227 29 201 65V-220ZM332 106Q372 106 402.5 124.0Q433 142 450.0 175.0Q467 208 467 251Q467 294 450.0 327.5Q433 361 402.5 379.5Q372 398 332 398Q293 398 262.5 379.5Q232 361 214.5 328.0Q197 295 197 252Q197 209 214.5 175.5Q232 142 262.5 124.0Q293 106 332 106Z" fill="#151B24"></path></g><g transform="translate(624.0,780.0) scale(1,-1)"><path d="M272 -12Q203 -12 152.0 10.0Q101 32 72.0 71.0Q43 110 39 159H173Q178 140 190.0 124.5Q202 109 222.0 100.0Q242 91 270 91Q297 91 314.0 98.5Q331 106 339.5 119.0Q348 132 348 146Q348 167 336.0 178.5Q324 190 301.0 197.0Q278 204 245 211Q209 218 174.5 228.5Q140 239 113.0 255.0Q86 271 70.0 296.0Q54 321 54 358Q54 403 78.0 438.5Q102 474 148.0 495.0Q194 516 259 516Q350 516 403.0 475.0Q456 434 466 362H339Q333 385 312.5 398.5Q292 412 258 412Q222 412 203.0 399.0Q184 386 184 365Q184 351 196.5 340.0Q209 329 232.0 321.5Q255 314 288 307Q346 295 390.0 279.5Q434 264 459.0 235.5Q484 207 484 153Q484 105 458.0 67.5Q432 30 384.5 9.0Q337 -12 272 -12Z" fill="#151B24"></path></g><g transform="translate(1105.0,780.0) scale(1,-1)"><path d="M130 -220 252 56H222L20 504H167L311 179L441 504H584L273 -220Z" fill="#151B24"></path></g><g transform="translate(1734.0,780.0) scale(1,-1)"><path d="M89 0V549Q89 612 110.0 649.0Q131 686 170.5 703.0Q210 720 263 720H325V605H283Q251 605 237.5 592.5Q224 580 224 549V0ZM20 391V504H333V391Z" fill="#5FC0BE"></path></g><g transform="translate(2080.0,780.0) scale(1,-1)"><path d="M66 0V720H201V0Z" fill="#5FC0BE"></path></g><g transform="translate(2322.0,780.0) scale(1,-1)"><path d="M304 -12Q232 -12 174.5 21.5Q117 55 83.5 114.5Q50 174 50 251Q50 330 83.5 389.5Q117 449 175.0 482.5Q233 516 305 516Q378 516 435.5 482.5Q493 449 526.5 389.5Q560 330 560 252Q560 174 526.5 114.5Q493 55 435.0 21.5Q377 -12 304 -12ZM304 105Q338 105 364.5 121.0Q391 137 406.5 170.0Q422 203 422 252Q422 301 406.5 333.5Q391 366 364.5 382.5Q338 399 305 399Q273 399 246.0 382.5Q219 366 203.5 333.5Q188 301 188 252Q188 203 203.5 170.0Q219 137 245.5 121.0Q272 105 304 105Z" fill="#5FC0BE"></path></g><g transform="translate(2922.0,780.0) scale(1,-1)"><path d="M127 -5Q89 -5 66.0 17.5Q43 40 43 73Q43 106 66.0 128.5Q89 151 127 151Q163 151 186.0 128.5Q209 106 209 73Q209 40 186.0 17.5Q163 -5 127 -5Z" fill="#F0B44C"></path></g></svg>
    <div class="l-org">Harvest Outreach Center</div>
    <div><label for="email">Work email</label><input class="u-in" id="email" autocomplete="username" value="{{email}}" onInput="{{setEmail}}"></div>
    <div><label for="pw">Password</label><input class="u-in" id="pw" type="password" autocomplete="current-password" value="demo-password"></div>
    <a class="u-btn pri" href="#signin" style="min-height:44px">Sign in</a>
    <sc-if value="{{err}}"><div role="alert" style="color:var(--late-fg);font-weight:600;font-size:13px">{{err}}</div></sc-if>
    <div class="l-roles">
      <button type="button" class="l-role{{on_direct_support}}" onClick="{{pickDS}}">Direct support</button>
      <button type="button" class="l-role{{on_clinician}}" onClick="{{pickCL}}">Clinician</button>
      <button type="button" class="l-role{{on_supervisor}}" onClick="{{pickSV}}">Supervisor</button>
      <button type="button" class="l-role{{on_admin}}" onClick="{{pickAD}}">Admin</button>
    </div>
    <div class="l-sep"><a class="l-link" href="#family">Family portal</a><a class="l-link" href="#counselor">School counselor</a></div>
    <div class="l-sep" style="font-size:13px"><a class="l-link" href="#sso">Sign in with Google Workspace</a><a class="l-link" href="#forgot">Forgot password</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
