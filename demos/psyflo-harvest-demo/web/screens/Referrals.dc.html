<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Psyflo — Intake</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F8F6F2;color:#151B24;font-family:'DM Sans',system-ui,sans-serif;font-size:14px;line-height:1.45}
*{box-sizing:border-box}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#C9D1D6;text-decoration:none;font-weight:500;font-size:14px;min-height:44px}
.nav:hover{background:#222A35;color:#fff}
.nav.on{background:#217A78;color:#fff}
.nav .n{margin-left:auto;background:#2A3340;color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600}
.nav.on .n{background:rgba(255,255,255,.22)}
</style>
</helmet>
<div class="u-app">
  <aside style="flex:0 0 240px"></aside>
  <main class="u-main">
    <div class="u-head">
      <h1 class="u-title">Authorizations</h1>
      <div class="u-seg" role="group" aria-label="View"><a href="{{segReq}}">{{viewReq}}</a><a class="on" href="{{segIntake}}" aria-current="page">{{viewIntake}}</a></div>
      <span class="u-sp"></span>
      <span class="u-date">{{dateText}}</span>
    </div>
    <div class="u-filters b1-filters">
      <select id="f-site" class="u-sel" aria-label="Site" onChange="{{setSite}}"><sc-for list="{{siteOpts}}" as="o"><option value="{{o.v}}" {{o.sel}}>{{o.t}}</option></sc-for></select>
      <select id="f-status" class="u-sel" aria-label="Status" onChange="{{setStatus}}"><sc-for list="{{statusOpts}}" as="o"><option value="{{o.v}}" {{o.sel}}>{{o.t}}</option></sc-for></select>
      <select id="f-fund" class="u-sel" aria-label="Funding source" onChange="{{setFunding}}"><sc-for list="{{fundOpts}}" as="o"><option value="{{o.v}}" {{o.sel}}>{{o.t}}</option></sc-for></select>
      <label class="u-tog"><input id="f-mine" type="checkbox" {{mine}} onChange="{{setMine}}"> {{mineLabel}}</label>
    </div>
    <table class="u-tbl b1-tbl">
      <thead><tr><th>Student</th><th>School</th><th>Funding source</th><th>Stage</th><th>Status</th><th aria-label="Action"></th></tr></thead>
      <tbody>
        <sc-for list="{{rows}}" as="r">
          <tr class="click" data-row="{{r.id}}" onClick="{{r.open}}">
            <td class="u-b">{{r.student}}</td>
            <td>{{r.school}}</td>
            <td>{{r.funding}}</td>
            <td>{{r.stage}}</td>
            <td><span class="b1-st"><span class="{{r.chipCls}}">{{r.status}}</span><span class="u-mut u-sm">{{r.clock}}</span></span></td>
            <td><a class="{{r.btnCls}}" href="{{r.href}}">{{r.btn}}</a></td>
          </tr>
        </sc-for>
      </tbody>
    </table>
    <sc-if value="{{empty}}"><p class="u-mut" style="margin:16px 0">Nothing here.</p></sc-if>
  </main>
</div>
</x-dc>
</body>
</html>
