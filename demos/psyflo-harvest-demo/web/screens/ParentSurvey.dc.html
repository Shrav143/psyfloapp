<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>2-minute check-in — Harvest Outreach Center</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
/* shared phone look: C_CSS in js/screens/MobileApp.js */
.c-q2{font-size:16px;line-height:24px;font-weight:600;margin:0 0 8px}
</style>
</helmet>
<div class="c-ph">
  {{hd}}
  <main class="c-bd">
    <div class="c-mut">{{t.sub}}</div>
    <sc-for list="{{qs}}" as="q"><div><div class="c-q2">{{q.label}}</div><div class="c-rad pill"><sc-for list="{{q.opts}}" as="o"><label class="{{o.cls}}"><input type="radio" name="{{q.key}}" value="{{o.v}}" {{o.chk}} onChange="{{o.pick}}">{{o.label}}</label></sc-for></div></div></sc-for>
    <div><label class="c-lbl" for="note">{{t.note}}</label><input class="c-in" id="note" type="text" placeholder="{{t.optional}}" value="{{note}}" onInput="{{setNote}}"></div>
  </main>
  <div style="padding:12px 20px 8px;flex:0 0 auto"><a class="c-btn pri lg" href="#next">{{t.next}}</a></div>
  {{ft}}
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
