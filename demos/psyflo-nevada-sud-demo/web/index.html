<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Psyflo · Community Counseling Center of Southern Nevada</title>
<meta name="theme-color" content="#151B24">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* App shell: product screens keep their own look; the generated sidebar carries search, help and the signed-in user. */
html,body{min-height:100%}
body{background:#F8F6F2;color:#151B24;margin:0;font-family:'DM Sans',system-ui,sans-serif}
.sr{position:absolute;left:-9999px}
#stage{min-height:100vh}
#stage.phone{background:#DEDAD3;padding:24px 0 40px;display:flex;justify-content:center}
#stage.phone #root{width:390px;border-radius:36px;border:10px solid #151B24;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.18);background:#F8F6F2;align-self:flex-start}
#stage.msg{display:flex;justify-content:center;padding:60px 16px}
.denied{max-width:520px;background:#fff;border:1px solid #E6E1D9;border-radius:12px;padding:24px 28px}
.denied h1{font-size:22px;margin:0 0 8px}
#drawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,100vw);background:#fff;color:#151B24;z-index:70;box-shadow:-8px 0 30px rgba(0,0,0,.2);padding:52px 24px 24px;overflow:auto;white-space:pre-line;font-size:14px;line-height:1.55}
#drawer h2{margin:0 0 12px;font-size:16px}
#drawer .x{position:absolute;top:12px;right:16px;font:inherit;border:1px solid #D9D4CC;background:#fff;border-radius:8px;min-height:36px;padding:0 12px;cursor:pointer}
#drawer[hidden],#modal[hidden]{display:none}
#modal{position:fixed;inset:0;background:rgba(21,27,36,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
#modal .mbox{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:22px 24px;max-height:90vh;overflow:auto;font-size:14px;line-height:1.5}
#modal h2{margin:0 0 8px;font-size:18px}
.mbtn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border-radius:8px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;border:1px solid #D9D4CC;background:#fff;color:#151B24;text-align:left}
.mbtn.p{background:#217A78;color:#fff;border-color:#217A78}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#151B24;color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:min(560px,92vw)}
.toast.err{background:#8A2E1C}
pre.err{padding:20px;color:#8A2E1C;white-space:pre-wrap}

.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#C9D1D6;text-decoration:none;font-weight:500;font-size:14px;min-height:44px}
.nav:hover{background:#222A35;color:#fff}
.nav.on{background:#217A78;color:#fff}
.nav .n{margin-left:auto;background:#2A3340;color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600}
.nav.on .n{background:rgba(255,255,255,.22)}
#psf-side .nav{min-height:36px;padding:6px 12px}
#psf-side a:focus-visible,#psf-side button:focus-visible{outline:2px solid #5FC0BE;outline-offset:2px}
.gs{display:flex;align-items:center;gap:10px;margin:16px 0 4px;min-height:40px;padding:0 12px;border-radius:8px;border:1px solid #2F3948;background:#1B232E;color:#C9D1D6;font:inherit;font-size:14px;cursor:pointer;width:100%;text-align:left}
.gs:hover{background:#222A35;color:#fff}
.gs span{flex:1}
kbd,.k{font:inherit;font-size:11px;border:1px solid #3C4756;border-radius:5px;padding:1px 6px;color:#8E99A6;background:transparent}
.k{color:#525B66;border-color:#D9D4CC}
#psf-side .nav{cursor:pointer}
#search{position:fixed;inset:0;background:rgba(21,27,36,.45);z-index:85;display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
#search .sbox{background:#fff;border-radius:14px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
#search .sin{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #E6E1D9;color:#525B66}
#search input{flex:1;border:0;outline:0;font:inherit;font-size:16px;min-height:54px;background:transparent;color:#151B24}
#search .sres{max-height:52vh;overflow:auto;padding:6px}
#search .sg{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#525B66;padding:10px 10px 4px;font-weight:600}
#search .sr1{display:flex;align-items:baseline;gap:10px;padding:9px 10px;border-radius:8px;color:#151B24;text-decoration:none;font-size:14px}
#search .sr1 span{color:#525B66;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#search .sr1.on,#search .sr1:hover{background:#F2F9F8}
.segm{display:flex;flex-wrap:wrap}
.segm button{border:1px solid #D9D4CC;background:#fff;color:#151B24;font:inherit;font-size:13px;font-weight:600;padding:0 12px;min-height:38px;cursor:pointer;margin:0 -1px -1px 0}
.segm button.on{background:#151B24;color:#fff;border-color:#151B24;position:relative}
.segm button:hover:not(.on){background:#F3F0EA}
@media (max-width:700px){#stage.phone{padding:0;background:#F8F6F2}#stage.phone #root{width:100%;border:0;border-radius:0;box-shadow:none}}
@media (prefers-reduced-motion:no-preference){#root{animation:fade .16s ease}}
@keyframes fade{from{opacity:.5}to{opacity:1}}
</style>
<style id="scrcss"></style>
</head>
<body>
<div id="stage"><div id="root"><div style="padding:40px;color:#525B66">Loading the demo…</div></div></div>
<aside id="drawer" hidden><button class="x" id="close">Close</button><h2 id="dtitle"></h2><div id="dtext"></div></aside>
<div id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
